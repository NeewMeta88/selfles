<script>
    (function () {
        var sliderRefreshRequested = false;
        var productLayoutInlineStylesCleared = false;
        var productMainImageRefreshRequested = false;

        function isProductPage() {
            return location.pathname.indexOf('/catalog/tproduct/') !== -1 ||
                location.pathname.indexOf('/tproduct/') !== -1 ||
                location.pathname.indexOf('/product/') !== -1;
        }

        function findOne(selectors, root) {
            root = root || document;

            for (var i = 0; i < selectors.length; i++) {
                var el = root.querySelector(selectors[i]);
                if (el) return el;
            }

            return null;
        }

        function allNodes(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function isUnsafeProductTabsRoot(node) {
            if (!node || node === document.body || node === document.documentElement) return true;
            if (node.id === 'allrecords') return true;
            if (node.getAttribute && node.getAttribute('data-hook') === 'blocks-collection-content-node') return true;
            if (node.classList && (
                node.classList.contains('t-records') ||
                node.classList.contains('selfles-product-main-layout') ||
                node.classList.contains('selfles-product-main-layout__info') ||
                node.classList.contains('selfles-product-main-layout__gallery')
            )) return true;

            return false;
        }

        function restoreAccidentallyHiddenPageRoots() {
            allNodes('#allrecords.selfles-tilda-tabs-hidden, .t-records.selfles-tilda-tabs-hidden, [data-hook="blocks-collection-content-node"].selfles-tilda-tabs-hidden').forEach(function (node) {
                node.classList.remove('selfles-tilda-tabs-hidden');

                if (node.style) {
                    node.style.removeProperty('display');
                }
            });
        }

        function closestCommonParent(a, b) {
            var node = a;

            while (node && node !== document.body) {
                if (node.contains(b)) return node;
                node = node.parentElement;
            }

            return null;
        }

        function fixProductOuterContainerFluid() {
            if (!isProductPage()) return;

            var productNodes = allNodes([
                '.selfles-product-main-layout',
                '.t-store__prod__info',
                '.t-store__prod-popup__info',
                '.t-store__prod-snippet__info',
                '.t-store__prod__slider',
                '.t-store__prod-popup__slider',
                '.t-store__prod-snippet__gallery'
            ].join(','));

            productNodes.forEach(function (node) {
                var container = node.closest('.t-container');

                if (!container) return;
                if (container.closest('.t-store__relevants__container')) return;
                if (container.closest('.t-store__cart, .t706, .t706__cartwin')) return;
                if (container.querySelector('.t-store__grid-cont, .js-store-grid-cont')) return;

                container.classList.add('t-container_fluid');
                container.classList.add('selfles-product-fluid-container');
            });
        }

        function fixProductLayout() {
            if (!isProductPage()) return;

            if (document.body) {
                document.body.classList.add('selfles-product-page');
            }

            var info = findOne([
                '.t-store__prod__info',
                '.t-store__prod-popup__info',
                '.t-store__prod-snippet__info'
            ]);

            var gallery = findOne([
                '.t-store__prod__slider',
                '.t-store__prod-popup__slider',
                '.t-store__prod-snippet__gallery'
            ]);

            if (!info || !gallery) return;

            var parent = closestCommonParent(info, gallery);

            if (!parent) return;

            parent.classList.add('selfles-product-main-layout');
            gallery.classList.add('selfles-product-main-layout__gallery');
            info.classList.add('selfles-product-main-layout__info');
        }

        function extractImageUrl(node) {
            var value;
            var bg;
            var match;

            if (!node) return '';

            value = node.getAttribute('data-original') ||
                node.getAttribute('data-img-zoom-url') ||
                node.getAttribute('data-zoom-url') ||
                node.getAttribute('data-src') ||
                node.getAttribute('src') ||
                node.getAttribute('content') ||
                '';

            if (value && value.indexOf('data:image') !== 0) return value;

            bg = window.getComputedStyle ? window.getComputedStyle(node).backgroundImage : '';

            if ((!bg || bg === 'none') && node.style) {
                bg = node.style.backgroundImage || '';
            }

            match = bg && bg.match(/url\(["']?([^"')]+)["']?\)/);
            value = match && match[1] ? match[1] : '';

            return value && value.indexOf('data:image') !== 0 ? value : '';
        }

        function hasBackgroundImage(node) {
            var bg;

            if (!node) return false;

            bg = window.getComputedStyle ? window.getComputedStyle(node).backgroundImage : '';

            if ((!bg || bg === 'none') && node.style) {
                bg = node.style.backgroundImage || '';
            }

            return !!(bg && bg !== 'none' && bg.indexOf('url(') !== -1);
        }

        function getProductMainImageUrl(gallery) {
            var selectors = [
                '.t-slds__thumbsbullet_active .t-slds__bgimg',
                '.t-slds__thumbsbullet .t-slds__bgimg',
                '.t-slds__item_active .t-slds__bgimg',
                '.t-slds__item:first-child .t-slds__bgimg'
            ];
            var i;
            var node;
            var value;
            var meta;

            if (!gallery) return '';

            for (i = 0; i < selectors.length; i++) {
                node = gallery.querySelector(selectors[i]);
                value = extractImageUrl(node);

                if (value) return value;
            }

            meta = document.querySelector('meta[itemprop="image"]');
            value = extractImageUrl(meta);

            if (value) return value;

            meta = document.querySelector('meta[property="og:image"]');

            return extractImageUrl(meta);
        }

        function requestProductMainImageRefresh(gallery) {
            if (productMainImageRefreshRequested || !window.t_slds_updateSlider) return;

            productMainImageRefreshRequested = true;
            requestAnimationFrame(function () {
                gallery.querySelectorAll('.t-slds').forEach(function (slider) {
                    try {
                        window.t_slds_updateSlider(slider);
                    } catch (e) {
                    }
                });
            });
        }

        function repairProductMainImage(gallery) {
            var imageUrl = getProductMainImageUrl(gallery);
            var activeSlide;
            var targetBg;
            var changed = false;

            if (!imageUrl) return;

            activeSlide = gallery.querySelector('.t-slds__item_active') ||
                gallery.querySelector('.t-slds__item:first-child');
            targetBg = activeSlide ? activeSlide.querySelector('.t-slds__bgimg') : null;

            if (targetBg && !hasBackgroundImage(targetBg)) {
                targetBg.style.setProperty('background-image', 'url("' + imageUrl + '")', 'important');
                targetBg.style.setProperty('background-size', 'cover', 'important');
                targetBg.style.setProperty('background-position', 'center center', 'important');
                targetBg.style.setProperty('background-repeat', 'no-repeat', 'important');
                changed = true;
            }

            if (changed) {
                requestProductMainImageRefresh(gallery);
            }
        }

        function clearProductLayoutInlineStyles() {
            if (productLayoutInlineStylesCleared) return;

            allNodes([
                '.selfles-product-main-layout',
                '.selfles-product-main-layout__gallery',
                '.selfles-product-main-layout__info',
                '.selfles-product-main-layout__gallery .t-store__prod__slider',
                '.selfles-product-main-layout__gallery .t-store__prod-popup__slider',
                '.selfles-product-main-layout__gallery .t-store__prod-snippet__gallery',
                '.selfles-product-main-layout__gallery .t-slds',
                '.selfles-product-main-layout__gallery .t-slds__main',
                '.selfles-product-main-layout__gallery .t-slds__container',
                '.selfles-product-main-layout__gallery .t-slds__item',
                '.selfles-product-main-layout__gallery .t-slds__wrapper',
                '.selfles-product-main-layout__gallery .t-slds__imgwrapper',
                '.selfles-product-main-layout__gallery .t-slds__bgimg'
            ].join(',')).forEach(function (node) {
                [
                    '--selfles-page-pad',
                    '--selfles-product-gap',
                    '--selfles-info-width',
                    '--selfles-gallery-width',
                    '--selfles-gallery-height',
                    'display',
                    'align-items',
                    'width',
                    'max-width',
                    'height',
                    'min-height',
                    'max-height',
                    'margin-left',
                    'margin-right',
                    'margin-bottom',
                    'grid-template-columns',
                    'column-gap',
                    'gap',
                    'flex-basis',
                    'overflow',
                    'padding-bottom',
                    'box-sizing'
                ].forEach(function (prop) {
                    node.style.removeProperty(prop);
                });

                if (node.classList && node.classList.contains('t-slds__container')) {
                    node.style.removeProperty('background-image');
                    node.style.removeProperty('background-size');
                    node.style.removeProperty('background-position');
                    node.style.removeProperty('background-repeat');
                }
            });

            productLayoutInlineStylesCleared = true;
        }

        function applyProductFigmaSizes() {
            if (!isProductPage()) return;

            var gallery = document.querySelector('.selfles-product-main-layout__gallery');

            if (!gallery) return;

            clearProductLayoutInlineStyles();
            repairProductMainImage(gallery);
        }

        function requestProductSliderRefresh() {
            if (!isProductPage()) return;

            if (!window.t_slds_updateSlider) return;

            requestAnimationFrame(function () {
                document.querySelectorAll('.selfles-product-main-layout__gallery .t-slds').forEach(function (slider) {
                    try {
                        window.t_slds_updateSlider(slider);
                    } catch (e) {
                    }
                });
            });
        }

        function fixBuyZone() {
            if (!isProductPage()) return;

            var info = findOne([
                '.t-store__prod__info',
                '.t-store__prod-popup__info',
                '.t-store__prod-snippet__info'
            ]);

            if (!info) return;

            var descr = findOne([
                '.t-store__prod__descr',
                '.t-store__prod-popup__descr',
                '.t-store__prod__text',
                '.js-store-prod-text'
            ], info);

            var zone = info.querySelector('.selfles-buy-zone');

            if (!zone) {
                zone = document.createElement('div');
                zone.className = 'selfles-buy-zone';

                if (descr) {
                    descr.insertAdjacentElement('afterend', zone);
                } else {
                    info.appendChild(zone);
                }
            }

            var quantity = findOne([
                '.t-store__prod__quantity',
                '.t-store__prod-popup__quantity',
                '.js-store-prod-quantity',
                '.t-store__prod-popup__quantity-wrapper'
            ], info);

            var price = findOne([
                '.js-store-price-wrapper',
                '.t-store__prod-popup__price-wrapper',
                '.t-store__prod__price-wrapper',
                '.t-store__prod-popup__price',
                '.t-store__prod__price',
                '.js-store-prod-price'
            ], info);

            var button = findOne([
                '.t-store__prod-popup__btn-wrapper',
                '.t-store__prod__btn-wrapper',
                '.js-store-prod-popup-buy-btn-wrapper',
                '.t-store__prod-popup__btn',
                '.t-store__prod__btn',
                '.js-store-prod-popup-buy-btn'
            ], info);

            if (quantity) {
                quantity.style.setProperty('display', 'flex', 'important');
                quantity.style.setProperty('visibility', 'visible', 'important');
                quantity.style.removeProperty('opacity');
                quantity.style.removeProperty('margin-bottom');

                if (quantity.parentElement !== zone) {
                    zone.insertBefore(quantity, zone.firstChild);
                } else if (zone.firstChild !== quantity) {
                    zone.insertBefore(quantity, zone.firstChild);
                }
            }

            if (price && price.parentElement !== zone) {
                zone.appendChild(price);
            }

            if (button && button.parentElement !== zone) {
                zone.appendChild(button);
            }
        }

        function fixCurrencyText() {
            document.querySelectorAll('.selfles-buy-zone .t-store__prod-popup__price-currency, .selfles-buy-zone .t-store__prod__price-currency').forEach(function (el) {
                el.textContent = '\u20bd';
            });
        }

        function normalizeProductTabText(value) {
            return String(value || '')
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getProductTabKey(value) {
            return normalizeProductTabText(value).toLowerCase();
        }

        function findProductTabsRoot() {
            restoreAccidentallyHiddenPageRoots();

            var selectors = [
                '.t-store__tabs',
                '.t-store__prod__tabs',
                '.t-store__prod-popup__tabs',
                '.t-store__prod-tabs',
                '.js-store-tabs',
                '.t-tabs',
                '[role="tablist"]'
            ];

            for (var i = 0; i < selectors.length; i++) {
                var nodes = document.querySelectorAll(selectors[i]);

                for (var j = 0; j < nodes.length; j++) {
                    var node = nodes[j];

                    if (node.closest('.selfles-product-details')) continue;
                    if (isUnsafeProductTabsRoot(node)) continue;

                    var text = getProductTabKey(node.textContent);

                    if (text.indexOf('подробнее') !== -1 && text.indexOf('правила ухода') !== -1) {
                        return node;
                    }
                }
            }

            var titleNodes = Array.prototype.slice.call(document.querySelectorAll(
                '[role="tab"], button, a, .t-store__tabs__item, .t-tabs__item, .t-store__tabs__button, div, span'
            )).filter(function (node) {
                if (node.closest('.selfles-product-details')) return false;
                if (isUnsafeProductTabsRoot(node)) return false;

                var text = getProductTabKey(node.textContent);

                return text === 'подробнее' || text === 'правила ухода';
            });

            for (var k = 0; k < titleNodes.length; k++) {
                var candidate = titleNodes[k];

                while (candidate && candidate !== document.body) {
                    if (isUnsafeProductTabsRoot(candidate)) break;

                    var candidateText = getProductTabKey(candidate.textContent);

                    if (
                        candidateText.indexOf('подробнее') !== -1 &&
                        candidateText.indexOf('правила ухода') !== -1
                    ) {
                        return candidate;
                    }

                    candidate = candidate.parentElement;
                }
            }

            return null;
        }

        function findProductTabTitles(root) {
            var wanted = {
                'подробнее': true,
                'правила ухода': true
            };

            return Array.prototype.slice.call(root.querySelectorAll(
                '[role="tab"], button, a, .t-store__tabs__item, .t-tabs__item, .t-store__tabs__button, div, span'
            )).filter(function (node) {
                var text = getProductTabKey(node.textContent);

                return wanted[text];
            });
        }

        function findProductTabPanel(root, titleNode, index) {
            var panelId = titleNode.getAttribute('aria-controls');
            var href = titleNode.getAttribute('href');

            if (!panelId && href && href.charAt(0) === '#') {
                panelId = href.slice(1);
            }

            if (panelId) {
                var byId = document.getElementById(panelId);

                if (byId) return byId;
            }

            var dataValue = titleNode.getAttribute('data-tab') ||
                titleNode.getAttribute('data-tab-id') ||
                titleNode.getAttribute('data-tab-index');

            if (dataValue) {
                var byData = root.querySelector(
                    '[data-tab-content="' + dataValue + '"], ' +
                    '[data-tab-id="' + dataValue + '"], ' +
                    '[data-tab-index="' + dataValue + '"]'
                );

                if (byData && byData !== titleNode) return byData;
            }

            var panels = Array.prototype.slice.call(root.querySelectorAll(
                '[role="tabpanel"], ' +
                '.t-store__tabs__content, ' +
                '.t-store__tabs__content-item, ' +
                '.t-store__prod__tabs-content, ' +
                '.t-store__prod-popup__tabs-content, ' +
                '.t-tabs__content, ' +
                '.t-tabs__content-item, ' +
                '.t-tab__content'
            )).filter(function (node) {
                var text = getProductTabKey(node.textContent);

                return text && text !== 'подробнее' && text !== 'правила ухода';
            });

            if (panels[index]) return panels[index];

            var next = titleNode.nextElementSibling;

            while (next) {
                var nextText = getProductTabKey(next.textContent);

                if (nextText && nextText !== 'подробнее' && nextText !== 'правила ухода') {
                    return next;
                }

                next = next.nextElementSibling;
            }

            return null;
        }

        function buildProductDetailsItem(title, content, isOpen) {
            var item = document.createElement('div');
            item.className = 'selfles-product-details__item' + (isOpen ? ' is-open' : '');

            var button = document.createElement('button');
            button.className = 'selfles-product-details__title';
            button.type = 'button';
            button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            button.textContent = title;

            var body = document.createElement('div');
            body.className = 'selfles-product-details__body';
            body.innerHTML = content.innerHTML;

            button.addEventListener('click', function () {
                var open = !item.classList.contains('is-open');

                item.classList.toggle('is-open', open);
                button.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            item.appendChild(button);
            item.appendChild(body);

            return item;
        }

        function moveProductDetailsTabs() {
            if (!isProductPage()) return;

            restoreAccidentallyHiddenPageRoots();

            var info = document.querySelector('.selfles-product-main-layout__info');
            var buyZone = info ? info.querySelector('.selfles-buy-zone') : null;
            var tabsRoot = findProductTabsRoot();

            if (!info || !buyZone || !tabsRoot || isUnsafeProductTabsRoot(tabsRoot)) return;

            var titleNodes = findProductTabTitles(tabsRoot);
            var tabs = [];

            titleNodes.forEach(function (titleNode, index) {
                var title = normalizeProductTabText(titleNode.textContent);
                var key = getProductTabKey(title);

                if (key !== 'подробнее' && key !== 'правила ухода') return;
                if (tabs.some(function (tab) {
                    return getProductTabKey(tab.title) === key;
                })) return;

                var panel = findProductTabPanel(tabsRoot, titleNode, index);

                if (!panel || !normalizeProductTabText(panel.textContent)) return;

                tabs.push({
                    title: title,
                    content: panel
                });
            });

            tabs.sort(function (a, b) {
                var order = {
                    'подробнее': 0,
                    'правила ухода': 1
                };

                return order[getProductTabKey(a.title)] - order[getProductTabKey(b.title)];
            });

            if (!tabs.length) return;

            var existing = info.querySelector('.selfles-product-details');

            if (existing && existing.getAttribute('data-selfles-built') === '1') {
                tabsRoot.classList.add('selfles-tilda-tabs-hidden');
                tabsRoot.style.setProperty('display', 'none', 'important');
                return;
            }

            if (existing) existing.remove();

            var details = document.createElement('div');
            details.className = 'selfles-product-details';
            details.setAttribute('data-selfles-built', '1');

            tabs.forEach(function (tab, index) {
                details.appendChild(buildProductDetailsItem(tab.title, tab.content, index === 0));
            });

            buyZone.insertAdjacentElement('afterend', details);

            tabsRoot.classList.add('selfles-tilda-tabs-hidden');
            tabsRoot.style.setProperty('display', 'none', 'important');
        }

        function hideProductMetaLines() {
            if (!isProductPage()) return;

            var info = findOne([
                '.selfles-product-main-layout__info',
                '.t-store__prod__info',
                '.t-store__prod-popup__info',
                '.t-store__prod-snippet__info'
            ]);

            if (!info) return;

            Array.prototype.slice.call(info.querySelectorAll(
                '.js-store-prod-dimensions, ' +
                '.js-store-prod-weight'
            )).forEach(function (el) {
                el.style.display = 'none';
            });

            Array.prototype.slice.call(info.querySelectorAll('.js-store-prod-all-charcs')).forEach(function (el) {
                var text = el.textContent.replace(/\s+/g, ' ').trim();

                if (
                    !text ||
                    /^цвет\s*:/.test(text.toLowerCase()) ||
                    /д\s*[×xх]\s*ш\s*[×xх]\s*в/i.test(text) ||
                    /^\s*(цвет|размер|вес|д\s*[×xх]\s*ш\s*[×xх]\s*в)/i.test(text)
                ) {
                    el.style.display = 'none';
                }
            });

            var patterns = [
                /^цвет\s*:?\s*(белый|зелёный|розовый|кофейный|голубой|сливочный)$/i,
                /^размер\s*:?\s*.+$/i,

                // простые размеры: 160×200, 180 x 210, 220х240
                /^(160|180|200|220|150)\s*[×xх]\s*\d+/i,

                // габариты: ДхШхВ: 180×200×30 мм
                /^д\s*[×xх]\s*ш\s*[×xх]\s*в\s*:?\s*\d+\s*[×xх]\s*\d+\s*[×xх]\s*\d+\s*(мм|см)?$/i,

                // габариты без подписи: 180×200×30 мм
                /^\d+\s*[×xх]\s*\d+\s*[×xх]\s*\d+\s*(мм|см)?$/i,

                // вес: Вес: 1200 г, Вес: 1.2 кг
                /^вес\s*:?\s*[\d.,]+\s*(г|гр|кг)?$/i
            ];

            Array.prototype.slice.call(info.querySelectorAll('div, span, p, li')).forEach(function (el) {
                if (
                    el.closest('.selfles-product-options') ||
                    el.closest('.selfles-product-details') ||
                    el.closest('.selfles-buy-zone') ||
                    el.querySelector('a, button, select, input, textarea')
                ) {
                    return;
                }

                var text = el.textContent.replace(/\s+/g, ' ').trim();

                if (!text || text.length > 120) return;

                var shouldHide = patterns.some(function (pattern) {
                    return pattern.test(text);
                });

                if (shouldHide) {
                    el.style.display = 'none';
                }
            });
        }

        function runProductLayout() {
            restoreAccidentallyHiddenPageRoots();
            fixProductOuterContainerFluid();
            fixProductLayout();
            applyProductFigmaSizes();
            fixBuyZone();
            moveProductDetailsTabs();
            fixCurrencyText();
            hideProductMetaLines();

            if (!sliderRefreshRequested) {
                sliderRefreshRequested = true;
                requestProductSliderRefresh();
            }
        }

        function startProductLayout() {
            runProductLayout();

            var tries = 0;
            var timer = setInterval(function () {
                tries++;
                runProductLayout();

                if (tries > 60) {
                    clearInterval(timer);
                }
            }, 250);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startProductLayout);
        } else {
            startProductLayout();
        }

        window.addEventListener('load', runProductLayout);
        window.addEventListener('resize', runProductLayout);
    })();
</script>

<script>
    (function () {
        var lastTargetQty = null;

        function isProductPage() {
            return location.pathname.indexOf('/catalog/tproduct/') !== -1 ||
                location.pathname.indexOf('/tproduct/') !== -1 ||
                location.pathname.indexOf('/product/') !== -1;
        }

        function getSelectedQty() {
            var input = document.querySelector('.selfles-buy-zone .t-store__prod__quantity-input');

            if (!input) return 1;

            var qty = parseInt(input.value, 10);

            if (!qty || qty < 1) qty = 1;

            return qty;
        }

        var isSelflesProductInputSyncing = false;

        function syncProductInput() {
            var input = document.querySelector('.selfles-buy-zone .t-store__prod__quantity-input');

            if (!input || isSelflesProductInputSyncing) return;

            input.setAttribute('value', input.value);

            isSelflesProductInputSyncing = true;

            input.dispatchEvent(new Event('input', {bubbles: true}));
            input.dispatchEvent(new Event('keyup', {bubbles: true}));

            setTimeout(function () {
                isSelflesProductInputSyncing = false;
            }, 0);
        }

        function getCurrentSku() {
            var skuNodes = Array.prototype.slice.call(document.querySelectorAll('.js-product-sku'));
            var productSku = skuNodes.find(function (el) {
                return !el.closest('.t-store__card');
            });

            return productSku ? productSku.textContent.trim() : '';
        }

        function findCartProduct() {
            var sku = getCurrentSku();
            var products = Array.prototype.slice.call(document.querySelectorAll('.t706__product'));

            if (!products.length) return null;

            if (sku) {
                var matched = products.find(function (product) {
                    return product.textContent.indexOf(sku) !== -1;
                });

                if (matched) return matched;
            }

            return products[products.length - 1] || products[0];
        }

        function getCartQty(product) {
            if (!product) return 0;

            var qtyEl = product.querySelector('.t706__product-quantity');

            if (!qtyEl) return 0;

            var qty = parseInt(qtyEl.textContent.trim(), 10);

            return qty || 0;

        function clickEl(el) {
            if (!el) return;

            el.dispatchEvent(new MouseEvent('click', {
                bubbles: true,
                cancelable: true,
                view: window
            }));

        function setCartQty(targetQty, attempt) {
            attempt = attempt || 0;

            if (!targetQty || targetQty < 1 || attempt > 35) return;

            var product = findCartProduct();

            if (!product) {
                setTimeout(function () {
                    setCartQty(targetQty, attempt + 1);
                }, 150);
                return;
            }

            var currentQty = getCartQty(product);

            if (currentQty === targetQty) return;

            if (currentQty < targetQty) {
                clickEl(product.querySelector('.t706__product-plus'));
            } else if (currentQty > targetQty) {
                clickEl(product.querySelector('.t706__product-minus'));
            }

            setTimeout(function () {
                setCartQty(targetQty, attempt + 1);
            }, 120);
        }

        function scheduleCartSync(qty) {
            lastTargetQty = qty;

            [250, 600, 1000, 1600, 2400].forEach(function (delay) {
                setTimeout(function () {
                    setCartQty(lastTargetQty);
                }, delay);
            });

        document.addEventListener('click', function (e) {

            var quantityControl = e.target.closest('.selfles-buy-zone .t-store__prod__quantity');

                '.selfles-buy-zone .js-store-prod-popup-buy-btn, ' +
                '.selfles-buy-zone .t-btn'

            if (!buyBtn) return;

            var targetQty = getSelectedQty();

            syncProductInput();
            scheduleCartSync(targetQty);

        document.addEventListener('change', function (e) {
            if (isSelflesProductInputSyncing) return;

            if (e.target.matches('.selfles-buy-zone .t-store__prod__quantity-input')) {

            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startCartSyncObserver);
        } else {

<script>
    (function () {
        var INIT_ATTR = 'data-selfles-min-card-prices-v3';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        try {
            if (sessionStorage.getItem(BACK_URL_KEY) === '/page136595006.html') {
                sessionStorage.removeItem(BACK_URL_KEY);
            }
        } catch (e) {
        }

        function isCatalogPage() {
            return location.pathname.replace(/\/+$/, '') === '/catalog';
        }

        function isProductPage() {
            return location.pathname.indexOf('/catalog/tproduct/') !== -1 ||
                location.pathname.indexOf('/tproduct/') !== -1 ||
                location.pathname.indexOf('/product/') !== -1;
        }

        if (!isCatalogPage() && !isProductPage()) return;

        var MIN_PRICE_BY_TITLE = {
            'пододеяльник': 9200,
            'простыня на резинке': 8100,
            'простыня без резинки euro': 8900,
            'простыня без резинки king size': 9300,
            'комплект наволочек (2 шт.)': 5200,
            'комплект наволочек 2 шт.': 5200
        };

        var scheduled = false;
        var intervalRuns = 0;

        function all(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function normalizeText(value) {
            return String(value || '')
                .replace(/\u00a0/g, ' ')
                .replace(/ё/g, 'е')
                .replace(/Ё/g, 'Е')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function normalizeKey(value) {
            return normalizeText(value).toLowerCase();
        }

        function formatPrice(price) {
            return String(Math.round(Number(price) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function getCardTitle(card) {
            var titleEl = card.querySelector('.js-product-name, .t-store__card__title');
            return titleEl ? normalizeText(titleEl.textContent) : '';
        }

        function getMinPriceByTitle(title) {
            var key = normalizeKey(title);

            if (MIN_PRICE_BY_TITLE[key]) return MIN_PRICE_BY_TITLE[key];

            if (key.indexOf('комплект наволочек') !== -1) return 5200;
            if (key.indexOf('пододеяльник') !== -1) return 9200;
            if (key.indexOf('простыня на резинке') !== -1) return 8100;

            if (key.indexOf('простыня без резинки') !== -1 && key.indexOf('king') !== -1) {
                return 9300;
            }

            if (
                key.indexOf('простыня без резинки') !== -1 &&
                (key.indexOf('euro') !== -1 || key.indexOf('евро') !== -1)
            ) {
                return 8900;
            }

            return null;
        }

        function getTargetCards() {
            var cards = [];

            if (isCatalogPage()) {
                cards = cards.concat(all('.js-product.t-store__card:not(.js-product-relevant), .t-store__card:not(.js-product-relevant)'));
            }

            if (isProductPage()) {
                cards = cards.concat(all('.js-product-relevant.t-store__card, .t-store__card.js-product-relevant'));
            }

            var seen = [];

            return cards.filter(function (card) {
                if (!card || seen.indexOf(card) !== -1) return false;

                seen.push(card);

                if (card.closest('#rec2310894021, #rec2397921511, #rec1653024161, #rec1556696391')) return false;
                if (card.getAttribute('data-selfles-related-hidden') === '1') return false;

                if (isCatalogPage() && card.closest('.t-store__relevants__container, .js-store-relevants-grid-cont, .t-store__relevants-grid-cont')) {
                    return false;
                }

                if (isProductPage() && !card.classList.contains('js-product-relevant')) {
                    return false;
                }

                return card.querySelector('.js-product-name, .t-store__card__title') &&
                    card.querySelector('.js-product-price, .js-store-prod-price-val, .t-store__card__price-value');
            });
        }

        function getPriceValueEl(card) {
            var values = all('.js-product-price, .js-store-prod-price-val, .t-store__card__price-value', card);

            return values.find(function (el) {
                return !el.closest('.t-store__card__price_old');
            }) || values[0] || null;
        }

        function applyMinCardPrices() {
            getTargetCards().forEach(function (card) {
                var title = getCardTitle(card);
                var minPrice = getMinPriceByTitle(title);

                if (!minPrice) return;

                var priceValueEl = getPriceValueEl(card);

                if (!priceValueEl) return;

                var nextText = formatPrice(minPrice);

                if (normalizeText(priceValueEl.textContent) !== nextText) {
                    priceValueEl.textContent = nextText;
                }

                priceValueEl.setAttribute('data-selfles-min-price', String(minPrice));
                card.setAttribute('data-selfles-min-price-applied', '1');
            });

            if (typeof window.selflesMarkSoldOutCards === 'function') {
                try {
                    window.selflesMarkSoldOutCards();
                } catch (e) {
                }
            }
        }

        function scheduleApplyMinCardPrices() {
            if (scheduled) return;

            scheduled = true;

            requestAnimationFrame(function () {
                scheduled = false;
                applyMinCardPrices();
            });
        }

        function startMinCardPrices() {
            applyMinCardPrices();

            var interval = setInterval(function () {
                intervalRuns++;
                applyMinCardPrices();

                if (intervalRuns >= 80) {
                    clearInterval(interval);
                }
            }, 300);

            [500, 1000, 2000, 4000, 7000, 10000, 15000, 20000].forEach(function (delay) {
                setTimeout(applyMinCardPrices, delay);
            });

            document.addEventListener('click', function () {
                setTimeout(applyMinCardPrices, 150);
                setTimeout(applyMinCardPrices, 500);
                setTimeout(applyMinCardPrices, 1000);
            }, true);

            document.addEventListener('scroll', function () {
                scheduleApplyMinCardPrices();
            }, true);

            if (document.body && 'MutationObserver' in window) {
                var observer = new MutationObserver(scheduleApplyMinCardPrices);

                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });
            }
        }

        window.selflesApplyMinCardPrices = applyMinCardPrices;

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startMinCardPrices);
        } else {
            startMinCardPrices();
        }

        window.addEventListener('load', applyMinCardPrices);
    })();
</script>


<script>
    (function () {
        var INIT_ATTR = 'data-selfles-dynamic-product-close-target';
        var BACK_URL_KEY = 'selflesProductBackUrl';
        var FALLBACK_URL = '/catalog';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        try {
            if (sessionStorage.getItem(BACK_URL_KEY) === '/page136595006.html') {
                sessionStorage.removeItem(BACK_URL_KEY);
            }
        } catch (e) {
        }

        function isProductUrl(value) {
            var url;

            if (!value) return false;

            try {
                url = new URL(value, location.href);
            } catch (e) {
                return false;
            }

            return url.origin === location.origin && (
                url.pathname.indexOf('/catalog/tproduct/') !== -1 ||
                url.pathname.indexOf('/tproduct/') !== -1 ||
                url.pathname.indexOf('/product/') !== -1
            );
        }

        function isProductPage() {
            return isProductUrl(location.href);
        }

        function normalizeBackUrl(value) {
            var url;
            var path;

            if (!value) return '';

            try {
                url = new URL(value, location.href);
            } catch (e) {
                return '';
            }

            if (url.origin !== location.origin) return '';
            if (isProductUrl(url.href)) return '';

            path = url.pathname.replace(/\/+$/, '') || '/';

            if (
                path !== '/' &&
                path !== '/catalog' &&
                path !== '/page94832776.html'
            ) {
                return '';
            }

            return path + url.search + url.hash;
        }

        function rememberBackUrl(value) {
            var backUrl = normalizeBackUrl(value);

            if (!backUrl) return;

            try {
                sessionStorage.setItem(BACK_URL_KEY, backUrl);
            } catch (e) {
            }
        }

        function getStoredBackUrl() {
            try {
                return normalizeBackUrl(sessionStorage.getItem(BACK_URL_KEY));
            } catch (e) {
                return '';
            }
        }

        function getBackUrl() {
            return getStoredBackUrl() || normalizeBackUrl(document.referrer) || FALLBACK_URL;
        }

        function rememberCurrentPageAsBackUrl() {
            if (isProductPage()) return;

            rememberBackUrl(location.href);
        }

        function getCloseSelector() {
            return [
                '.t-store__prod-popup__close-txt-wr',
                '.t-store__prod-popup__close-txt',
                '.js-store-close-text',
                '.t-popup__close',
                '.t-popup__close-wrapper',
                'a[href="/catalog"]',
                'a[href="https://selfles.ru/catalog"]'
            ].join(',');
        }

        function applyDynamicCloseTargets() {
            var backUrl;

            if (!isProductPage()) {
                rememberCurrentPageAsBackUrl();
                return;
            }

            backUrl = getBackUrl();

            Array.prototype.slice.call(document.querySelectorAll(getCloseSelector())).forEach(function (node) {
                var link;

                if (node.tagName === 'A') {
                    node.setAttribute('href', backUrl);
                }

                link = node.closest && node.closest('a');
                if (link) {
                    link.setAttribute('href', backUrl);
                }
            });
        }

        document.addEventListener('click', function (event) {
            var productLink;
            var close;

            productLink = event.target.closest && event.target.closest('a[href]');
            if (productLink && isProductUrl(productLink.getAttribute('href')) && !isProductPage()) {
                rememberBackUrl(location.href);
            }

            if (!isProductPage()) return;

            close = event.target.closest && event.target.closest(getCloseSelector());
            if (!close) return;

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            location.href = getBackUrl();
        }, true);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyDynamicCloseTargets);
        } else {
            applyDynamicCloseTargets();
        }

        window.addEventListener('load', applyDynamicCloseTargets);
        window.addEventListener('popstate', applyDynamicCloseTargets);
        setTimeout(applyDynamicCloseTargets, 500);
        setTimeout(applyDynamicCloseTargets, 1500);

            if (!root) return '';

            if (root.getAttribute) {
                var dataUrl = root.getAttribute('data-product-url');
                if (dataUrl) return dataUrl;
            }

            link = root.querySelector && root.querySelector('a[href]');
            return link ? link.getAttribute('href') : '';
        }

        function ensureTitleCleanerStyle() {
            var style;

            if (document.getElementById(STYLE_ID)) return;

            style = document.createElement('style');
            style.id = STYLE_ID;
            style.textContent =
                '.selfles-title-no-uppercase{' +
                'text-transform:none!important;' +
                'letter-spacing:0!important;' +
                '}';

            (document.head || document.documentElement).appendChild(style);
        }

        function buildProtectedProductTitleFragment(value) {
            var raw = String(value || '');
            var fragment = document.createDocumentFragment();
            var regexp = /`([^`]*)`/g;
            var lastIndex = 0;
            var match;
            var hasProtectedPart = false;

            function appendText(text) {
                if (!text) return;
                fragment.appendChild(document.createTextNode(text));
            }

            function appendProtectedText(text) {
                var span;

                if (!text) return;

                span = document.createElement('span');
                span.className = 'selfles-title-no-uppercase';
                span.textContent = text;
                fragment.appendChild(span);
            }

            while ((match = regexp.exec(raw)) !== null) {
                appendText(raw.slice(lastIndex, match.index));
                appendProtectedText(match[1]);
                lastIndex = regexp.lastIndex;
                hasProtectedPart = true;
            }

            appendText(raw.slice(lastIndex));

            if (!hasProtectedPart) {
                fragment.textContent = stripProductTitleMarkers(raw);
            }

            return fragment;
        }

        function collectRawTitleMaps() {
            all([
                '.js-product.t-store__card',
                '.t-store__card'
            ].join(',')).forEach(function (card) {
                var title = card.querySelector('.js-product-name, .t-store__card__title');
                var raw = title ? (title.getAttribute('data-selfles-title-raw') || title.textContent || '') : '';
                var clean = normalizeTitle(raw);
                var sku = getSkuFromRoot(card);
                var url = getUrlFromRoot(card);
                var lid = card.getAttribute('data-product-lid') || '';

                if (!hasMarkers(raw)) return;

                if (sku) rememberRawTitle('sku:' + sku, raw);
                if (lid) rememberRawTitle('lid:' + lid, raw);
                if (url) rememberRawTitle('url:' + url, raw);
                if (clean) rawTitleByClean[clean] = raw;
            });
        }

        function resolveRawProductTitle(el) {
            var raw = el.getAttribute('data-selfles-title-raw') || el.textContent || '';
            var root;
            var sku;
            var lid;
            var url;
            var clean;

            if (hasMarkers(raw)) return raw;

            root = el.closest(
                '.t-store__prod-popup, ' +
                '.t-store__prod-snippet, ' +
                '.selfles-product-main-layout__info, ' +
                '.t-popup'
            ) || document;

            sku = getSkuFromRoot(root);
            if (sku && rawTitleByKey['sku:' + sku]) return rawTitleByKey['sku:' + sku];

            lid = root.getAttribute && (
                root.getAttribute('data-product-lid') ||
                root.getAttribute('data-product-uid')
            );
            if (lid && rawTitleByKey['lid:' + lid]) return rawTitleByKey['lid:' + lid];

            url = getUrlFromRoot(root);
            if (url && rawTitleByKey['url:' + url]) return rawTitleByKey['url:' + url];

            clean = normalizeTitle(el.textContent);
            if (clean && rawTitleByClean[clean]) return rawTitleByClean[clean];

            return raw;
        }

        function applyProtectedProductTitle(el) {
            var raw;

            if (!el) return;
            if (el.closest('.t-store__card')) return;
            if (el.closest('.selfles-product-details')) return;
            if (el.closest('.selfles-product-options')) return;

            raw = resolveRawProductTitle(el);

            if (!hasMarkers(raw)) return;

            if (
                el.getAttribute('data-selfles-title-raw') === raw &&
                el.querySelector('.selfles-title-no-uppercase') &&
                normalizeTitle(el.textContent) === normalizeTitle(raw)
            ) {
                return;
            }

            el.textContent = '';
            el.appendChild(buildProtectedProductTitleFragment(raw));
            el.setAttribute('data-selfles-title-raw', raw);
        }

        function applyPlainCatalogTitle(el) {
            var raw;
            var clean;

            if (!el) return;
            if (el.closest('.t-store__prod-popup, .t-store__prod-snippet, .selfles-product-main-layout__info, .selfles-product-details, .selfles-product-options')) return;

            raw = el.getAttribute('data-selfles-title-raw') || el.textContent || '';

            if (!hasMarkers(raw)) return;

            clean = stripProductTitleMarkers(raw);
            el.textContent = clean;
            el.setAttribute('data-selfles-title-raw', raw);
        }

        function applySelflesTitleBacktickCleaner() {
            ensureTitleCleanerStyle();
            collectRawTitleMaps();

            all([
                '.selfles-product-main-layout__info .t-store__prod__title',
                '.selfles-product-main-layout__info .t-store__prod-popup__title',
                '.selfles-product-main-layout__info .t-store__prod__name',
                '.selfles-product-main-layout__info .t-store__prod-popup__name',
                '.selfles-product-main-layout__info .js-store-prod-name',
                '.selfles-product-main-layout__info .js-product-name',
                '.selfles-product-main-layout__info .t-title',
                '.t-store__prod-snippet h1',
                '.t-store__prod-popup h1',
                '.t-store__prod-snippet__title',
                '.t-store__prod-popup__title',
                '.t-store__prod-snippet__name',
                '.t-store__prod-popup__name',
                '.t-store__prod-snippet .js-store-prod-name',
                '.t-store__prod-popup .js-store-prod-name',
                '.t-popup .t-store__prod-popup__name',
                '.t-popup .js-store-prod-name'
            ].join(',')).forEach(applyProtectedProductTitle);

            all([
                '.js-product.t-store__card .t-store__card__title',
                '.js-product.t-store__card .js-product-name',
                '.t-store__card .t-store__card__title',
                '.t-store__card .js-product-name',
                '.selfles-related-card__title'
            ].join(',')).forEach(applyPlainCatalogTitle);
        }

        function scheduleSelflesTitleBacktickCleaner() {
            clearTimeout(scheduleSelflesTitleBacktickCleaner.timer);
            scheduleSelflesTitleBacktickCleaner.timer = setTimeout(applySelflesTitleBacktickCleaner, 80);
        }

        function startObserver() {
            if (observerStarted || !document.body || !('MutationObserver' in window)) return;

            observerStarted = true;

            new MutationObserver(scheduleSelflesTitleBacktickCleaner).observe(document.body, {
                childList: true,
                subtree: true,
                characterData: true
            });
        }

        function bootSelflesTitleBacktickCleaner() {
            applySelflesTitleBacktickCleaner();
            startObserver();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootSelflesTitleBacktickCleaner);
        } else {
            bootSelflesTitleBacktickCleaner();
        }

        window.addEventListener('load', function () {
            bootSelflesTitleBacktickCleaner();
            setTimeout(bootSelflesTitleBacktickCleaner, 300);
            setTimeout(bootSelflesTitleBacktickCleaner, 900);
            setTimeout(bootSelflesTitleBacktickCleaner, 1500);
        });

        window.selflesTitleBacktickCleaner = bootSelflesTitleBacktickCleaner;
    })();
</script>
