<script>
  (function () {
    var INIT_ATTR = 'data-selfles-title-backtick-cleaner';

    if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
    document.documentElement.setAttribute(INIT_ATTR, '1');

    function isProductPage() {
      return location.pathname.indexOf('/catalog/tproduct/') !== -1 ||
              location.pathname.indexOf('/tproduct/') !== -1 ||
              location.pathname.indexOf('/product/') !== -1;
    }

    function isCatalogPage() {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var records = document.getElementById('allrecords');
      var alias = records ? String(records.getAttribute('data-tilda-page-alias') || '') : '';

      return path === '/catalog' || alias === 'catalog';
    }

    function all(selector, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(selector));
    }

    function stripProductTitleMarkers(value) {
      return String(value || '').replace(/`/g, '');
    }

    function buildProtectedProductTitleFragment(value) {
      var raw = String(value || '');
      var fragment = document.createDocumentFragment();
      var regexp = /`([^`]*)`/g;
      var lastIndex = 0;
      var match;
      var hasProtectedPart = false;

      function appendText(text) {
        if (!text) return;
        fragment.appendChild(document.createTextNode(text));
      }

      function appendProtectedText(text) {
        var span;

        if (!text) return;

        span = document.createElement('span');
        span.className = 'selfles-title-no-uppercase';
        span.textContent = text;
        fragment.appendChild(span);
      }

      while ((match = regexp.exec(raw)) !== null) {
        appendText(raw.slice(lastIndex, match.index));
        appendProtectedText(match[1]);
        lastIndex = regexp.lastIndex;
        hasProtectedPart = true;
      }

      appendText(raw.slice(lastIndex));

      if (!hasProtectedPart) {
        fragment.textContent = stripProductTitleMarkers(raw);
      }

      return fragment;
    }

    function applyProtectedProductTitle(el) {
      var raw;
      var alreadyRaw;

      if (!el) return;
      if (el.closest('.selfles-product-details')) return;
      if (el.closest('.selfles-product-options')) return;

      alreadyRaw = el.getAttribute('data-selfles-title-raw') || '';

      if (
              alreadyRaw &&
              el.querySelector('.selfles-title-no-uppercase') &&
              el.textContent === stripProductTitleMarkers(alreadyRaw)
      ) {
        return;
      }

      raw = el.textContent || '';

      if (raw.indexOf('`') === -1) return;

      el.textContent = '';
      el.appendChild(buildProtectedProductTitleFragment(raw));
      el.setAttribute('data-selfles-title-raw', raw);
    }

    function applyPlainCatalogTitle(el) {
      var raw;
      var clean;

      if (!el) return;
      if (el.closest('.t-store__prod-popup, .t-store__prod-snippet, .selfles-product-main-layout__info')) return;

      raw = el.textContent || '';

      if (raw.indexOf('`') === -1) return;

      clean = stripProductTitleMarkers(raw);
      el.textContent = clean;
      el.setAttribute('data-selfles-title-raw', raw);
    }

    function applySelflesTitleBacktickCleaner() {
      if (isProductPage()) {
        all([
          '.selfles-product-main-layout__info .t-store__prod__title',
          '.selfles-product-main-layout__info .t-store__prod-popup__title',
          '.selfles-product-main-layout__info .t-store__prod__name',
          '.selfles-product-main-layout__info .t-store__prod-popup__name',
          '.selfles-product-main-layout__info .js-product-name',
          '.selfles-product-main-layout__info .t-title',
          '.t-store__prod-snippet h1',
          '.t-store__prod-popup h1',
          '.t-store__prod-snippet__title',
          '.t-store__prod-popup__title',
          '.t-store__prod-snippet__name',
          '.t-store__prod-popup__name',
          '.t-store__prod-snippet .js-store-prod-name',
          '.t-store__prod-popup .js-store-prod-name'
        ].join(',')).forEach(applyProtectedProductTitle);
      }

      all([
        '.js-product.t-store__card .t-store__card__title',
        '.js-product.t-store__card .js-product-name',
        '.t-store__card .t-store__card__title',
        '.t-store__card .js-product-name',
        '.selfles-related-card__title'
      ].join(',')).forEach(applyPlainCatalogTitle);
    }

    function injectSelflesProductMobileBuyStyle() {
      var style;
      var css;
      var id = 'selfles-product-mobile-static-buy-style';

      if (!isProductPage()) return;
      if (document.getElementById(id)) return;

      css = [
        '@media screen and (max-width: 960px) {',
        '  body.selfles-product-page .selfles-buy-zone .t-store__prod-popup__btn-wrapper,',
        '  body.selfles-product-page .selfles-buy-zone .t-store__prod-popup__btn-wrapper-fixed {',
        '    position: static !important;',
        '    left: auto !important;',
        '    right: auto !important;',
        '    top: auto !important;',
        '    bottom: auto !important;',
        '    z-index: auto !important;',
        '    width: auto !important;',
        '    max-width: none !important;',
        '    height: auto !important;',
        '    min-height: 0 !important;',
        '    padding: 0 !important;',
        '    margin: 12px 0 0 !important;',
        '    transform: none !important;',
        '    background: transparent !important;',
        '    box-shadow: none !important;',
        '  }',
        '  body.selfles-product-page .selfles-buy-zone .t-store__prod-popup__btn,',
        '  body.selfles-product-page .selfles-buy-zone .selfles-product-buy-button-fixed {',
        '    position: relative !important;',
        '    left: auto !important;',
        '    right: auto !important;',
        '    top: auto !important;',
        '    bottom: auto !important;',
        '    width: auto !important;',
        '    min-width: 150px !important;',
        '    transform: none !important;',
        '  }',
        '  body.selfles-product-page .selfles-buy-zone {',
        '    padding-bottom: 0 !important;',
        '  }',
        '}',
        'body.selfles-product-page .selfles-related-fallback .t-store__relevants__title {',
        '  font-family: "Selfles Oswald Medium", "Oswald", Arial, sans-serif !important;',
        '  font-style: normal !important;',
        '}',
        '@media screen and (max-width: 960px) {',
        '  body.selfles-product-page .t-store__prod-snippet__container {',
        '    padding-bottom: 20px !important;',
        '  }',
        '  body.selfles-product-page .t-store__product-snippet {',
        '    padding-bottom: 0 !important;',
        '    margin-bottom: 0 !important;',
        '  }',
        '  body.selfles-product-page .selfles-related-fallback {',
        '    padding-top: 18px !important;',
        '  }',
        '  body.selfles-product-page .selfles-related-fallback .t-store__relevants__title {',
        '    margin-bottom: 18px !important;',
        '  }',
        '}',
        '@media screen and (max-width: 479px) {',
        '  body.selfles-product-page .t-store__prod-snippet__container {',
        '    padding-bottom: 14px !important;',
        '  }',
        '  body.selfles-product-page .selfles-related-fallback {',
        '    padding-top: 14px !important;',
        '  }',
        '  body.selfles-product-page .selfles-related-fallback .t-store__relevants__title {',
        '    margin-bottom: 16px !important;',
        '  }',
        '}'
      ].join('\n');

      style = document.createElement('style');
      style.id = id;
      style.textContent = css;
      document.head.appendChild(style);
    }

    function applySelflesLoadMoreText() {
      if (!isCatalogPage()) return;

      all([
        '.js-store-load-more-btn-text',
        '.t-store__load-more-btn .t-btnflex__text',
        '.t-store__load-more-btn span'
      ].join(',')).forEach(function (el) {
        if (!el) return;
        if ((el.textContent || '').trim() === 'ещё') return;
        el.textContent = 'ещё';
      });
    }

    function applySelflesCatalogUiFixes() {
      injectSelflesProductMobileBuyStyle();
      applySelflesLoadMoreText();
    }

    function applySelflesCatalogEnhancements() {
      applySelflesTitleBacktickCleaner();
      applySelflesCatalogUiFixes();
    }

    function scheduleSelflesTitleBacktickCleaner() {
      clearTimeout(scheduleSelflesTitleBacktickCleaner.timer);
      scheduleSelflesTitleBacktickCleaner.timer = setTimeout(applySelflesCatalogEnhancements, 80);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applySelflesCatalogEnhancements);
    } else {
      applySelflesCatalogEnhancements();
    }

    window.addEventListener('load', function () {
      applySelflesCatalogEnhancements();
      setTimeout(applySelflesCatalogEnhancements, 300);
      setTimeout(applySelflesCatalogEnhancements, 900);
      setTimeout(applySelflesCatalogEnhancements, 1500);
    });

    if ('MutationObserver' in window && document.body) {
      new MutationObserver(scheduleSelflesTitleBacktickCleaner).observe(document.body, {
        childList: true,
        subtree: true
      });
    }
  })();
</script>
