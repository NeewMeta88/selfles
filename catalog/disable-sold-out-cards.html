<style>
  body.selfles-disable-soldout-cards-page .t-store__card.selfles-card-disabled,
  body.selfles-disable-soldout-cards-page .js-product.selfles-card-disabled,
  body.selfles-disable-soldout-cards-page .t-store__card.selfles-card-disabled *,
  body.selfles-disable-soldout-cards-page .js-product.selfles-card-disabled *{pointer-events:none!important;cursor:default!important}
  .selfles-card-click-guard{position:fixed!important;z-index:8!important;display:none;background:transparent!important;pointer-events:auto!important;cursor:default!important;touch-action:pan-y pinch-zoom!important}
</style>
<script>
(function(){
  var INIT='data-selfles-disable-soldout-cards-v2';
  var guardSeq=0;
  if(document.documentElement.getAttribute(INIT)==='1')return;
  document.documentElement.setAttribute(INIT,'1');

  function path(){return location.pathname.replace(/\/+$/,'')||'/';}
  function alias(){var r=document.querySelector('#allrecords');return r?String(r.getAttribute('data-tilda-page-alias')||''):'';}
  function isAllowedPage(){var p=path(),a=alias();return p==='/'||p==='/page94832776.html'||p==='/catalog'||a==='main'||a==='home'||a==='index'||a==='catalog';}
  function all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
  function closest(n,s){return n&&n.closest?n.closest(s):null;}
  function txt(n){return n?String(n.textContent||'').replace(/\s+/g,' ').trim():'';}
  function attr(n,a){for(var i=0,v;i<a.length;i++){v=n&&n.getAttribute?n.getAttribute(a[i]):'';if(v!==null&&v!==undefined&&String(v).trim()!=='')return String(v).trim();}return'';}

  function isZeroInvValue(v){
    var s=String(v===null||v===undefined?'':v).replace(/\s+/g,'').replace(',','.');
    if(s==='')return false;
    if(/^[-+]?\d+(?:\.\d+)?$/.test(s))return Number(s)<=0;
    return /^(0|нет|нетвналичии|soldout|outofstock)$/i.test(s);
  }

  function hasSoldOutBadge(card){
    var nodes=all('.t-store__card__mark,.t-store__card__sold-out-msg,.t-store__card__soldout,.js-store-prod-soldout,.t-store__prod__soldout',card),i,s;
    for(i=0;i<nodes.length;i++){
      s=txt(nodes[i]).toLowerCase();
      if(s.indexOf('нет в наличии')!==-1||s.indexOf('sold out')!==-1||s.indexOf('out of stock')!==-1)return true;
    }
    return false;
  }

  function isSoldOutCard(card){
    var v;
    if(!card)return false;
    if(card.classList.contains('js-product-relevant')||card.classList.contains('selfles-related-card'))return false;
    if(closest(card,'.t-store__prod-popup,.t-store__product-popup,.t-store__product-snippet,.t-store__cart,.t706'))return false;
    if(card.classList.contains('t-store__card_soldout')||card.classList.contains('t-store__card_sold-out')||card.classList.contains('selfles-card-sold-out'))return true;
    v=attr(card,['data-product-inv','data-product-quantity','data-quantity','data-store-count','data-product-count']);
    if(v!=='')return isZeroInvValue(v);
    return hasSoldOutBadge(card);
  }

  function disableLinks(card){
    all('a',card).forEach(function(a){
      var href=a.getAttribute('href');
      if(href&&!a.getAttribute('data-selfles-original-href'))a.setAttribute('data-selfles-original-href',href);
      a.removeAttribute('href');
      a.setAttribute('aria-disabled','true');
      a.setAttribute('tabindex','-1');
    });
    if(card.getAttribute('data-product-url')&&!card.getAttribute('data-selfles-original-product-url')){
      card.setAttribute('data-selfles-original-product-url',card.getAttribute('data-product-url'));
    }
    card.removeAttribute('data-product-url');
  }

  function restoreLinks(card){
    all('a[data-selfles-original-href]',card).forEach(function(a){
      a.setAttribute('href',a.getAttribute('data-selfles-original-href'));
      a.removeAttribute('data-selfles-original-href');
      a.removeAttribute('aria-disabled');
      a.removeAttribute('tabindex');
    });
    if(card.getAttribute('data-selfles-original-product-url')){
      card.setAttribute('data-product-url',card.getAttribute('data-selfles-original-product-url'));
      card.removeAttribute('data-selfles-original-product-url');
    }
  }

  function guardId(card){
    var id=card.getAttribute('data-selfles-click-guard-id');
    if(!id){id='soldout-'+(++guardSeq);card.setAttribute('data-selfles-click-guard-id',id);}
    return id;
  }

  function stopGuardEvent(e){
    if(e.type==='click'||e.type==='auxclick'||e.type==='dblclick'||e.type==='contextmenu'||e.type==='mousedown')e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    return false;
  }

  function createGuard(id){
    var g=document.createElement('div');
    g.className='selfles-card-click-guard';
    g.setAttribute('data-selfles-click-guard',id);
    g.setAttribute('aria-hidden','true');
    ['click','auxclick','dblclick','contextmenu','mousedown'].forEach(function(type){g.addEventListener(type,stopGuardEvent,true);});
    document.body.appendChild(g);
    return g;
  }

  function updateGuardForCard(card,active){
    var id=guardId(card),g=document.querySelector('.selfles-card-click-guard[data-selfles-click-guard="'+id+'"]'),r,visible;
    active[id]=true;
    if(!g)g=createGuard(id);
    r=card.getBoundingClientRect();
    visible=r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<(window.innerHeight||document.documentElement.clientHeight)&&r.left<(window.innerWidth||document.documentElement.clientWidth);
    if(!visible){g.style.display='none';return;}
    g.style.display='block';
    g.style.left=Math.max(0,r.left)+'px';
    g.style.top=Math.max(0,r.top)+'px';
    g.style.width=Math.max(0,Math.min(r.right,window.innerWidth||document.documentElement.clientWidth)-Math.max(0,r.left))+'px';
    g.style.height=Math.max(0,Math.min(r.bottom,window.innerHeight||document.documentElement.clientHeight)-Math.max(0,r.top))+'px';
  }

  function syncGuards(){
    var active={};
    if(!isAllowedPage()){all('.selfles-card-click-guard').forEach(function(g){g.remove();});return;}
    all('.js-product.t-store__card.selfles-card-disabled,.t-store__card.selfles-card-disabled').forEach(function(card){updateGuardForCard(card,active);});
    all('.selfles-card-click-guard').forEach(function(g){if(!active[g.getAttribute('data-selfles-click-guard')])g.remove();});
  }

  function scheduleGuards(){
    if(scheduleGuards.raf)return;
    scheduleGuards.raf=requestAnimationFrame(function(){scheduleGuards.raf=0;syncGuards();});
  }

  function disableSoldOutCards(root){
    all('.js-product.t-store__card,.t-store__card',root||document).forEach(function(card){
      if(isSoldOutCard(card)){
        card.classList.add('selfles-card-disabled','selfles-card-sold-out');
        card.setAttribute('data-selfles-card-disabled','1');
        disableLinks(card);
      }else if(card.getAttribute('data-selfles-card-disabled')==='1'){
        card.classList.remove('selfles-card-disabled','selfles-card-sold-out');
        card.removeAttribute('data-selfles-card-disabled');
        restoreLinks(card);
      }
    });
    scheduleGuards();
  }

  function blockDisabledCardAction(event){
    var card=closest(event.target,'.js-product.t-store__card,.t-store__card');
    if(!card||card.getAttribute('data-selfles-card-disabled')!=='1')return;
    event.preventDefault();
    event.stopPropagation();
    if(event.stopImmediatePropagation)event.stopImmediatePropagation();
    return false;
  }

  function run(){
    if(!isAllowedPage())return;
    document.body.classList.add('selfles-disable-soldout-cards-page');
    disableSoldOutCards();
  }

  function schedule(){clearTimeout(schedule.t);schedule.t=setTimeout(run,120);}

  document.addEventListener('click',blockDisabledCardAction,true);
  document.addEventListener('auxclick',blockDisabledCardAction,true);
  document.addEventListener('mousedown',blockDisabledCardAction,true);
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '||e.key==='Spacebar')blockDisabledCardAction(e);
  },true);

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  window.addEventListener('load',function(){run();setTimeout(run,500);setTimeout(run,1500);setTimeout(run,3000);});
  window.addEventListener('resize',function(){schedule();scheduleGuards();});
  window.addEventListener('scroll',scheduleGuards,true);
  window.addEventListener('selfles:products-manifest-ready',run);
  window.addEventListener('selfles:live-products-ready',run);
  if('MutationObserver'in window&&document.body)new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['data-product-inv','data-product-url','class','style']});
})();
</script>
