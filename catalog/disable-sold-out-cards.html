<style>
  body.selfles-disable-soldout-cards-page .t-store__card.selfles-card-disabled,
  body.selfles-disable-soldout-cards-page .js-product.selfles-card-disabled,
  body.selfles-disable-soldout-cards-page .t-store__card.selfles-card-disabled *,
  body.selfles-disable-soldout-cards-page .js-product.selfles-card-disabled *{pointer-events:none!important;cursor:default!important}
  .selfles-card-click-guard{position:fixed!important;z-index:8!important;display:none;background:transparent!important;pointer-events:auto!important;cursor:default!important;touch-action:pan-y pinch-zoom!important}
</style>
<script>
(function(){
  var INIT='data-selfles-disable-soldout-cards-v2';
  var guardSeq=0;
  var DONORS=['#rec1556696391','#rec2310894021','#rec2417486561'];
  if(document.documentElement.getAttribute(INIT)==='1')return;
  document.documentElement.setAttribute(INIT,'1');

  function path(){return location.pathname.replace(/\/+$/,'')||'/';}
  function alias(){var r=document.querySelector('#allrecords');return r?String(r.getAttribute('data-tilda-page-alias')||''):'';}
  function isAllowedPage(){var p=path(),a=alias();return p==='/'||p==='/page94832776.html'||p==='/catalog'||a==='main'||a==='home'||a==='index'||a==='catalog';}
  function all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
  function closest(n,s){return n&&n.closest?n.closest(s):null;}
  function txt(n){return n?String(n.textContent||'').replace(/\s+/g,' ').trim():'';}
  function attr(n,a){for(var i=0,v;i<a.length;i++){v=n&&n.getAttribute?n.getAttribute(a[i]):'';if(v!==null&&v!==undefined&&String(v).trim()!=='')return String(v).trim();}return'';}
  function cleanSku(v){var s=String(v||'').replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i,'').trim().toUpperCase(),al=window.SELFLES_SKU_ALIASES||{};return String(al[s]||al[s.replace(/\s+/g,'')]||s).trim().toUpperCase();}
  function parseSku(v){var ext=window.SELFLES_PRODUCT_DATA&&window.SELFLES_PRODUCT_DATA.parseSku,s=cleanSku(v),m,code={P:'pink',G:'green',C:'coffee',B:'blue',S:'cream',W:'white'};if(typeof ext==='function'){try{m=ext(s);if(m&&m.type&&m.color)return m;}catch(e){}}
    m=s.match(/^N([PGCBSW])-?/);if(m)return{sku:s,type:'pillowcase',size:null,color:code[m[1]]||''};
    m=s.match(/^PP(150|180|220)([PGCBSW])-?/);if(m)return{sku:s,type:'duvet',size:m[1],color:code[m[2]]||''};
    m=s.match(/^PP([PGCBSW])-?/);if(m)return{sku:s,type:'duvet',size:'200',color:code[m[1]]||''};
    m=s.match(/^P(160|180|KS|EUR)([PGCBSW])-?/);if(m)return{sku:s,type:'sheet',size:m[1],color:code[m[2]]||''};
    return null;
  }
  function productUrl(p){var u;if(!p)return'';try{u=new URL(String(p.url||p.productUrl||p.href||p.link||''),location.href);}catch(e){return'';}if(u.pathname.indexOf('/tproduct/')===-1&&u.pathname.indexOf('/product/')===-1)return'';return u.pathname.replace('/tproduct/','/catalog/tproduct/')+u.search+u.hash;}
  function productQty(p){return p&&(p.quantity!==undefined?p.quantity:p.inv);}
  function productAvailable(p){var q=productQty(p);if(q===undefined||q===null||q==='')return true;if(/^(notlimited|unlimited)$/i.test(String(q)))return true;return Number(String(q).replace(',','.'))>0;}
  function money(v){var n=Number(String(v||'').replace(/\s+/g,'').replace(/[^\d.,-]/g,'').replace(',','.'));return isFinite(n)?n:NaN;}
  function moneyText(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  function normalizeProductUrl(v){var u;if(!v)return'';try{u=new URL(String(v),location.href);}catch(e){return'';}if(u.pathname.indexOf('/tproduct/')===-1&&u.pathname.indexOf('/product/')===-1)return'';return u.pathname.replace('/tproduct/','/catalog/tproduct/')+u.search+u.hash;}
  function imageFromCard(c){var img=c&&c.querySelector&&c.querySelector('img[src],img[data-original],.t-store__card__img[data-original],[data-original],[style*="background-image"]'),bg;if(!img)return'';bg=img.style&&img.style.backgroundImage?img.style.backgroundImage.match(/url\(["']?([^"')]+)["']?\)/):null;return attr(img,['data-original','data-img-zoom-url','src','content'])||(bg&&bg[1])||'';}
  function priceFromCard(c){var n=c&&c.querySelector&&c.querySelector('.js-product-price,.js-store-prod-price-val,.t-store__card__price-value,.t-store__card__price,.t-store__prod-popup__price-value,.t-store__prod__price-value');return txt(n);}
  function qtyFromCard(c){var has=c&&(c.hasAttribute('data-product-inv')||c.hasAttribute('data-store-prod-inv')||c.hasAttribute('data-inv')),raw=attr(c,['data-product-inv','data-store-prod-inv','data-inv']),n;if(has&&raw==='')return 99999;if(raw){if(/^(notlimited|unlimited)$/i.test(raw))return 99999;n=Number(String(raw).replace(',','.'));return isFinite(n)?n:0;}return c&&hasSoldOutBadge(c)?0:1;}
  function skuFromCard(c){var n,v,m;if(!c)return'';n=c.querySelector&&c.querySelector('.js-product-sku,.js-store-prod-sku,.t-store__card__sku,.t-store__prod-popup__sku,.t-store__prod__sku,[data-product-sku],[data-sku]');v=cleanSku(attr(c,['data-selfles-sku','data-product-sku','data-sku','data-product-lid']));if(v&&!/^\d+$/.test(v)&&parseSku(v))return v;if(n){v=cleanSku(attr(n,['data-product-sku','data-sku','data-selfles-sku'])||txt(n));if(v&&parseSku(v))return v;}m=String(c.textContent||'').toUpperCase().match(/\b(?:N[PGCBSW]-?BAM\d+|P(?:160|180|KS|EUR)[PGCBSW]-?BAM\d+|PP(?:150|180|220)?[PGCBSW]-?BAM\d+)\b/);return m?cleanSku(m[0]):'';}
  function donorRoots(){return DONORS.map(function(s){return document.querySelector(s);}).filter(Boolean);}
  function manifest(){var out={};Object.assign(out,window.SELFLES_ALL_PRODUCTS_BY_SKU||{},window.SELFLES_PRODUCTS_BY_SKU||{});donorRoots().forEach(function(root){all('.js-product,.t-store__card,[data-product-lid],[data-product-url]',root).forEach(function(c){var sku=skuFromCard(c),p=parseSku(sku),url=normalizeProductUrl(attr(c,['data-product-url'])||((c.querySelector('a[href*="/tproduct/"],a[href*="/catalog/tproduct/"]')||{}).href||''));if(!p)return;out[p.sku]=Object.assign({},out[p.sku]||{},p,{sku:p.sku,url:url||((out[p.sku]||{}).url||''),price:priceFromCard(c)||((out[p.sku]||{}).price||''),quantity:qtyFromCard(c),image:imageFromCard(c)||((out[p.sku]||{}).image||'')});});});return out;}
  function products(){var man=manifest();return Object.keys(man).map(function(k){var it=man[k]||{},sku=cleanSku(it.sku||k),p=parseSku(sku);if(!p)return null;return Object.assign({},it,p,{sku:sku});}).filter(Boolean);}
  function groupForCard(c){var list=products(),sku=skuFromCard(c),cur=list.find(function(p){return p.sku===sku;})||parseSku(sku),group,available,min=Infinity,rank={pillowcase:0,'150':1,'160':1,'180':2,'200':3,'220':4,EUR:5,KS:6};if(!cur||!cur.type||!cur.color)return null;group=list.filter(function(p){return p.type===cur.type&&p.color===cur.color;});group.forEach(function(p){var n=money(p.price);if(isFinite(n)&&n>0&&n<min)min=n;});available=group.filter(function(p){return productAvailable(p)&&productUrl(p);}).sort(function(a,b){return(rank[a.size||a.type]||99)-(rank[b.size||b.type]||99);});if(!available.length)return null;return{target:available[0],minPrice:isFinite(min)?min:money(available[0].price)};}
  function setCardPrice(c,n){if(!isFinite(n)||n<=0)return;all('.js-product-price,.js-store-prod-price-val,.t-store__card__price-value',c).forEach(function(el){el.textContent=moneyText(n);el.setAttribute('data-product-price-def-str',String(Math.round(n)));});}
  function removeGuard(c){var id=c&&c.getAttribute('data-selfles-click-guard-id');if(!id)return;all('.selfles-card-click-guard').forEach(function(g){if(g.getAttribute('data-selfles-click-guard')===id)g.remove();});c.removeAttribute('data-selfles-click-guard-id');}
  function makeCardAvailable(c,g){var p=g&&g.target,url=productUrl(p);if(!p||!url)return false;c.setAttribute('data-selfles-group-available','1');c.classList.remove('selfles-card-disabled','selfles-card-sold-out','t-store__card_soldout','t-store__card_sold-out');c.removeAttribute('data-selfles-card-disabled');c.removeAttribute('data-selfles-original-product-url');c.setAttribute('data-product-url',url);c.setAttribute('data-product-inv',String(productQty(p)||1));all('a',c).forEach(function(a){a.setAttribute('href',url);a.removeAttribute('data-selfles-original-href');a.removeAttribute('aria-disabled');a.removeAttribute('tabindex');});all('.selfles-sold-out-badge,.js-store-prod-sold-out,.t-store__card__sold-out-msg,.t-store__card__soldout',c).forEach(function(el){el.style.setProperty('display','none','important');});setCardPrice(c,g.minPrice);removeGuard(c);return true;}

  function isZeroInvValue(v){
    var s=String(v===null||v===undefined?'':v).replace(/\s+/g,'').replace(',','.');
    if(s==='')return false;
    if(/^[-+]?\d+(?:\.\d+)?$/.test(s))return Number(s)<=0;
    return /^(0|нет|нетвналичии|soldout|outofstock)$/i.test(s);
  }

  function hasSoldOutBadge(card){
    var nodes=all('.t-store__card__mark,.t-store__card__sold-out-msg,.t-store__card__soldout,.js-store-prod-soldout,.t-store__prod__soldout',card),i,s;
    for(i=0;i<nodes.length;i++){
      s=txt(nodes[i]).toLowerCase();
      if(s.indexOf('нет в наличии')!==-1||s.indexOf('sold out')!==-1||s.indexOf('out of stock')!==-1)return true;
    }
    return false;
  }

  function isSoldOutCard(card){
    var v;
    if(!card)return false;
    if(card.classList.contains('js-product-relevant')||card.classList.contains('selfles-related-card'))return false;
    if(closest(card,'.t-store__prod-popup,.t-store__product-popup,.t-store__product-snippet,.t-store__cart,.t706'))return false;
    if(card.classList.contains('t-store__card_soldout')||card.classList.contains('t-store__card_sold-out')||card.classList.contains('selfles-card-sold-out'))return true;
    v=attr(card,['data-product-inv','data-product-quantity','data-quantity','data-store-count','data-product-count']);
    if(v!=='')return isZeroInvValue(v);
    return hasSoldOutBadge(card);
  }

  function disableLinks(card){
    all('a',card).forEach(function(a){
      var href=a.getAttribute('href');
      if(href&&!a.getAttribute('data-selfles-original-href'))a.setAttribute('data-selfles-original-href',href);
      a.removeAttribute('href');
      a.setAttribute('aria-disabled','true');
      a.setAttribute('tabindex','-1');
    });
    if(card.getAttribute('data-product-url')&&!card.getAttribute('data-selfles-original-product-url')){
      card.setAttribute('data-selfles-original-product-url',card.getAttribute('data-product-url'));
    }
    card.removeAttribute('data-product-url');
  }

  function restoreLinks(card){
    all('a[data-selfles-original-href]',card).forEach(function(a){
      a.setAttribute('href',a.getAttribute('data-selfles-original-href'));
      a.removeAttribute('data-selfles-original-href');
      a.removeAttribute('aria-disabled');
      a.removeAttribute('tabindex');
    });
    if(card.getAttribute('data-selfles-original-product-url')){
      card.setAttribute('data-product-url',card.getAttribute('data-selfles-original-product-url'));
      card.removeAttribute('data-selfles-original-product-url');
    }
  }

  function guardId(card){
    var id=card.getAttribute('data-selfles-click-guard-id');
    if(!id){id='soldout-'+(++guardSeq);card.setAttribute('data-selfles-click-guard-id',id);}
    return id;
  }

  function stopGuardEvent(e){
    if(e.type==='click'||e.type==='auxclick'||e.type==='dblclick'||e.type==='contextmenu'||e.type==='mousedown')e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    return false;
  }

  function createGuard(id){
    var g=document.createElement('div');
    g.className='selfles-card-click-guard';
    g.setAttribute('data-selfles-click-guard',id);
    g.setAttribute('aria-hidden','true');
    ['click','auxclick','dblclick','contextmenu','mousedown'].forEach(function(type){g.addEventListener(type,stopGuardEvent,true);});
    document.body.appendChild(g);
    return g;
  }

  function updateGuardForCard(card,active){
    var id=guardId(card),g=document.querySelector('.selfles-card-click-guard[data-selfles-click-guard="'+id+'"]'),r,visible;
    active[id]=true;
    if(!g)g=createGuard(id);
    r=card.getBoundingClientRect();
    visible=r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<(window.innerHeight||document.documentElement.clientHeight)&&r.left<(window.innerWidth||document.documentElement.clientWidth);
    if(!visible){g.style.display='none';return;}
    g.style.display='block';
    g.style.left=Math.max(0,r.left)+'px';
    g.style.top=Math.max(0,r.top)+'px';
    g.style.width=Math.max(0,Math.min(r.right,window.innerWidth||document.documentElement.clientWidth)-Math.max(0,r.left))+'px';
    g.style.height=Math.max(0,Math.min(r.bottom,window.innerHeight||document.documentElement.clientHeight)-Math.max(0,r.top))+'px';
  }

  function syncGuards(){
    var active={};
    if(!isAllowedPage()){all('.selfles-card-click-guard').forEach(function(g){g.remove();});return;}
    all('.js-product.t-store__card.selfles-card-disabled,.t-store__card.selfles-card-disabled').forEach(function(card){updateGuardForCard(card,active);});
    all('.selfles-card-click-guard').forEach(function(g){if(!active[g.getAttribute('data-selfles-click-guard')])g.remove();});
  }

  function scheduleGuards(){
    if(scheduleGuards.raf)return;
    scheduleGuards.raf=requestAnimationFrame(function(){scheduleGuards.raf=0;syncGuards();});
  }

  function disableSoldOutCards(root){
    all('.js-product.t-store__card,.t-store__card',root||document).forEach(function(card){
      var group=groupForCard(card);
      if(group&&makeCardAvailable(card,group))return;
      if(isSoldOutCard(card)){
        card.classList.add('selfles-card-disabled','selfles-card-sold-out');
        card.setAttribute('data-selfles-card-disabled','1');
        disableLinks(card);
      }else if(card.getAttribute('data-selfles-card-disabled')==='1'){
        card.classList.remove('selfles-card-disabled','selfles-card-sold-out');
        card.removeAttribute('data-selfles-card-disabled');
        restoreLinks(card);
      }
    });
    scheduleGuards();
  }

  function blockDisabledCardAction(event){
    var card=closest(event.target,'.js-product.t-store__card,.t-store__card');
    if(!card||card.getAttribute('data-selfles-card-disabled')!=='1')return;
    event.preventDefault();
    event.stopPropagation();
    if(event.stopImmediatePropagation)event.stopImmediatePropagation();
    return false;
  }

  window.selflesGroupAvailabilityDebug=function(){var man=manifest();return{donor:donorRoots().map(function(d){return'#'+d.id;}),allProducts:Object.keys(man).length,hasPPC:!!man['PPC-BAM1025'],cards:all('.js-product.t-store__card:not(.js-product-relevant),.t-store__card:not(.js-product-relevant)').map(function(card){var sku=skuFromCard(card),group=groupForCard(card);return{sku:sku,disabled:card.getAttribute('data-selfles-card-disabled')==='1',target:group&&group.target&&group.target.sku,minPrice:group&&group.minPrice,available:!!group};}).filter(function(item){return item.sku||item.available;})};};

  function run(){
    if(!isAllowedPage())return;
    document.body.classList.add('selfles-disable-soldout-cards-page');
    disableSoldOutCards();
  }

  function schedule(){clearTimeout(schedule.t);schedule.t=setTimeout(run,120);}

  document.addEventListener('click',blockDisabledCardAction,true);
  document.addEventListener('auxclick',blockDisabledCardAction,true);
  document.addEventListener('mousedown',blockDisabledCardAction,true);
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '||e.key==='Spacebar')blockDisabledCardAction(e);
  },true);

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  window.addEventListener('load',function(){run();setTimeout(run,500);setTimeout(run,1500);setTimeout(run,3000);});
  window.addEventListener('resize',function(){schedule();scheduleGuards();});
  window.addEventListener('scroll',scheduleGuards,true);
  window.addEventListener('selfles:products-manifest-ready',run);
  window.addEventListener('selfles:live-products-ready',run);
  if('MutationObserver'in window&&document.body)new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['data-product-inv','data-product-url','class','style']});
})();
</script>
