<script>
    (function () {
        var INIT_ATTR = 'data-selfles-related-filter';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        function isProductPage() {
            return location.pathname.indexOf('/catalog/tproduct/') !== -1 ||
                location.pathname.indexOf('/tproduct/') !== -1 ||
                location.pathname.indexOf('/product/') !== -1;
        }

        function isCatalogPage() {
            return location.pathname.replace(/\/+$/, '') === '/catalog';
        }

        if (!isProductPage() && !isCatalogPage()) return;

        var COLOR_ORDER = ['pink', 'green', 'coffee', 'blue', 'cream', 'white'];

        var COLORS = {
            pink: {code: 'P', label: 'розовый', hex: '#F6C1CD'},
            green: {code: 'G', label: 'зелёный', hex: '#AFD9C4'},
            coffee: {code: 'C', label: 'кофейный', hex: '#C6B4AB'},
            blue: {code: 'B', label: 'голубой', hex: '#A9D6EF'},
            cream: {code: 'S', label: 'сливочный', hex: '#FBF8EC'},
            white: {code: 'W', label: 'белый', hex: '#F4F4F4'}
        };

        var COLOR_BY_CODE = {
            P: 'pink',
            G: 'green',
            C: 'coffee',
            B: 'blue',
            S: 'cream',
            W: 'white'
        };

        var TYPE_LABELS = {
            sheet: 'Простыня на резинке',
            duvet: 'Пододеяльник',
            pillowcase: 'Комплект наволочек (2 шт.)'
        };

        var SHEET_SIZE_LABELS = {
            '160': '160 х 200 х 30',
            '180': '180 х 200 х 30',
            'EUR': '220 х 240 (без резинки)',
            'KS': '240 х 260 (без резинки)'
        };

        var DUVET_SIZE_LABELS = {
            '150': '150 х 200',
            '180': '180 х 210',
            '200': '200 х 220',
            '220': '220 х 240'
        };

        function cleanSku(value) {
            return String(value || '')
                .replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i, '')
                .trim()
                .toUpperCase();
        }

        function canonicalSku(value) {
            var clean = cleanSku(value);
            var aliases = window.SELFLES_SKU_ALIASES || {};
            var alias = aliases[clean] || aliases[cleanSku(clean)];

            return alias ? cleanSku(alias) : clean;
        }

        function all(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function isVisible(el) {
            if (!el) return false;
            var rect = el.getBoundingClientRect();
            return rect.width > 0 && rect.height > 0;
        }

        function parseSku(skuValue) {
            var sku = canonicalSku(skuValue);
            var color = '(P|G|C|B|S|W)';
            var match;

            match = sku.match(new RegExp('^N' + color + '-?'));
            if (match) return {sku: sku, type: 'pillowcase', size: null, color: COLOR_BY_CODE[match[1]]};

            match = sku.match(new RegExp('^PP(150|180|220)' + color + '-?'));
            if (match) return {sku: sku, type: 'duvet', size: match[1], color: COLOR_BY_CODE[match[2]]};

            match = sku.match(new RegExp('^PP' + color + '-?'));
            if (match) return {sku: sku, type: 'duvet', size: '200', color: COLOR_BY_CODE[match[1]]};

            match = sku.match(new RegExp('^P(160|180)' + color + '-?'));
            if (match) return {sku: sku, type: 'sheet', size: match[1], color: COLOR_BY_CODE[match[2]]};

            match = sku.match(new RegExp('^P(KS|EUR)' + color + '-?'));
            if (match) return {sku: sku, type: 'sheet', size: match[1], color: COLOR_BY_CODE[match[2]]};

            return null;
        }

        function getSizeLabels(type) {
            if (type === 'sheet') return SHEET_SIZE_LABELS;
            if (type === 'duvet') return DUVET_SIZE_LABELS;
            return {};
        }

        function getSizeLabel(type, size) {
            var labels = getSizeLabels(type);
            return labels[size] || size || '';
        }

        function buildTitle(parsed) {
            if (!parsed) return '';

            var title = TYPE_LABELS[parsed.type] || 'Товар';
            var size = getSizeLabel(parsed.type, parsed.size);
            var color = COLORS[parsed.color] ? COLORS[parsed.color].label : '';

            return [title, size, color].filter(Boolean).join(', ');
        }

        function createProductRecord(sku) {
            var parsed = parseSku(sku);

            if (!parsed) return null;

            return {
                sku: parsed.sku,
                type: parsed.type,
                size: parsed.size,
                color: parsed.color,
                title: buildTitle(parsed),
                price: '',
                url: '',
                image: '',
                quantity: 0
            };
        }

        var RELATED_BY_SKU = {
            "BL-COTO426": ["PP180P-BAM1025", "NP-BAM1025", "NW-BAM1025"],

            "P160W-BAM1025": ["PP180W-BAM1025", "NW-BAM1025", "NP-BAM1025"],
            "P180W-BAM1025": ["PP180W-BAM1025", "NW-BAM1025", "NG-BAM1025"],
            "PEURW-BAM1025": ["PPW-BAM1025", "NW-BAM1025", "NB-BAM1025"],
            "PKSW-BAM1025": ["PP220W-BAM1025", "NW-BAM1025", "NP-BAM1025"],
            "PP150W-BAM1025": ["P160W-BAM1025", "NW-BAM1025", "NG-BAM1025"],
            "PP180W-BAM1025": ["P180W-BAM1025", "NW-BAM1025", "NP-BAM1025"],
            "PPW-BAM1025": ["PEURW-BAM1025", "NW-BAM1025", "NG-BAM1025"],
            "PP220W-BAM1025": ["PKSW-BAM1025", "NW-BAM1025", "NB-BAM1025"],
            "NW-BAM1025": ["P180W-BAM1025", "P180G-BAM1025", "PPC-BAM1025"],

            "P160S-BAM1025": ["PP180S-BAM1025", "NS-BAM1025", "NP-BAM1025"],
            "P180S-BAM1025": ["PP180S-BAM1025", "NS-BAM1025", "NC-BAM1025"],
            "PKSS-BAM1025": ["PP180S-BAM1025", "NS-BAM1025", "NG-BAM1025"],
            "PP150S-BAM1025": ["P160S-BAM1025", "NS-BAM1025", "NB-BAM1025"],
            "PP180S-BAM1025": ["P180S-BAM1025", "NS-BAM1025", "NP-BAM1025"],
            "PPS-BAM1025": ["PKSS-BAM1025", "NS-BAM1025", "NG-BAM1025"],
            "PP220S-BAM1025": ["PKSS-BAM1025", "NS-BAM1025", "NC-BAM1025"],
            "NS-BAM1025": ["P180G-BAM1025", "P180S-BAM1025", "PPS-BAM1025"],

            "P160P-BAM1025": ["PP180P-BAM1025", "NP-BAM1025", "NW-BAM1025"],
            "P180P-BAM1025": ["PP180P-BAM1025", "NP-BAM1025", "NB-BAM1025"],
            "PKSP-BAM1025": ["PP220P-BAM1025", "NP-BAM1025", "NG-BAM1025"],
            "PP150P-BAM1025": ["P160P-BAM1025", "NP-BAM1025", "NC-BAM1025"],
            "PP180P-BAM1025": ["P180P-BAM1025", "NP-BAM1025", "NS-BAM1025"],
            "PPP-BAM1025": ["PKSP-BAM1025", "NP-BAM1025", "NG-BAM1025"],
            "PP220P-BAM1025": ["PKSP-BAM1025", "NP-BAM1025", "NS-BAM1025"],
            "NP-BAM1025": ["P180S-BAM1025", "P180P-BAM1025", "PPP-BAM1025"],

            "P160G-BAM1025": ["PP180G-BAM1025", "NG-BAM1025", "NP-BAM1025"],
            "P180G-BAM1025": ["PP180G-BAM1025", "NG-BAM1025", "NP-BAM1025"],
            "PKSG-BAM1025": ["PP220G-BAM1025", "NG-BAM1025", "NS-BAM1025"],
            "PP150G-BAM1025": ["P160G-BAM1025", "NG-BAM1025", "NB-BAM1025"],
            "PP180G-BAM1025": ["P180G-BAM1025", "NG-BAM1025", "NS-BAM1025"],
            "PPG-BAM1025": ["PKSG-BAM1025", "NG-BAM1025", "NP-BAM1025"],
            "PP220G-BAM1025": ["PKSG-BAM1025", "NG-BAM1025", "NC-BAM1025"],
            "NG-BAM1025": ["P180C-BAM1025", "P180G-BAM1025", "PPG-BAM1025"],

            "P160C-BAM1025": ["PP180C-BAM1025", "NC-BAM1025", "NP-BAM1025"],
            "P180C-BAM1025": ["PP180C-BAM1025", "NC-BAM1025", "NG-BAM1025"],
            "PKSC-BAM1025": ["PP220C-BAM1025", "NC-BAM1025", "NB-BAM1025"],
            "PP150C-BAM1025": ["P160C-BAM1025", "NC-BAM1025", "NS-BAM1025"],
            "PP180C-BAM1025": ["P180C-BAM1025", "NC-BAM1025", "NP-BAM1025"],
            "PPC-BAM1025": ["PKSC-BAM1025", "NC-BAM1025", "NG-BAM1025"],
            "PP220C-BAM1025": ["PKSC-BAM1025", "NC-BAM1025", "NW-BAM1025"],
            "NC-BAM1025": ["P180G-BAM1025", "P180C-BAM1025", "PPC-BAM1025"],

            "P160B-BAM1025": ["PP180B-BAM1025", "NB-BAM1025", "NP-BAM1025"],
            "P180B-BAM1025": ["PP180B-BAM1025", "NB-BAM1025", "NS-BAM1025"],
            "PKSB-BAM1025": ["PP220B-BAM1025", "NB-BAM1025", "NC-BAM1025"],
            "PP150B-BAM1025": ["P160B-BAM1025", "NB-BAM1025", "NG-BAM1025"],
            "PP180B-BAM1025": ["P180B-BAM1025", "NB-BAM1025", "NS-BAM1025"],
            "PPB-BAM1025": ["PKSB-BAM1025", "NB-BAM1025", "NP-BAM1025"],
            "PP220B-BAM1025": ["PKSB-BAM1025", "NB-BAM1025", "NC-BAM1025"],
            "NB-BAM1025": ["P180C-BAM1025", "P180B-BAM1025", "PPB-BAM1025"],

        };

        function ensureManifest() {
            var manifest = window.SELFLES_PRODUCTS_BY_SKU || {};
            var normalized = {};

            function mergeProduct(target, source, sku) {
                target = target || {};
                source = source || {};

                return {
                    sku: sku,
                    type: source.type || target.type || '',
                    size: source.size || target.size || null,
                    color: source.color || target.color || '',
                    title: source.title || target.title || '',
                    price: source.price || target.price || '',
                    url: source.url || target.url || '',
                    image: source.image || target.image || '',
                    quantity: source.quantity != null ? source.quantity : (target.quantity != null ? target.quantity : 1)
                };
            }

            Object.keys(manifest).forEach(function (sku) {
                var clean = canonicalSku(sku);
                var product = manifest[sku];
                var parsed;

                if (!clean || !product) return;

                product.sku = canonicalSku(product.sku || clean);
                parsed = parseSku(product.sku);

                if (parsed) {
                    product.type = product.type || parsed.type;
                    product.size = product.size || parsed.size;
                    product.color = product.color || parsed.color;
                }

                normalized[clean] = mergeProduct(normalized[clean], product, clean);
            });

            manifest = normalized;

            Object.keys(RELATED_BY_SKU).forEach(function (sku) {
                var clean = canonicalSku(sku);
                if (!manifest[clean]) manifest[clean] = createProductRecord(clean);

                RELATED_BY_SKU[sku].forEach(function (relatedSku) {
                    var relatedClean = canonicalSku(relatedSku);
                    if (!manifest[relatedClean]) manifest[relatedClean] = createProductRecord(relatedClean);
                });
            });

            Object.keys(manifest).forEach(function (sku) {
                var item = manifest[sku];

                if (sku === 'BL-COTO426') return;

                if (!item || !item.color || !COLORS[item.color]) {
                    delete manifest[sku];
                    return;
                }
            });

            window.SELFLES_PRODUCTS_BY_SKU = manifest;
            return manifest;
        }

        var PRODUCTS_BY_SKU = ensureManifest();
        window.SELFLES_RELATED_PRODUCTS_BY_SKU = RELATED_BY_SKU;

        window.SELFLES_PRODUCT_DATA = {
            colors: COLORS,
            colorOrder: COLOR_ORDER,
            sheetSizeLabels: SHEET_SIZE_LABELS,
            duvetSizeLabels: DUVET_SIZE_LABELS,
            cleanSku: cleanSku,
            canonicalSku: canonicalSku,
            parseSku: parseSku,
            createProductRecord: createProductRecord,
            getSizeLabels: getSizeLabels
        };

        function getCardSku(card) {
            var skuEl = card.querySelector('.js-product-sku, .t-store__card__sku');
            return skuEl ? canonicalSku(skuEl.textContent) : '';
        }

        function extractImage(card) {
            var img = card.querySelector('img[src], img[data-original], .t-store__card__img[data-original], [data-original]');
            var bgNode = card.querySelector('[style*=\"background-image\"]');
            var bg = bgNode ? bgNode.style.backgroundImage.match(/url\(["']?([^"')]+)["']?\)/) : null;

            return (img && (img.getAttribute('data-original') || img.getAttribute('src'))) || (bg && bg[1]) || '';
        }

        function getCardUrl(card) {
            var link = card.querySelector('a[href]');
            return card.getAttribute('data-product-url') || (link ? link.getAttribute('href') : '') || '';
        }

        function isExplicitlySoldOut(card) {
            var text = String(card.textContent || '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();

            return card.classList.contains('selfles-card-sold-out') ||
                card.classList.contains('t-store__card_sold-out') ||
                !!card.querySelector(
                    '.js-store-prod-sold-out, ' +
                    '.t-store__card__sold-out-msg, ' +
                    '.t-store__prod-popup__sold-out, ' +
                    '.t-store__prod__sold-out'
                ) ||
                text === 'нет в наличии';
        }

        function getCardQuantity(card, fallbackQuantity) {
            var hasInv = card.hasAttribute('data-product-inv');
            var rawInv = hasInv ? String(card.getAttribute('data-product-inv') || '').trim() : '';
            var qty;
            var availability = card.querySelector('[itemprop="availability"]');
            var availabilityHref = availability ? String(availability.getAttribute('href') || '').toLowerCase() : '';

            if (hasInv && rawInv !== '') {
                qty = Number(rawInv.replace(',', '.'));
                return isFinite(qty) ? qty : 0;
            }

            if (isExplicitlySoldOut(card) || availabilityHref.indexOf('outofstock') !== -1) {
                return 0;
            }

            /*
              В Тильде пустой data-product-inv="" часто означает,
              что остатки не ограничены / не ведутся, но товар доступен.
            */
            if (hasInv && rawInv === '') {
                return 99999;
            }

            if (availabilityHref.indexOf('instock') !== -1) {
                return 99999;
            }

            qty = Number(fallbackQuantity || 0);
            return isFinite(qty) ? qty : 0;
        }

        function enrichProductFromCard(card) {
            var sku = getCardSku(card);
            var product;
            var titleEl;
            var priceEl;

            if (!sku) return;

            product = PRODUCTS_BY_SKU[sku] || createProductRecord(sku);
            if (!product) return;

            titleEl = card.querySelector('.js-product-name, .t-store__card__title');
            priceEl = card.querySelector('.js-product-price, .t-store__card__price-value, .t-store__card__price');

            product.title = titleEl && titleEl.textContent.trim() ? titleEl.textContent.trim() : product.title;
            product.price = priceEl && priceEl.textContent.trim() ? priceEl.textContent.trim() : product.price;
            product.url = getCardUrl(card) || product.url;
            product.image = extractImage(card) || product.image;
            product.quantity = getCardQuantity(card, product.quantity);

            PRODUCTS_BY_SKU[sku] = product;
        }

        function enrichManifestFromDom() {
            all([
                '.js-store-product.js-product[data-product-inv]',
                '.t-store__product-snippet[data-product-inv]',
                '.t-store__prod-popup[data-product-inv]',

                '#rec2310894021 .js-product.t-store__card',
                '#rec2310894021 .t-store__card',

                '#rec2397921511 .js-product.t-store__card',
                '#rec2397921511 .t-store__card',

                '.js-product.t-store__card:not(.js-product-relevant)',
                '.t-store__card:not(.js-product-relevant)'
            ].join(',')).forEach(enrichProductFromCard);

            return PRODUCTS_BY_SKU;
        }

        window.selflesRefreshProductsFromTildaDom = enrichManifestFromDom;

        function getActivePopup() {
            return all('.t-popup, .t-store__prod-popup, .t-store__prod-popup__container').find(function (popup) {
                return isVisible(popup) && !!popup.querySelector('.js-product-sku, .t-store__prod-popup__sku, .t-store__prod__sku');
            }) || null;
        }

        function getCurrentProductRoot() {
            var popup = getActivePopup();
            if (popup) return popup;

            return document.querySelector('.selfles-product-main-layout__info') ||
                document.querySelector('.t-store__prod__info') ||
                document.querySelector('.t-store__prod-snippet__info') ||
                document;
        }

        function getCurrentSku() {
            var root = getCurrentProductRoot();
            var nodes = all('.js-product-sku, .t-store__prod-popup__sku, .t-store__prod__sku', root);
            var node = nodes.find(function (el) {
                return !el.closest('.t-store__card') && isVisible(el);
            }) || nodes.find(function (el) {
                return !el.closest('.t-store__card');
            });

            return node ? canonicalSku(node.textContent) : '';
        }

        function removeGeneratedRelatedBlocks() {
            all('.selfles-related-generated').forEach(function (container) {
                container.remove();
            });
        }

        function findRelatedContainer() {
            return document.querySelector('.t-store__relevants__container') ||
                document.querySelector('.js-store-relevants-grid-cont') ||
                document.querySelector('.t-store__relevants-grid-cont') ||
                null;
        }

        function getOrCreateRelatedRow(root) {
            var container = findRelatedContainer();
            var mount;
            var row;

            if (!container) return null;

            clearNativeRelatedEmptyState(container);

            row = container.querySelector('.t-store__card-list.selfles-related-generated__row') ||
                container.querySelector('.t-store__card-list');

            if (!row) {
                mount = container.matches('.js-store-relevants-grid-cont, .t-store__relevants-grid-cont') ?
                    container :
                    container.querySelector('.js-store-relevants-grid-cont, .t-store__relevants-grid-cont');

                if (!mount) return null;

                row = document.createElement('div');
                row.className = 't-store__card-list selfles-related-generated__row';
                mount.appendChild(row);
            }

            row.classList.add('t-store__card-list');
            row.classList.add('selfles-related-generated__row');

            return row;
        }

        function clearNativeRelatedEmptyState(container) {
            if (!container) return;

            all(
                '.js-store-empty-part-msg, ' +
                '.t-store__empty-part-msg, ' +
                '.t-store__empty-part-msg-cont, ' +
                '.t-store__empty-part-msg-wrapper, ' +
                '.js-store-error-msg, ' +
                '.t-store__error-msg, ' +
                '.t-store__error-msg-cont',
                container
            ).forEach(function (el) {
                el.remove();
            });

            all('*', container).forEach(function (el) {
                if (el.children.length) return;

                if (el.textContent.replace(/\s+/g, ' ').trim().toLowerCase() === 'nothing found') {
                    var wrapper = el.closest(
                        '.js-store-empty-part-msg, ' +
                        '.t-store__empty-part-msg, ' +
                        '.t-store__empty-part-msg-cont, ' +
                        '.t-store__empty-part-msg-wrapper, ' +
                        '.js-store-error-msg, ' +
                        '.t-store__error-msg, ' +
                        '.t-store__error-msg-cont'
                    );

                    (wrapper || el).remove();
                }
            });

            Array.prototype.slice.call(container.childNodes).forEach(function (node) {
                if (node.nodeType === 3 && node.textContent.replace(/\s+/g, ' ').trim().toLowerCase() === 'nothing found') {
                    node.parentNode.removeChild(node);
                }
            });
        }

        function getBaseProductTitle(product) {
            var parsed = product ? parseSku(product.sku) : null;

            if (!parsed) return product && product.title ? product.title : '';

            return TYPE_LABELS[parsed.type] || product.title || product.sku;
        }

        function buildRelatedCard(product) {
            var card = document.createElement('div');
            var link = document.createElement('a');
            var imgWrap = document.createElement('div');
            var img = document.createElement('div');
            var textWrap = document.createElement('div');
            var title = document.createElement('div');
            var sku = document.createElement('div');
            var priceWrap = document.createElement('div');
            var price = document.createElement('div');
            var priceValue = document.createElement('span');

            card.className = 'js-product js-product-relevant t-store__card selfles-related-card';
            card.setAttribute('data-product-lid', product.sku);
            card.setAttribute('data-product-url', product.url);
            card.setAttribute('data-product-inv', String(product.quantity || 0));

            link.className = 'selfles-related-card__link';
            link.setAttribute('href', product.url);

            imgWrap.className = 't-store__card__imgwrapper t-store__card__imgwrapper_1-1 selfles-related-card__imgwrapper';
            img.className = 't-store__card__img selfles-related-card__img';
            img.style.backgroundImage = 'url("' + product.image + '")';
            imgWrap.appendChild(img);

            textWrap.className = 't-store__card__textwrapper selfles-related-card__textwrapper';

            title.className = 'js-product-name t-store__card__title selfles-related-card__title';
            title.textContent = getBaseProductTitle(product) || product.sku;

            sku.className = 'js-product-sku t-store__card__sku selfles-related-card__sku';
            sku.textContent = product.sku;

            priceWrap.className = 't-store__card__price-wrapper selfles-related-card__price-wrapper';
            price.className = 't-store__card__price selfles-related-card__price';
            priceValue.className = 'js-product-price t-store__card__price-value';
            priceValue.textContent = product.price || '';

            textWrap.appendChild(title);
            textWrap.appendChild(sku);
            price.appendChild(priceValue);
            priceWrap.appendChild(price);
            textWrap.appendChild(priceWrap);

            link.appendChild(imgWrap);
            link.appendChild(textWrap);
            card.appendChild(link);

            return card;
        }

        function updateRelatedSectionState(row, visibleCount) {
            var container = row ? row.closest('.t-store__relevants__container, .js-store-relevants-grid-cont, .t-store__relevants-grid-cont') : null;
            var title = container ? container.querySelector('.t-store__relevants__title') : null;
            var prev = document.querySelector('.selfles-related-prev');
            var next = document.querySelector('.selfles-related-next');

            if (row) row.setAttribute('data-selfles-related-count', String(visibleCount));
            if (container) container.setAttribute('data-selfles-related-count', String(visibleCount));

            if (!visibleCount) {
                if (row) row.style.setProperty('display', 'none', 'important');
                if (prev) prev.style.setProperty('display', 'none', 'important');
                if (next) next.style.setProperty('display', 'none', 'important');
                return;
            }

            if (row) row.style.removeProperty('display');
            if (container) container.style.removeProperty('display');
            if (title) title.style.removeProperty('display');
        }

        function getRelatedCards(root) {
            return all('.js-product-relevant.t-store__card, .t-store__card.js-product-relevant', root || document);
        }

        function isRelatedCardHidden(card) {
            return card.getAttribute('data-selfles-related-hidden') === '1' || card.style.display === 'none';

<script>
    (function () {

            }) || null;

                document.querySelector('.t-store__prod-snippet__info') ||

            if (!data) return [];

                btn.setAttribute('data-color', color);
                btn.setAttribute('aria-label', meta.label);
                btn.setAttribute('aria-selected', color === selectedColor && target ? 'true' : 'false');
                btn.title = meta.label;
                btn.style.setProperty('background', meta.hex);
                btn.style.setProperty('pointer-events', 'auto', 'important');

                if (color === selectedColor) btn.classList.add('is-active');

                if (!target) {
                    btn.classList.add('is-disabled');
                    btn.disabled = true;
                    btn.setAttribute('aria-disabled', 'true');
                    btn.setAttribute('data-unavailable', 'true');
                    btn.setAttribute('aria-selected', 'false');
                } else {
                    btn.addEventListener('click', function () {
                        goToVariant(target);
                    });
                }

                colors.appendChild(btn);
            });

            colorRow.appendChild(colorLabel);
            colorRow.appendChild(colors);
            wrap.appendChild(colorRow);
            anchor.insertAdjacentElement('afterend', wrap);

            return true;
        }

        function initProductOptions() {
            var data = getData();
            var root = getCurrentProductRoot();
            var currentSku;
            var current;
            var variants;

            if (!data) return false;

            currentSku = getCurrentSku(root);
            current = data.parseSku(currentSku);

            if (!current) return false;

            variants = collectVariants();
            if (!variants.length) return false;

            return renderOptions(current, variants, root);
        }

        function scheduleOptions() {
            clearTimeout(scheduleOptions.timer);
            scheduleOptions.timer = setTimeout(initProductOptions, 80);
        }

        function startProductOptions() {
            initProductOptions();

            [300, 800, 1500, 3000, 5000, 8000, 12000].forEach(function (delay) {
                setTimeout(initProductOptions, delay);
            });

            if ('MutationObserver' in window && document.body) {

                        if (
                            target &&
                            target.nodeType === 1 &&
                            (
                                target.id === 'rec2310894021' ||
                                target.id === 'rec2397921511' ||
                                target.closest && target.closest('#rec2310894021, #rec2397921511') ||
                                target.matches && target.matches('.js-product, .t-store__card, .selfles-product-options')
                            )
                        ) {
                            return true;
                        }

                        return added.some(function (node) {
                            if (!node || node.nodeType !== 1) return false;

                            return (
                                node.id === 'rec2310894021' ||
                                node.id === 'rec2397921511' ||
                                node.matches && node.matches('.js-product, .t-store__card') ||
                                node.querySelector && node.querySelector('#rec2310894021, #rec2397921511, .js-product, .t-store__card')
                            );
                        });
                    });

                    if (shouldRefresh) {
                        scheduleOptions();
                    }
                });

                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['class', 'style', 'data-product-inv']
                });
            }
        }

        window.selflesInitProductOptions = initProductOptions;

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startProductOptions);
        } else {
            startProductOptions();
        }

        window.addEventListener('load', initProductOptions);
    })();
</script>
