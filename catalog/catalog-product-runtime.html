<script>
  (function () {
    var INIT_ATTR = 'data-selfles-title-backtick-cleaner';

    if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
    document.documentElement.setAttribute(INIT_ATTR, '1');

    var COLOR_LABELS = {
      pink: 'Розовый',
      green: 'Зелёный',
      coffee: 'Кофейный',
      blue: 'Голубой',
      cream: 'Сливочный',
      white: 'Белый'
    };

    var COLOR_BY_CODE = {
      P: 'pink',
      G: 'green',
      C: 'coffee',
      B: 'blue',
      S: 'cream',
      W: 'white'
    };

    var PRODUCT_OPTIONS_BLOCKLIST = {
      BL_COTO426: {
        sku: 'BL-COTO426',
        paths: {
          '/tproduct/529727686502-pled-anchovys-club-x-selfles': true,
          '/catalog/tproduct/529727686502-pled-anchovys-club-x-selfles': true
        }
      }
    };

    function isProductPage() {
      return location.pathname.indexOf('/catalog/tproduct/') !== -1 ||
              location.pathname.indexOf('/tproduct/') !== -1 ||
              location.pathname.indexOf('/product/') !== -1;
    }

    function hasModernProductRuntime() {
      return document.documentElement.getAttribute('data-selfles-product-router-v1') === '1' ||
        document.documentElement.getAttribute('data-selfles-title-backtick-cleaner-v3') === '1';
    }

    function isCatalogPage() {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var records = document.getElementById('allrecords');
      var alias = records ? String(records.getAttribute('data-tilda-page-alias') || '') : '';

      return path === '/catalog' || alias === 'catalog';
    }

    function all(selector, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(selector));
    }

    function closest(node, selector) {
      return node && node.closest ? node.closest(selector) : null;
    }

    function getText(node) {
      return node ? String(node.textContent || '').replace(/\s+/g, ' ').trim() : '';
    }

    function getAttr(node, names) {
      var i;
      var value;

      if (!node || !node.getAttribute) return '';

      for (i = 0; i < names.length; i += 1) {
        value = node.getAttribute(names[i]);
        if (value !== null && value !== undefined && String(value).trim() !== '') return String(value).trim();
      }

      return '';
    }

    function normalizeSku(value) {
      var sku = String(value || '').trim().toUpperCase();
      var aliases = window.SELFLES_SKU_ALIASES || {};

      sku = sku.replace(/^\s*(SKU|АРТИКУЛ|АРТ\.?|ART\.?|VENDOR\s+CODE)\s*:?\s*/i, '').trim().toUpperCase();

      return String(aliases[sku] || aliases[sku.replace(/\s+/g, '')] || sku).trim().toUpperCase();
    }

    function parseSku(value) {
      var external = window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.parseSku;
      var sku = normalizeSku(value);
      var match;

      if (typeof external === 'function') {
        try {
          match = external(sku);
          if (match && match.type && match.color) return match;
        } catch (e) {}
      }

      match = sku.match(/^N([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'pillowcase', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^PP(?:150|180|220)([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'duvet', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^PP([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'duvet', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^P(?:160|180|KS|EUR)([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'sheet', color: COLOR_BY_CODE[match[1]] || ''};

      return null;
    }

    function skuFromCard(card) {
      var nested;
      var value;
      var match;

      if (!card) return '';

      value = normalizeSku(getAttr(card, ['data-selfles-sku', 'data-product-sku', 'data-sku', 'data-product-lid', 'data-product-uid']));
      if (value && !/^\d+$/.test(value) && parseSku(value)) return value;

      nested = card.querySelector('.js-product-sku, .js-store-prod-sku, .t-store__card__sku, [data-product-sku], [data-sku]');
      if (nested) {
        value = normalizeSku(getAttr(nested, ['data-product-sku', 'data-sku', 'data-selfles-sku']) || getText(nested));
        if (value && !/^\d+$/.test(value) && parseSku(value)) return value;
      }

      match = String(card.textContent || '').toUpperCase().match(/\b(?:N[PGCBSW]-?BAM\d+|P(?:160|180|KS|EUR)[PGCBSW]-?BAM\d+|PP(?:150|180|220)?[PGCBSW]-?BAM\d+)\b/);

      return match ? normalizeSku(match[0]) : '';
    }

    function isBlockedProductOptionsPage(block) {
      var path = location.pathname.replace(/\/+$/, '') || '/';

      return !!(block && block.paths && block.paths[path]);
    }

    function skuFromProductOptions(options) {
      var hash;
      var sku;

      if (!options) return '';

      sku = normalizeSku(options.getAttribute('data-selfles-sku'));
      if (sku) return sku;

      hash = String(options.getAttribute('data-selfles-variants-hash') || '');
      if (hash.indexOf(':') !== -1) return normalizeSku(hash.split(':')[0]);

      return normalizeSku(hash);
    }

    function removeBlockedProductOptions() {
      if (!isProductPage()) return;

      all('.selfles-product-options[data-selfles-sku], .selfles-product-options[data-selfles-variants-hash]').forEach(function (options) {
        var key;
        var block;
        var sku = skuFromProductOptions(options);

        for (key in PRODUCT_OPTIONS_BLOCKLIST) {
          if (!Object.prototype.hasOwnProperty.call(PRODUCT_OPTIONS_BLOCKLIST, key)) continue;

          block = PRODUCT_OPTIONS_BLOCKLIST[key];
          if (sku === normalizeSku(block.sku) && isBlockedProductOptionsPage(block)) {
            if (options.parentNode) options.parentNode.removeChild(options);
            break;
          }
        }
      });
    }

    function renameCardTitleToColor(card) {
      var parsed;
      var title;
      var original;
      var label;

      if (!card) return;
      if (card.classList.contains('js-product-relevant')) return;
      if (card.classList.contains('selfles-related-card')) return;
      if (closest(card, '.t-store__prod-popup, .t-store__product-popup, .t-store__product-snippet, .t-store__cart, .t706')) return;

      parsed = parseSku(skuFromCard(card));
      if (!parsed || !parsed.color || !COLOR_LABELS[parsed.color]) return;
      if (!(parsed.type === 'pillowcase' || parsed.type === 'duvet' || parsed.type === 'sheet')) return;

      title = card.querySelector('.t-store__card__title, .js-product-name, .js-store-prod-name');
      if (!title) return;

      label = COLOR_LABELS[parsed.color];
      original = title.getAttribute('data-selfles-card-title-original') || title.getAttribute('data-selfles-title-raw') || getText(title);

      if (original && original !== label) {
        title.setAttribute('data-selfles-card-title-original', original);
      }

      if (getText(title) !== label) {
        title.textContent = label;
      }

      title.setAttribute('data-selfles-card-title-mode', 'color');
      card.setAttribute('data-selfles-card-title-mode', 'color');
      card.setAttribute('data-selfles-card-color', parsed.color);
    }

    function applyCatalogCardColorTitles() {
      if (!isCatalogPage()) return;

      all('.js-product.t-store__card:not(.js-product-relevant), .t-store__card:not(.js-product-relevant)').forEach(renameCardTitleToColor);
    }

    function stripProductTitleMarkers(value) {
      return String(value || '').replace(/`/g, '');
    }

    function buildProtectedProductTitleFragment(value) {
      var raw = String(value || '');
      var fragment = document.createDocumentFragment();
      var regexp = /`([^`]*)`/g;
      var lastIndex = 0;
      var match;
      var hasProtectedPart = false;

      function appendText(text) {
        if (!text) return;
        fragment.appendChild(document.createTextNode(text));
      }

      function appendProtectedText(text) {
        var span;

        if (!text) return;

        span = document.createElement('span');
        span.className = 'selfles-title-no-uppercase';
        span.textContent = text;
        fragment.appendChild(span);
      }

      while ((match = regexp.exec(raw)) !== null) {
        appendText(raw.slice(lastIndex, match.index));
        appendProtectedText(match[1]);
        lastIndex = regexp.lastIndex;
        hasProtectedPart = true;
      }

      appendText(raw.slice(lastIndex));

      if (!hasProtectedPart) {
        fragment.textContent = stripProductTitleMarkers(raw);
      }

      return fragment;
    }

    function applyProtectedProductTitle(el) {
      var raw;
      var alreadyRaw;

      if (!el) return;
      if (el.closest('.selfles-product-details')) return;
      if (el.closest('.selfles-product-options')) return;

      alreadyRaw = el.getAttribute('data-selfles-title-raw') || '';

      if (
              alreadyRaw &&
              el.querySelector('.selfles-title-no-uppercase') &&
              el.textContent === stripProductTitleMarkers(alreadyRaw)
      ) {
        return;
      }

      raw = el.textContent || '';

      if (raw.indexOf('`') === -1) return;

      el.textContent = '';
      el.appendChild(buildProtectedProductTitleFragment(raw));
      el.setAttribute('data-selfles-title-raw', raw);
    }

    function applyPlainCatalogTitle(el) {
      var raw;
      var clean;

      if (!el) return;
      if (el.getAttribute('data-selfles-card-title-mode') === 'color') return;
      if (el.closest('.t-store__prod-popup, .t-store__prod-snippet, .selfles-product-main-layout__info')) return;

      raw = el.textContent || '';

      if (raw.indexOf('`') === -1) return;

      clean = stripProductTitleMarkers(raw);
      el.textContent = clean;
      el.setAttribute('data-selfles-title-raw', raw);
    }

    function applySelflesTitleBacktickCleaner() {
      if (isProductPage()) {
        all([
          '.selfles-product-main-layout__info .t-store__prod__title',
          '.selfles-product-main-layout__info .t-store__prod-popup__title',
          '.selfles-product-main-layout__info .t-store__prod__name',
          '.selfles-product-main-layout__info .t-store__prod-popup__name',
          '.selfles-product-main-layout__info .js-product-name',
          '.selfles-product-main-layout__info .t-title',
          '.t-store__prod-snippet h1',
          '.t-store__prod-popup h1',
          '.t-store__prod-snippet__title',
          '.t-store__prod-popup__title',
          '.t-store__prod-snippet__name',
          '.t-store__prod-popup__name',
          '.t-store__prod-snippet .js-store-prod-name',
          '.t-store__prod-popup .js-store-prod-name'
        ].join(',')).forEach(applyProtectedProductTitle);
      }

      all([
        '.js-product.t-store__card .t-store__card__title',
        '.js-product.t-store__card .js-product-name',
        '.t-store__card .t-store__card__title',
        '.t-store__card .js-product-name',
        '.selfles-related-card__title'
      ].join(',')).forEach(applyPlainCatalogTitle);
    }

    function injectSelflesProductMobileBuyStyle() {
      var style;
      var css;
      var id = 'selfles-product-mobile-static-buy-style';

      if (!isProductPage()) return;
      if (document.getElementById(id)) return;

      css = [
        '@font-face {',
        '  font-family: "Selfles Oswald Medium";',
        '  src: url("https://static.tildacdn.com/tild6163-3130-4832-a261-306538633136/Oswald-Medium.woff") format("woff");',
        '  font-weight: 500;',
        '  font-style: normal;',
        '  font-display: swap;',
        '}',
        '@media screen and (max-width: 960px) {',
        '  body.selfles-product-page .selfles-buy-zone .t-store__prod-popup__btn-wrapper,',
        '  body.selfles-product-page .selfles-buy-zone .t-store__prod-popup__btn-wrapper-fixed {',
        '    position: static !important;',
        '    left: auto !important;',
        '    right: auto !important;',
        '    top: auto !important;',
        '    bottom: auto !important;',
        '    z-index: auto !important;',
        '    width: auto !important;',
        '    max-width: none !important;',
        '    height: auto !important;',
        '    min-height: 0 !important;',
        '    padding: 0 !important;',
        '    margin: 12px 0 0 !important;',
        '    transform: none !important;',
        '    background: transparent !important;',
        '    box-shadow: none !important;',
        '  }',
        '  body.selfles-product-page .selfles-buy-zone .t-store__prod-popup__btn,',
        '  body.selfles-product-page .selfles-buy-zone .selfles-product-buy-button-fixed {',
        '    position: relative !important;',
        '    left: auto !important;',
        '    right: auto !important;',
        '    top: auto !important;',
        '    bottom: auto !important;',
        '    width: auto !important;',
        '    min-width: 150px !important;',
        '    transform: none !important;',
        '  }',
        '  body.selfles-product-page .selfles-buy-zone {',
        '    padding-bottom: 0 !important;',
        '  }',
        '}',
        'body.selfles-product-page .t-store__prod-snippet__container {',
        '  padding-bottom: 0 !important;',
        '}',
        'body.selfles-product-page .t-store__product-snippet {',
        '  padding-bottom: 0 !important;',
        '  margin-bottom: 0 !important;',
        '}'
      ].join('\n');

      style = document.createElement('style');
      style.id = id;
      style.textContent = css;
      document.head.appendChild(style);
    }

    function ensureSelflesProductMainLayoutRoot() {
      if (!isProductPage()) return;

      all('.selfles-product-main-layout__gallery').forEach(function (gallery) {
        var parent;
        var info;

        if (!gallery) return;

        parent = gallery.parentElement;
        if (!parent) return;

        info = parent.querySelector(':scope > .selfles-product-main-layout__info');

        if (!info && gallery.nextElementSibling && gallery.nextElementSibling.classList.contains('selfles-product-main-layout__info')) {
          info = gallery.nextElementSibling;
        }

        if (!info) return;

        parent.classList.add('selfles-product-main-layout');
        parent.classList.add('selfles-product-layout-root');

        if (parent.classList.contains('t-container') && !parent.classList.contains('t-container_fluid')) {
          parent.classList.add('t-container_fluid');
        }
      });
    }

    function applySelflesLoadMoreText() {
      if (!isCatalogPage()) return;

      all([
        '.js-store-load-more-btn-text',
        '.t-store__load-more-btn .t-btnflex__text',
        '.t-store__load-more-btn span'
      ].join(',')).forEach(function (el) {
        if (!el) return;
        if ((el.textContent || '').trim() === 'ещё') return;
        el.textContent = 'ещё';
      });
    }

    function applySelflesCatalogUiFixes() {
      removeBlockedProductOptions();
      ensureSelflesProductMainLayoutRoot();
      injectSelflesProductMobileBuyStyle();
      applySelflesLoadMoreText();
    }

    function applySelflesCatalogEnhancements() {
      if (isProductPage() && hasModernProductRuntime()) return;

      applySelflesTitleBacktickCleaner();
      applyCatalogCardColorTitles();
      applySelflesCatalogUiFixes();
    }

    function scheduleSelflesTitleBacktickCleaner() {
      clearTimeout(scheduleSelflesTitleBacktickCleaner.timer);
      scheduleSelflesTitleBacktickCleaner.timer = setTimeout(applySelflesCatalogEnhancements, 80);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applySelflesCatalogEnhancements);
    } else {
      applySelflesCatalogEnhancements();
    }

    window.addEventListener('load', function () {
      applySelflesCatalogEnhancements();
      setTimeout(applySelflesCatalogEnhancements, 300);
      setTimeout(applySelflesCatalogEnhancements, 900);
      setTimeout(applySelflesCatalogEnhancements, 1500);
    });

    window.addEventListener('selfles:products-manifest-ready', applySelflesCatalogEnhancements);
    window.addEventListener('selfles:live-products-ready', applySelflesCatalogEnhancements);

    if ('MutationObserver' in window && document.body) {
      new MutationObserver(function () {
        if (isProductPage() && hasModernProductRuntime()) return;
        scheduleSelflesTitleBacktickCleaner();
      }).observe(document.body, {
        childList: true,
        subtree: true
      });
    }
  })();
</script>
