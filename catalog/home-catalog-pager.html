    var READY_ATTR = 'data-selfles-home-store-pager-ready-v10';
    var VERSION_ATTRS = [
      'data-selfles-home-store-pager-ready-v7',
      'data-selfles-home-store-pager-ready-v8',
      'data-selfles-home-store-pager-ready-v9',
      'data-selfles-home-store-pager-ready-v10'

    if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
    document.documentElement.setAttribute(INIT_ATTR, '1');

    var TECHNICAL_STORE_RECORD_IDS = {
      rec2310894021: true,

    var COLOR_LABELS = {

      G: 'green',

    function all(selector, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(selector));
    }

    function closest(node, selector) {
      return node && node.closest ? node.closest(selector) : null;
    }

    function setImportant(node, prop, value) {
      if (node && node.style) node.style.setProperty(prop, value, 'important');
    }

    function getPath() {
      var path = location.pathname.replace(/\/+$/, '');
      return path || '/';
    }

    function getAllRecords() {
      return document.querySelector('#allrecords');
    }

    function getPageAlias() {
      var allrecords = getAllRecords();
      return allrecords ? String(allrecords.getAttribute('data-tilda-page-alias') || '') : '';
    }

    function getPageId() {
      var allrecords = getAllRecords();
      return allrecords ? String(allrecords.getAttribute('data-tilda-page-id') || '') : '';
    }

    function isHomePage() {
      var path = getPath();
      var alias = getPageAlias();
      var pageId = getPageId();

      return path === '/' ||
        path === '/page94832776.html' ||
        alias === 'main' ||
        alias === 'home' ||
        alias === 'index' ||
        pageId === '94832776' ||
        !!(document.body && document.body.classList.contains('selfles-main-catalog-rows-page'));

    function isCatalogPage() {
      return getPath() === '/catalog' || getPageAlias() === 'catalog';
    }

        '  margin: 0 !important;',
        '  padding: 0 !important;',
        '  overflow: hidden !important;',
        '  opacity: 0 !important;',
        '  pointer-events: none !important;',
        '  clip: rect(0 0 0 0) !important;',
        '  clip-path: inset(50%) !important;',
        '}',
        scoped('.selfles-home-store-viewport') + ' {',

        '}',
        scoped('.selfles-home-store-track') + ' {',
        '  display: flex !important;',
        '  flex-flow: row nowrap !important;',
        '  flex-wrap: nowrap !important;',
        '  align-items: flex-start !important;',
        '  justify-content: flex-start !important;',
        '  width: 100% !important;',
        '  max-width: none !important;',
        '  float: none !important;',
        '  clear: none !important;',
        '  will-change: transform !important;',
        '  transition: transform .28s ease !important;',
        '}',
        scoped('.selfles-home-store-track > .t-clear') + ',',
        scoped('.selfles-home-store-track > .t-store__grid-separator') + ' {',
        '  display: none !important;',
        '  flex: 0 0 0 !important;',
        '  width: 0 !important;',
        '  min-width: 0 !important;',
        '  max-width: 0 !important;',
        '  height: 0 !important;',
        '  min-height: 0 !important;',
        '  max-height: 0 !important;',
        '  margin: 0 !important;',
        '  padding: 0 !important;',
        '  overflow: hidden !important;',
        '}',
        scoped('.selfles-home-store-track > .js-product.t-store__card:not(.js-product-relevant)') + ',',
        scoped('.selfles-home-store-track > .t-store__card:not(.js-product-relevant)') + ' {',
        '  float: none !important;',

        '  flex: 0 0 calc(100% / var(--selfles-main-store-per-view, 3)) !important;',
        '  width: calc(100% / var(--selfles-main-store-per-view, 3)) !important;',
        '  max-width: calc(100% / var(--selfles-main-store-per-view, 3)) !important;',

        '}',
        scoped('.selfles-home-store-arrow') + ' {',
        '  position: absolute !important;',
        '  top: 50% !important;',
        '  z-index: 50 !important;',
        '  display: flex !important;',

        '  width: 72px !important;',
        '  height: 72px !important;',
        '  min-width: 72px !important;',
        '  min-height: 72px !important;',
        '  padding: 0 0 6px !important;',
        '  border: 2px solid #EE413C !important;',
        '  border-radius: 999px !important;',
        '  background: rgba(255,255,255,.94) !important;',
        '  color: #EE413C !important;',
        '  box-shadow: none !important;',
        '  transform: translateY(-50%) !important;',
        '  cursor: pointer !important;',
        '  pointer-events: auto !important;',
        '  appearance: none !important;',
        '  -webkit-appearance: none !important;',
        '}',
        scoped('.selfles-home-store-arrow_prev') + ' { left: 16px !important; }',
        scoped('.selfles-home-store-arrow_next') + ' { right: 16px !important; }',
        scoped('.selfles-home-store-arrow::before') + ' {',
        '  display: block !important;',
        '  font-family: Arial, sans-serif !important;',
        '  font-size: 54px !important;',
        '  line-height: 1 !important;',

        '  color: #EE413C !important;',
        '}',
        scoped('.selfles-home-store-arrow_prev::before') + ' { content: "\\2190" !important; }',
        scoped('.selfles-home-store-arrow_next::before') + ' { content: "\\2192" !important; }',
        scoped('.selfles-home-store-arrow:disabled') + ' {',
        '  opacity: .28 !important;',

        '}',
        scoped('.selfles-home-store-arrow.is-loading::before') + ' { opacity: 0 !important; }',
        scoped('.selfles-home-store-arrow.is-loading::after') + ' {',
        '  content: "" !important;',

        '  width: 26px !important;',

        '  margin: -13px 0 0 -13px !important;',
        '  border: 2px solid rgba(238,65,60,.28) !important;',
        '  border-top-color: #EE413C !important;',

        '  animation: selflesHomeArrowSpin .7s linear infinite !important;',
        '}',
        '@keyframes selflesHomeArrowSpin { to { transform: rotate(360deg); } }',
        '@media screen and (max-width: 1200px) {',
        '  ' + scoped('.selfles-home-store-arrow') + ' {',
        '    width: 56px !important;',
        '    height: 56px !important;',
        '    min-width: 56px !important;',
        '    min-height: 56px !important;',
        '    padding-bottom: 5px !important;',
        '  }',
        '  ' + scoped('.selfles-home-store-arrow::before') + ' { font-size: 42px !important; }',
        '  ' + scoped('.selfles-home-store-arrow_prev') + ' { left: 10px !important; }',
        '  ' + scoped('.selfles-home-store-arrow_next') + ' { right: 10px !important; }',
        '}',
        '@media screen and (max-width: 640px) {',

        '    width: 44px !important;',

        '}'
      ].join('\n');

      document.head.appendChild(style);
    }

    function normalizeSku(value) {
      var sku = String(value || '').trim().toUpperCase();
      var aliases = window.SELFLES_SKU_ALIASES || {};

      sku = sku.replace(/^\s*(SKU|АРТИКУЛ|АРТ\.?|ART\.?|VENDOR\s+CODE)\s*:?\s*/i, '').trim().toUpperCase();

      return String(aliases[sku] || aliases[sku.replace(/\s+/g, '')] || sku).trim().toUpperCase();
    }

    function parseSku(value) {
      var external = window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.parseSku;
      var sku = normalizeSku(value);
      var match;

      if (typeof external === 'function') {
        try {
          match = external(sku);
          if (match && match.type && match.color) return match;
        } catch (e) {}
      }

      match = sku.match(/^N([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'pillowcase', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^PP(?:150|180|220)([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'duvet', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^PP([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'duvet', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^P(?:160|180|KS|EUR)([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'sheet', color: COLOR_BY_CODE[match[1]] || ''};

      match = sku.match(/^PKS([PGCBSW])-?/);
      if (match) return {sku: sku, type: 'sheet', color: COLOR_BY_CODE[match[1]] || ''};

      return null;
    }

    function getText(node) {
      return node ? String(node.textContent || '').replace(/\s+/g, ' ').trim() : '';
    }

    function getAttr(node, names) {
      var i;
      var value;

      if (!node || !node.getAttribute) return '';

      for (i = 0; i < names.length; i += 1) {
        value = node.getAttribute(names[i]);
        if (value !== null && value !== undefined && String(value).trim() !== '') return String(value).trim();
      }

      return '';
    }

    function skuFromCard(card) {
      var nested;
      var value;
      var match;

      if (!card) return '';

      value = normalizeSku(getAttr(card, ['data-selfles-sku', 'data-product-sku', 'data-sku', 'data-product-lid', 'data-product-uid']));
      if (value && !/^\d+$/.test(value) && parseSku(value)) return value;

      nested = card.querySelector('.js-product-sku, .js-store-prod-sku, .t-store__card__sku, [data-product-sku], [data-sku]');
      if (nested) {
        value = normalizeSku(getAttr(nested, ['data-product-sku', 'data-sku', 'data-selfles-sku']) || getText(nested));
        if (value && !/^\d+$/.test(value) && parseSku(value)) return value;
      }

      match = String(card.textContent || '').toUpperCase().match(/\b(?:N[PGCBSW]-?BAM\d+|P(?:160|180|KS|EUR)[PGCBSW]-?BAM\d+|PKS[PGCBSW]-?BAM\d+|PP(?:150|180|220)?[PGCBSW]-?BAM\d+)\b/);

      return match ? normalizeSku(match[0]) : '';
    }

    function renameCardTitleToColor(card) {
      var parsed;
      var title;
      var original;
      var label;

      if (!card) return;
      if (card.classList.contains('js-product-relevant')) return;
      if (card.classList.contains('selfles-related-card')) return;
      if (closest(card, '.t-store__prod-popup, .t-store__product-popup, .t-store__product-snippet, .t-store__cart, .t706')) return;

      parsed = parseSku(skuFromCard(card));
      if (!parsed || !parsed.color || !COLOR_LABELS[parsed.color]) return;
      if (!(parsed.type === 'pillowcase' || parsed.type === 'duvet' || parsed.type === 'sheet')) return;

      title = card.querySelector('.t-store__card__title, .js-product-name, .js-store-prod-name');
      if (!title) return;

      label = COLOR_LABELS[parsed.color];
      original = title.getAttribute('data-selfles-card-title-original') || title.getAttribute('data-selfles-title-raw') || getText(title);

      if (original && original !== label) {
        title.setAttribute('data-selfles-card-title-original', original);
      }

      if (getText(title) !== label) {
        title.textContent = label;
      }

      title.setAttribute('data-selfles-card-title-mode', 'color');
      card.setAttribute('data-selfles-card-title-mode', 'color');
      card.setAttribute('data-selfles-card-color', parsed.color);
    }

    function applyColorCardTitles(root) {
      if (!isHomePage() && !isCatalogPage()) return;

      all('.js-product.t-store__card:not(.js-product-relevant), .t-store__card:not(.js-product-relevant)', root || document).forEach(renameCardTitleToColor);
    }

    function renameCatalogLoadMore() {
      if (!isCatalogPage()) return;

      all('.js-store-load-more-btn-text').forEach(function (node) {
        if (/load\s*more/i.test(node.textContent || '')) {
          node.textContent = 'ещё';
        }
      });

      all('template[id^="button_loadmore_"]').forEach(function (tpl) {
        if (tpl.innerHTML && /Load\s*more/i.test(tpl.innerHTML)) {
          tpl.innerHTML = tpl.innerHTML.replace(/Load\s*more/gi, 'ещё');
        }
      });
    }

    function isRecordVisibleEnough(rec) {
      var rect;
      var style;

      if (!rec || !window.getComputedStyle) return true;

      style = window.getComputedStyle(rec);
      rect = rec.getBoundingClientRect();

      return style.display !== 'none' &&
        style.visibility !== 'hidden' &&
        rect.width > 0 &&
        rect.height > 0;
    }

    function isTechnicalStoreRecord(rec) {
      return !!(rec && TECHNICAL_STORE_RECORD_IDS[rec.id]);
    }

    function getGrid(rec) {
      var grids = all('.js-store-grid-cont', rec).filter(function (grid) {
        return !grid.classList.contains('js-store-grid-cont-preloader') &&
          !grid.classList.contains('js-store-parts-select-container');
      });

      return grids.find(function (grid) {
        return !!grid.querySelector('.t-store__card-list, .js-product.t-store__card, .t-store__card');
      }) || grids[0] || null;
    }

    function isStoreCard(node) {
      return !!(node && node.matches && node.matches('.js-product.t-store__card, .t-store__card') && !node.classList.contains('js-product-relevant'));
    }

    function isGridSeparator(node) {
      return !!(node && node.matches && node.matches('.t-clear, .t-store__grid-separator'));
    }

    function absorbLooseTrackNodes(grid, track) {
      if (!grid || !track) return;

      Array.prototype.slice.call(grid.children).forEach(function (node) {
        if (node === track) return;
        if (!node.matches) return;

        if (isStoreCard(node) || isGridSeparator(node)) {
          track.appendChild(node);
        }
      });
    }

    function getTrack(grid) {
      var track;
      var directNodes;

      if (!grid) return null;

      track = grid.querySelector('.t-store__card-list');

      if (track) {
        absorbLooseTrackNodes(grid, track);
        return track;
      }

      directNodes = Array.prototype.slice.call(grid.children).filter(function (node) {
        return isStoreCard(node) || isGridSeparator(node);
      });

      if (!directNodes.length) return null;

      track = document.createElement('div');
      track.className = 't-store__card-list';
      grid.insertBefore(track, directNodes[0]);
      directNodes.forEach(function (node) { track.appendChild(node); });

      return track;
    }

    function getCards(track) {
      if (!track) return [];

      return Array.prototype.slice.call(track.children).filter(isStoreCard);
    }

    function getPerView() {
      return window.matchMedia && window.matchMedia('(max-width: 640px)').matches ? 2 : 3;
    }

    function enforceSliderLayout(grid, track, perView) {
      var basis;
      var cards;

      if (!grid || !track) return;

      basis = 'calc(100% / ' + (perView || getPerView()) + ')';

      setImportant(grid, 'position', 'relative');
      setImportant(grid, 'overflow', 'hidden');

      track.classList.add('selfles-home-store-track');
      setImportant(track, 'display', 'flex');
      setImportant(track, 'flex-direction', 'row');
      setImportant(track, 'flex-wrap', 'nowrap');
      setImportant(track, 'align-items', 'flex-start');
      setImportant(track, 'justify-content', 'flex-start');
      setImportant(track, 'width', '100%');
      setImportant(track, 'max-width', 'none');
      setImportant(track, 'float', 'none');
      setImportant(track, 'clear', 'none');
      setImportant(track, 'will-change', 'transform');

      all('.t-clear, .t-store__grid-separator', track).forEach(function (node) {
        setImportant(node, 'display', 'none');
        setImportant(node, 'flex', '0 0 0');
        setImportant(node, 'width', '0');
        setImportant(node, 'min-width', '0');
        setImportant(node, 'max-width', '0');
        setImportant(node, 'height', '0');
        setImportant(node, 'min-height', '0');
        setImportant(node, 'max-height', '0');
        setImportant(node, 'margin', '0');
        setImportant(node, 'padding', '0');
        setImportant(node, 'overflow', 'hidden');
      });

      cards = getCards(track);
      cards.forEach(function (card) {
        setImportant(card, 'float', 'none');
        setImportant(card, 'clear', 'none');
        setImportant(card, 'display', 'block');
        setImportant(card, 'box-sizing', 'border-box');
        setImportant(card, 'flex', '0 0 ' + basis);
        setImportant(card, 'width', basis);
        setImportant(card, 'max-width', basis);
        setImportant(card, 'min-width', '0');
      });
    }

    function getLoadMoreButton(rec) {
      return rec.querySelector('.js-store-load-more-btn, .t-store__load-more-btn');
    }

    function hideLoadMore(rec) {
      all('.js-store-load-more-btn-wrap, .t-store__load-more-btn-wrap, .js-store-load-more-btn, .t-store__load-more-btn', rec || document).forEach(function (node) {
        setImportant(node, 'position', 'absolute');
        setImportant(node, 'width', '1px');
        setImportant(node, 'height', '1px');
        setImportant(node, 'min-width', '1px');
        setImportant(node, 'min-height', '1px');
        setImportant(node, 'max-width', '1px');
        setImportant(node, 'max-height', '1px');
        setImportant(node, 'margin', '0');
        setImportant(node, 'padding', '0');
        setImportant(node, 'overflow', 'hidden');
        setImportant(node, 'opacity', '0');
        setImportant(node, 'pointer-events', 'none');
        node.setAttribute('aria-hidden', 'true');
      });
    }

    function canClickLoadMore(rec) {
      var btn = getLoadMoreButton(rec);

      if (!btn || btn.disabled) return false;
      if (String(btn.style.display || '').toLowerCase() === 'none') return false;
      if (String(btn.style.visibility || '').toLowerCase() === 'hidden') return false;
      if (btn.classList.contains('t-store__load-more-btn_hidden')) return false;

      return true;
    }

    function waitForCardChange(rec, grid, track, beforeCount, done) {
      var started = Date.now();

      function check() {
        var perView = getPerView();
        var currentCount;

        absorbLooseTrackNodes(grid, track);
        enforceSliderLayout(grid, track, perView);
        applyColorCardTitles(track);
        hideLoadMore(rec);

        currentCount = getCards(track).length;

        if (currentCount > beforeCount || !canClickLoadMore(rec) || Date.now() - started > 3000) {
          done();
          return;
        }

        setTimeout(check, 100);
      }

      check();
    }

    function createArrow(type) {
      var button = document.createElement('button');

      button.type = 'button';
      button.className = 'selfles-home-store-arrow selfles-home-store-arrow_' + type;
      button.setAttribute('aria-label', type === 'next' ? 'Следующие товары' : 'Предыдущие товары');
      button.removeAttribute('hidden');

      return button;
    }

    function cleanupOldPager(rec, grid, track) {
      all('.selfles-home-store-arrow', rec).forEach(function (node) { node.remove(); });

      VERSION_ATTRS.forEach(function (attr) { rec.removeAttribute(attr); });
      rec.removeAttribute('data-selfles-home-store-ready');
      rec.classList.remove('selfles-home-store-ready');

      if (grid) grid.classList.remove('selfles-home-store-viewport');
      if (track) {
        track.classList.remove('selfles-home-store-track');
        track.style.removeProperty('transform');
        track.style.removeProperty('justify-content');
      }
    }

    function ensurePager(rec) {
      var grid;
      var track;
      var prev;
      var next;
      var state;

      if (!isHomePage()) return;
      if (!rec || isTechnicalStoreRecord(rec)) return;
      if (!isRecordVisibleEnough(rec)) return;
      if (!rec.querySelector('.t-store, .js-store') || !rec.querySelector('.js-store-grid-cont')) return;

      grid = getGrid(rec);
      track = getTrack(grid);
      if (!grid || !track || !getCards(track).length) return;

      hideLoadMore(rec);
      applyColorCardTitles(track);
      enforceSliderLayout(grid, track, getPerView());

      if (rec.getAttribute(READY_ATTR) === '1' && rec.__selflesHomePagerV10) {
        rec.__selflesHomePagerV10.refresh();
        return;
      }

      cleanupOldPager(rec, grid, track);

      grid = getGrid(rec);
      track = getTrack(grid);
      if (!grid || !track || !getCards(track).length) return;

      state = {index: 0, resizeTimer: null, loading: false};
      rec.__selflesHomePagerV10 = state;

      rec.setAttribute(READY_ATTR, '1');
      rec.setAttribute('data-selfles-home-store-ready', '1');
      rec.classList.add('selfles-home-store-ready');
      grid.classList.add('selfles-home-store-viewport');
      track.classList.add('selfles-home-store-track');

      prev = createArrow('prev');
      next = createArrow('next');
      grid.appendChild(prev);
      grid.appendChild(next);

      function refresh() {
        var perView;
        var cards;
        var hasMore;
        var maxIndex;
        var offset;

        absorbLooseTrackNodes(grid, track);
        perView = getPerView();
        enforceSliderLayout(grid, track, perView);
        applyColorCardTitles(track);
        hideLoadMore(rec);

        cards = getCards(track);
        hasMore = canClickLoadMore(rec);
        maxIndex = Math.max(0, cards.length - perView);
        offset = 0;

        if (!cards.length) return;

        rec.setAttribute('data-selfles-home-store-card-count', String(cards.length));
        track.setAttribute('data-selfles-home-store-card-count', String(cards.length));
        track.style.setProperty('--selfles-main-store-per-view', String(perView));

        if (cards.length <= perView && !hasMore) {
          state.index = 0;
          track.style.setProperty('transform', 'translate3d(0, 0, 0)', 'important');
          track.style.setProperty('justify-content', 'center', 'important');
          prev.style.display = 'none';
          next.style.display = 'none';
          prev.disabled = true;
          next.disabled = true;
          next.classList.remove('is-loading');
          next.setAttribute('aria-busy', 'false');
          return;
        }

        track.style.setProperty('justify-content', 'flex-start', 'important');
        if (state.index > maxIndex) state.index = maxIndex;

        offset = cards[state.index] ? cards[state.index].offsetLeft - cards[0].offsetLeft : 0;
        track.style.setProperty('transform', 'translate3d(' + (-offset) + 'px, 0, 0)', 'important');

        prev.disabled = state.index <= 0;
        next.classList.toggle('is-loading', !!state.loading);
        next.setAttribute('aria-busy', state.loading ? 'true' : 'false');
        next.disabled = !state.loading && state.index >= maxIndex && !hasMore;
        prev.removeAttribute('hidden');
        next.removeAttribute('hidden');
        prev.style.display = '';
        next.style.display = '';
      }

      state.refresh = refresh;

      function go(direction) {
        var perView = getPerView();
        var cards = getCards(track);
        var maxIndex = Math.max(0, cards.length - perView);
        var btn;
        var beforeCount;

        if (state.loading) return;

        if (direction > 0 && state.index >= maxIndex && canClickLoadMore(rec)) {
          btn = getLoadMoreButton(rec);
          beforeCount = cards.length;
          state.loading = true;
          refresh();
          btn.click();

          waitForCardChange(rec, grid, track, beforeCount, function () {
            state.loading = false;
            cards = getCards(track);
            maxIndex = Math.max(0, cards.length - perView);
            state.index = Math.min(state.index + perView, maxIndex);
            applyColorCardTitles(track);
            enforceSliderLayout(grid, track, getPerView());
            hideLoadMore(rec);
            refresh();
          });

          return;
        }

        state.index = direction > 0 ? Math.min(state.index + perView, maxIndex) : Math.max(state.index - perView, 0);
        refresh();
      }

      prev.addEventListener('click', function () { go(-1); });
      next.addEventListener('click', function () { go(1); });
      window.addEventListener('resize', function () {
        clearTimeout(state.resizeTimer);
        state.resizeTimer = setTimeout(refresh, 120);
      });

      refresh();
      setTimeout(refresh, 200);
      setTimeout(refresh, 700);
      setTimeout(refresh, 1500);
    }

    function setupHomeArrows() {
      if (!isHomePage()) return;

      injectHomeArrowStyles();
      document.documentElement.classList.add('selfles-home-store-arrows-page');
      if (document.body) {
        document.body.classList.add('selfles-home-store-arrows-page');
      }

      hideLoadMore(document);

      all('.t-rec').forEach(function (rec) {
        if (rec.querySelector('.t-store, .js-store') && rec.querySelector('.js-store-grid-cont')) {
          ensurePager(rec);
        }
      });
    }

    function run() {
      renameCatalogLoadMore();
      applyColorCardTitles();
      setupHomeArrows();
      applyColorCardTitles();
    }

    function scheduleRun(delay) {
      clearTimeout(scheduleRun.timer);
      scheduleRun.timer = setTimeout(run, typeof delay === 'number' ? delay : 120);
    }

    function startViewportWatcher() {
      if (!('IntersectionObserver' in window)) return;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          if (entry.target && entry.target.querySelector && entry.target.querySelector('.t-store, .js-store')) {
            scheduleRun(20);
          }
        });
      }, {root: null, rootMargin: '900px 0px', threshold: 0});

      all('.t-rec').forEach(function (rec) {
        if (rec.querySelector('.t-store, .js-store') || rec.querySelector('.js-store-grid-cont')) {
          observer.observe(rec);
        }
      });

      startViewportWatcher.observer = observer;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }

    window.addEventListener('load', function () {
      run();
      startViewportWatcher();
      [100, 300, 700, 1200, 2000, 3500, 6000].forEach(function (delay) {
        setTimeout(run, delay);
      });
    });

    window.addEventListener('scroll', function () { scheduleRun(80); }, {passive: true});
    window.addEventListener('resize', function () { scheduleRun(120); });
    window.addEventListener('orientationchange', function () { scheduleRun(120); });
    window.addEventListener('selfles:products-manifest-ready', run);
    window.addEventListener('selfles:live-products-ready', run);

    if ('MutationObserver' in window && document.body) {
      new MutationObserver(function (mutations) {
        var shouldRun = false;

        mutations.forEach(function (mutation) {
          if (shouldRun) return;
          if (mutation.type === 'childList' && (mutation.addedNodes.length || mutation.removedNodes.length)) {
            shouldRun = true;
            return;
          }
          if (mutation.type === 'attributes' && /^(class|style|data-product-url|data-product-inv)$/.test(mutation.attributeName || '')) {
            shouldRun = true;
          }
        });

        if (shouldRun) scheduleRun(120);
      }).observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'style', 'data-product-url', 'data-product-inv']
      });
    }
  })();
</script>
