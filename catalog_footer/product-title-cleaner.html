<script>
    (function () {
        var INIT_ATTR = 'data-selfles-title-backtick-cleaner-v3';
        var STYLE_ID = 'selfles-title-backtick-cleaner-style-v3';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        var rawTitleByKey = {};
        var rawTitleByClean = {};
        var observerStarted = false;
        var timer = null;

        function all(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function closest(node, selector) {
            return node && node.closest ? node.closest(selector) : null;
        }

        function cleanSku(value) {
            return String(value || '')
                .replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i, '')
                .trim()
                .toUpperCase();
        }

        function stripMarkers(value) {
            return String(value || '').replace(/`/g, '');
        }

        function normalizeTitle(value) {
            return stripMarkers(value)
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function hasMarkers(value) {
            return String(value || '').indexOf('`') !== -1;
        }

        function lowerProtectedText(value) {
            try {
                return String(value || '').toLocaleLowerCase('ru-RU');
            } catch (e) {
                return String(value || '').toLowerCase();
            }
        }

        function cleanVisibleTextFromRaw(raw) {
            return String(raw || '').replace(/`([^`]*)`/g, function (_, protectedText) {
                return lowerProtectedText(protectedText);
            });
        }

        function rememberRawTitle(key, raw) {
            key = String(key || '').trim();
            raw = String(raw || '');

            if (!key || !hasMarkers(raw)) return;

            rawTitleByKey[key] = raw;
            rawTitleByClean[normalizeTitle(raw)] = raw;
        }

        function getSkuFromRoot(root) {
            var skuEl;
            var value;

            if (!root) return '';

            value = root.getAttribute && (
                root.getAttribute('data-product-lid') ||
                root.getAttribute('data-product-uid') ||
                root.getAttribute('data-product-sku') ||
                root.getAttribute('data-sku')
            );

            if (value) return cleanSku(value);

            skuEl = root.querySelector && root.querySelector(
                '.js-product-sku, ' +
                '.t-store__card__sku, ' +
                '.t-store__prod-popup__sku, ' +
                '.t-store__prod__sku'
            );

            return skuEl ? cleanSku(skuEl.textContent) : '';
        }

        function getUrlFromRoot(root) {
            var link;
            var value;

            if (!root) return '';

            value = root.getAttribute && root.getAttribute('data-product-url');
            if (value) return value;

            link = root.querySelector && root.querySelector('a[href]');
            return link ? link.getAttribute('href') : '';
        }

        function ensureStyle() {
            var style;

            if (document.getElementById(STYLE_ID)) return;

            style = document.createElement('style');
            style.id = STYLE_ID;
            style.textContent =
                '.selfles-title-no-uppercase{' +
                'text-transform:none!important;' +
                'letter-spacing:0!important;' +
                '}' +
                '.t-store__card__title .selfles-title-no-uppercase,' +
                '.js-product-name .selfles-title-no-uppercase,' +
                '.selfles-related-card__title .selfles-title-no-uppercase{' +
                'text-transform:none!important;' +
                '}';

            (document.head || document.documentElement).appendChild(style);
        }

        function buildTitleFragment(rawValue) {
            var raw = String(rawValue || '');
            var fragment = document.createDocumentFragment();
            var regexp = /`([^`]*)`/g;
            var lastIndex = 0;
            var match;
            var hasProtectedPart = false;

            function appendText(value) {
                if (!value) return;
                fragment.appendChild(document.createTextNode(value));
            }

            function appendProtectedText(value) {
                var span;

                if (!value) return;

                span = document.createElement('span');
                span.className = 'selfles-title-no-uppercase';
                span.textContent = lowerProtectedText(value);
                fragment.appendChild(span);
            }

            while ((match = regexp.exec(raw)) !== null) {
                appendText(raw.slice(lastIndex, match.index));
                appendProtectedText(match[1]);
                lastIndex = regexp.lastIndex;
                hasProtectedPart = true;
            }

            appendText(raw.slice(lastIndex));

            if (!hasProtectedPart) {
                fragment.textContent = stripMarkers(raw);
            }

            return fragment;
        }

        function collectRawTitleMaps() {
            all([
                '.js-product.t-store__card',
                '.t-store__card',
                '.selfles-related-card'
            ].join(',')).forEach(function (card) {
                var title = card.querySelector('.js-product-name, .t-store__card__title, .selfles-related-card__title');
                var raw = title ? (title.getAttribute('data-selfles-title-raw') || title.textContent || '') : '';
                var sku = getSkuFromRoot(card);
                var url = getUrlFromRoot(card);
                var lid = card.getAttribute && (card.getAttribute('data-product-lid') || card.getAttribute('data-product-uid') || '');

                if (!hasMarkers(raw)) return;

                if (sku) rememberRawTitle('sku:' + sku, raw);
                if (lid) rememberRawTitle('lid:' + lid, raw);
                if (url) rememberRawTitle('url:' + url, raw);

                rawTitleByClean[normalizeTitle(raw)] = raw;
            });
        }

        function resolveRawTitle(el) {
            var raw = el.getAttribute('data-selfles-title-raw') || el.textContent || '';
            var root;
            var sku;
            var lid;
            var url;
            var clean;

            if (hasMarkers(raw)) return raw;

            root = closest(el, [
                '.js-product.t-store__card',
                '.t-store__card',
                '.selfles-related-card',
                '.t-store__prod-popup',
                '.t-store__prod-snippet',
                '.selfles-product-main-layout__info',
                '.t-popup'
            ].join(',')) || document;

            sku = getSkuFromRoot(root);
            if (sku && rawTitleByKey['sku:' + sku]) return rawTitleByKey['sku:' + sku];

            lid = root.getAttribute && (root.getAttribute('data-product-lid') || root.getAttribute('data-product-uid'));
            if (lid && rawTitleByKey['lid:' + lid]) return rawTitleByKey['lid:' + lid];

            url = getUrlFromRoot(root);
            if (url && rawTitleByKey['url:' + url]) return rawTitleByKey['url:' + url];

            clean = normalizeTitle(el.textContent);
            if (clean && rawTitleByClean[clean]) return rawTitleByClean[clean];

            return raw;
        }

        function shouldSkipTitle(el) {
            if (!el) return true;
            if (closest(el, '.selfles-product-details')) return true;
            if (closest(el, '.selfles-product-options')) return true;
            if (closest(el, '.t706, .t-store__cart, .t-store__prod__quantity, .t-store__prod-popup__quantity')) return true;

            return false;
        }

        function applyTitle(el) {
            var raw;
            var expected;

            if (shouldSkipTitle(el)) return;

            raw = resolveRawTitle(el);

            if (!hasMarkers(raw)) return;

            expected = cleanVisibleTextFromRaw(raw);

            if (
                el.getAttribute('data-selfles-title-raw') === raw &&
                el.querySelector('.selfles-title-no-uppercase') &&
                normalizeTitle(el.textContent) === normalizeTitle(expected)
            ) {
                return;
            }

            el.textContent = '';
            el.appendChild(buildTitleFragment(raw));
            el.setAttribute('data-selfles-title-raw', raw);
        }

        function formatPriceText(value) {
            var raw = String(value || '')
                .replace(/\u00a0/g, ' ')
                .replace(/[₽рруб\.]/gi, '')
                .replace(/\s+/g, '')
                .replace(',', '.')
                .trim();
            var number = Number(raw);
            var rounded;

            if (!isFinite(number)) return '';

            rounded = Math.round(number);

            if (Math.abs(number - rounded) > 0.000001) {
                return String(value || '').replace(/\.0+\b/g, '').trim();
            }

            return String(rounded).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }

        function normalizePrices() {
            all([
                '.js-product-price.js-store-prod-price-val',
                '.js-store-prod-price-val',
                '.t-store__prod-popup__price-value',
                '.t-store__prod__price-value',
                '.t-store__card__price-value'
            ].join(',')).forEach(function (priceEl) {
                var clean;
                var value = priceEl.textContent || '';

                if (value.indexOf('.') === -1 && value.indexOf(',') === -1) return;

                clean = formatPriceText(value);
                if (!clean) return;

                if (priceEl.textContent !== clean) {
                    priceEl.textContent = clean;
                }

                if (priceEl.hasAttribute('data-product-price-def-str')) {
                    priceEl.setAttribute('data-product-price-def-str', clean.replace(/\s+/g, ''));
                }
            });
        }

        function isProductPage() {
            var path = location.pathname.replace(/\/+$/, '');
            return path.indexOf('/catalog/tproduct/') !== -1 ||
                path.indexOf('/tproduct/') !== -1 ||
                path.indexOf('/product/') !== -1 ||
                !!(document.body && document.body.classList.contains('selfles-product-page'));
        }

        function getProductInfoRoot() {
            return document.querySelector([
                '.selfles-product-main-layout__info',
                '.t-store__prod-popup__info',
                '.t-store__prod__info',
                '.t-store__prod-snippet__info'
            ].join(','));
        }

        function visibleText(el) {
            return String(el ? el.textContent || '' : '')
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function currentProductType(root) {
            var sku = '';

            if (!root) return '';

            sku = root.querySelector('.selfles-product-options[data-selfles-sku]') ?
                root.querySelector('.selfles-product-options[data-selfles-sku]').getAttribute('data-selfles-sku') : '';

            sku = cleanSku(sku || visibleText(root.querySelector('.js-product-sku, .js-store-prod-sku, .t-store__prod-popup__sku, .t-store__prod__sku')));

            if (/^N[PGCBSW]-?BAM/i.test(sku)) return 'pillowcase';
            if (/^PP/i.test(sku)) return 'duvet';
            if (/^P(?:160|180|KS|EUR)/i.test(sku)) return 'sheet';

            return '';
        }

        function productDetailsParagraphs(type, root) {
            var shortText = visibleText(root && root.querySelector('.js-store-prod-all-text'));
            var common = 'Выполнено из 100% бамбукового волокна — натурального экологичного материала, мягкого и гладкого, как шёлк, но более практичного в уходе и использовании. Гипоаллергенный материал бережно заботится о коже и волосах, обеспечивает комфортный микроклимат: прохладу летом и уютное тепло зимой.';
            var ending = 'Сочетайте разные цвета и размеры или выбирайте однотонный комплект — создайте свой идеальный сет под настроение. Яркая подарочная упаковка с покрытием soft touch делает selfles отличным выбором для себя и близких.';
            var specific = '';
            var result = [];

            if (type === 'duvet') {
                specific = 'Пододеяльник комфортно ощущается на коже, красиво драпируется и помогает сохранять аккуратный вид спального комплекта.';
            } else if (type === 'pillowcase') {
                specific = 'Комплект из двух наволочек 50×70 см мягко соприкасается с кожей и волосами, поддерживая ощущение свежести и лёгкости.';
            } else if (type === 'sheet') {
                specific = 'Простыня мягко ложится на матрас, приятна к телу и дополняет комплект спокойной тактильной роскошью.';
            }

            if (shortText) result.push(shortText);
            result.push(common);
            if (specific) result.push(specific);
            result.push(ending);

            return result;
        }

        function careParagraphs() {
            return [
                'Стирать на деликатном режиме при температуре не выше 30°С.',
                'Использовать мягкие средства без отбеливателей.',
                'Не сушить в барабане и не отдавать в химчистку.',
                'Гладить при температуре до 110°С.',
                'Сушить естественным способом.'
            ];
        }

        function compactDetailsText(value) {
            return String(value || '')
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function uniqueParagraphs(values) {
            var seen = {};
            var result = [];

            (values || []).forEach(function (value) {
                var text = compactDetailsText(value);
                var key = text.toLowerCase();

                if (!text || seen[key]) return;

                seen[key] = true;
                result.push(text);
            });

            return result;
        }

        function paragraphsFromNativeContent(content) {
            var nodes;
            var result = [];

            if (!content) return result;

            nodes = all('blockquote, p, li', content);

            if (nodes.length) {
                nodes.forEach(function (node) {
                    result.push(visibleText(node));
                });
            } else {
                result.push(visibleText(content));
            }

            return uniqueParagraphs(result);
        }

        function nativeTabTitle(item) {
            return visibleText(
                item.querySelector('.t-store__tabs__item-title') ||
                item.querySelector('.js-store-tab-button') ||
                item
            );
        }

        function readNativeDetails(root) {
            var data = {details: [], care: []};

            all('.t-store__tabs__item', root).forEach(function (item) {
                var title = nativeTabTitle(item).toLowerCase();
                var paragraphs = paragraphsFromNativeContent(item.querySelector('.t-store__tabs__content'));

                if (!paragraphs.length) return;

                if (title.indexOf('уход') !== -1) {
                    data.care = paragraphs;
                } else if (title.indexOf('подробнее') !== -1 || !data.details.length) {
                    data.details = paragraphs;
                }
            });

            return data;
        }

        function hideNativeTabs(root) {
            all([
                '.t-store__tabs',
                '.t-store__tabs__list',
                '.t-store__tabs__wrapper',
                '.t-store__prod-popup__tabs',
                '.t-store__prod__tabs'
            ].join(','), root).forEach(function (node) {
                if (closest(node, '.selfles-product-details')) return;

                node.classList.add('selfles-tilda-tabs-hidden');
                node.setAttribute('aria-hidden', 'true');
                node.style.setProperty('display', 'none', 'important');
                node.style.setProperty('height', '0', 'important');
                node.style.setProperty('min-height', '0', 'important');
                node.style.setProperty('max-height', '0', 'important');
                node.style.setProperty('margin', '0', 'important');
                node.style.setProperty('padding', '0', 'important');
                node.style.setProperty('overflow', 'hidden', 'important');
            });
        }

        function createDetailsItem(titleText, paragraphs, isOpen) {
            var item = document.createElement('div');
            var title = document.createElement('button');
            var body = document.createElement('div');

            item.className = 'selfles-product-details__item' + (isOpen ? ' is-open' : '');
            title.className = 'selfles-product-details__title';
            title.type = 'button';
            title.textContent = titleText;
            title.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            body.className = 'selfles-product-details__body';

            uniqueParagraphs(paragraphs).forEach(function (text) {
                var p = document.createElement('p');
                p.textContent = text;
                body.appendChild(p);
            });

            title.addEventListener('click', function () {
                var opened = item.classList.toggle('is-open');
                title.setAttribute('aria-expanded', opened ? 'true' : 'false');
            });

            item.appendChild(title);
            item.appendChild(body);
            return item;
        }

        function normalizeProductDetails() {
            var root;
            var existing;
            var type;
            var anchor;
            var details;
            var nativeData;
            var detailsParagraphs;
            var rulesParagraphs;
            var signature;

            if (!isProductPage()) return;

            root = getProductInfoRoot();
            if (!root) return;

            nativeData = readNativeDetails(root);
            hideNativeTabs(root);

            type = currentProductType(root);
            detailsParagraphs = nativeData.details.length ? nativeData.details : productDetailsParagraphs(type, root);
            rulesParagraphs = nativeData.care.length ? nativeData.care : careParagraphs();
            signature = detailsParagraphs.join('\n') + '\n---\n' + rulesParagraphs.join('\n');

            existing = root.querySelector('.selfles-product-details[data-selfles-details-fallback="1"]');

            if (existing && existing.getAttribute('data-selfles-details-signature') === signature) return;
            if (existing) existing.remove();

            anchor = root.querySelector('.selfles-buy-zone') ||
                root.querySelector('.js-store-price-wrapper') ||
                root.querySelector('.js-store-prod-text') ||
                root.lastElementChild;

            if (!anchor) return;

            details = document.createElement('div');
            details.className = 'selfles-product-details';
            details.setAttribute('data-selfles-details-fallback', '1');
            details.setAttribute('data-selfles-details-signature', signature);
            details.appendChild(createDetailsItem('Подробнее', detailsParagraphs, true));
            details.appendChild(createDetailsItem('Правила ухода', rulesParagraphs, false));

            anchor.insertAdjacentElement('afterend', details);
        }

        function applyCleaner() {
            ensureStyle();
            collectRawTitleMaps();
            normalizePrices();
            normalizeProductDetails();

            all([
                '.js-product.t-store__card .t-store__card__title',
                '.js-product.t-store__card .js-product-name',
                '.t-store__card .t-store__card__title',
                '.t-store__card .js-product-name',
                '.selfles-related-card__title',

                '.selfles-product-main-layout__info .t-store__prod__title',
                '.selfles-product-main-layout__info .t-store__prod-popup__title',
                '.selfles-product-main-layout__info .t-store__prod__name',
                '.selfles-product-main-layout__info .t-store__prod-popup__name',
                '.selfles-product-main-layout__info .js-store-prod-name',
                '.selfles-product-main-layout__info .js-product-name',
                '.selfles-product-main-layout__info .t-title',

                '.t-store__prod-snippet h1',
                '.t-store__prod-popup h1',
                '.t-store__prod-snippet__title',
                '.t-store__prod-popup__title',
                '.t-store__prod-snippet__name',
                '.t-store__prod-popup__name',
                '.t-store__prod-snippet .js-store-prod-name',
                '.t-store__prod-popup .js-store-prod-name',
                '.t-popup .t-store__prod-popup__name',
                '.t-popup .js-store-prod-name'
            ].join(',')).forEach(applyTitle);
        }

        function scheduleCleaner() {
            clearTimeout(timer);
            timer = setTimeout(applyCleaner, 80);
        }

        function startObserver() {
            if (observerStarted || !document.body || !('MutationObserver' in window)) return;

            observerStarted = true;

            new MutationObserver(scheduleCleaner).observe(document.body, {
                childList: true,
                subtree: true,
                characterData: true
            });
        }

        function boot() {
            applyCleaner();
            startObserver();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }

        window.addEventListener('load', function () {
            boot();
            setTimeout(boot, 300);
            setTimeout(boot, 900);
            setTimeout(boot, 1500);
        });

        window.selflesTitleBacktickCleaner = boot;
    })();
</script>
