<script>
window.selflesFindLargeBlocks = function () {
  return Array.prototype.slice.call(document.body.querySelectorAll('.t-rec, body > *')).map(function (el) {
    var r = el.getBoundingClientRect();
    var s = getComputedStyle(el);
    return {
      tag: el.tagName,
      id: el.id,
      className: String(el.className || '').slice(0, 120),
      height: Math.round(r.height),
      top: Math.round(r.top),
      display: s.display,
      visibility: s.visibility,
      opacity: s.opacity
    };
  }).filter(function (x) {
    return x.height > 500;
  });
};
</script>
