<script data-selfles-products-manifest="live-st315n">
    (function () {
        var INIT_ATTR = 'data-selfles-live-products-manifest-bridge';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        function dispatchReady(meta) {
            meta = meta || {};
            meta.source = meta.source || 'st315n';
            meta.donor = meta.donor || '#rec2417486561';
            meta.staticManifest = false;

            try {
                window.SELFLES_PRODUCTS_MANIFEST_META = meta;
                window.dispatchEvent(new CustomEvent('selfles:products-manifest-ready', {detail: meta}));
            } catch (e) {
            }
        }

        function refresh() {
            var result = null;

            if (typeof window.selflesRefreshLiveProductsSource === 'function') {
                try {
                    result = window.selflesRefreshLiveProductsSource({dispatch: false});
                } catch (e) {
                    result = null;
                }
            }

            dispatchReady(result && result.meta ? result.meta : {
                source: 'st315n',
                donor: '#rec2417486561',
                productsCount: window.SELFLES_PRODUCTS_BY_SKU ? Object.keys(window.SELFLES_PRODUCTS_BY_SKU).length : 0,
                ready: document.documentElement.getAttribute('data-selfles-live-products-ready') === '1'
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', refresh);
        } else {
            refresh();
        }

        window.addEventListener('selfles:live-products-ready', function (event) {
            dispatchReady(event.detail || {});
        });

        window.addEventListener('load', function () {
            refresh();
            setTimeout(refresh, 400);
            setTimeout(refresh, 1200);
            setTimeout(refresh, 2500);
        });
    })();
</script>
