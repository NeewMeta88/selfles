<style>
.selfles-product-options__size[data-unavailable="true"],
.selfles-product-options__size.is-disabled,
.selfles-product-options__sizes button[data-unavailable="true"],
.selfles-product-options__sizes button.is-disabled,
.selfles-product-options__color[data-unavailable="true"],
.selfles-product-options__color.is-disabled,
.swatch[data-unavailable="true"],
.swatch.is-disabled {
  opacity: 0.32 !important;
  cursor: not-allowed !important;
  filter: grayscale(0.55) saturate(0.6) !important;
}
</style>
<script>
(function () {
  var INIT_ATTR = 'data-selfles-product-options-availability-fix';
  var BLOCK_ATTR = 'data-selfles-option-blocked';

  if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
  document.documentElement.setAttribute(INIT_ATTR, '1');

  function all(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  function norm(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/&nbsp;/g, ' ')
      .replace(/\u00a0/g, ' ')
      .replace(/["'«»]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function compact(value) {
    return norm(value).replace(/[^a-zа-я0-9]+/g, '');
  }

  function attr(el, names) {
    var i;
    var value;

    for (i = 0; i < names.length; i += 1) {
      value = el && el.getAttribute ? el.getAttribute(names[i]) : '';
      if (value !== null && value !== undefined && String(value).trim() !== '') return String(value);
    }

    return '';
  }

  function colorKey(value) {
    var raw = compact(value);
    var colors = window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.colors || {};
    var key;
    var names;
    var i;

    if (!raw) return '';
    if (raw === 'red' || raw === 'krasnyj' || raw === 'krasny' || raw === 'красный' || raw === 'красная') return 'pink';

    for (key in colors) {
      names = [key, colors[key].label, colors[key].code].concat(colors[key].names || []);
      for (i = 0; i < names.length; i += 1) {
        if (raw === compact(names[i])) return key;
      }
    }

    return raw;
  }

  function sizeKey(value) {
    return norm(value)
      .replace(/[×хx]/g, 'x')
      .replace(/\s+/g, '')
      .replace(/см/g, '')
      .replace(/,/g, '.');
  }

  function sizeLabels(type) {
    var data = window.SELFLES_PRODUCT_DATA || {};

    if (type === 'duvet') return data.duvetSizeLabels || {'150': '150 х 200', '180': '180 х 210', '200': '200 х 220', '220': '220 х 240'};
    if (type === 'sheet') return data.sheetSizeLabels || {'160': '160 х 200 х 30', '180': '180 х 200 х 30', 'EUR': '220 х 240 (без резинки)', 'KS': '240 х 260 (без резинки)'};

    return {};
  }

  function sizeOptionKey(type, value) {
    var raw = sizeKey(value);
    var labels = sizeLabels(type);
    var key;

    if (!raw) return '';
    if (labels[raw] || raw === '150' || raw === '180' || raw === '200' || raw === '220' || raw === '160' || raw === 'EUR' || raw === 'KS') return raw;

    for (key in labels) {
      if (sizeKey(labels[key]) === raw || sizeKey(key) === raw) return key;
    }

    return raw;
  }

  function cleanSku(value) {
    var fn = window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.canonicalSku;
    if (typeof fn === 'function') return fn(value);
    return String(value || '').trim().toUpperCase();
  }

  function parseSku(value) {
    var fn = window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.parseSku;
    var sku = cleanSku(value);
    var match;
    var colorByCode = {P: 'pink', G: 'green', C: 'coffee', B: 'blue', S: 'cream', W: 'white'};

    if (typeof fn === 'function') return fn(sku);
    match = sku.match(/^PP(150|180|220)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'duvet', size: match[1], color: colorByCode[match[2]]};
    match = sku.match(/^PP([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'duvet', size: '200', color: colorByCode[match[1]]};
    match = sku.match(/^P(160|180)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'sheet', size: match[1], color: colorByCode[match[2]]};
    match = sku.match(/^P(KS|EUR)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'sheet', size: match[1], color: colorByCode[match[2]]};
    match = sku.match(/^N([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'pillowcase', size: null, color: colorByCode[match[1]]};

    return null;
  }

  function currentSku() {
    var nodes = all('.js-product-sku, .js-store-prod-sku, .t-store__prod-popup__sku, .t-store__prod__sku')
      .filter(function (node) { return !node.closest('#rec2417486561') && !node.closest('.t-store__card'); });

    return nodes.length ? cleanSku(nodes[0].textContent) : '';
  }

  function currentType() {
    var parsed = parseSku(currentSku());
    var title;

    if (parsed && parsed.type) return parsed.type;
    title = norm((document.querySelector('h1, .t-store__prod-popup__name, .t-store__prod__name, .js-product-name') || {}).textContent || '');
    if (title.indexOf('пододеял') !== -1) return 'duvet';
    if (title.indexOf('простын') !== -1) return 'sheet';
    if (title.indexOf('наволоч') !== -1) return 'pillowcase';

    return '';
  }

  function optionValue(el, kind) {
    var names = kind === 'color'
      ? ['data-color', 'data-selfles-color', 'data-option-color', 'data-value', 'title', 'aria-label']
      : ['data-size', 'data-selfles-size', 'data-option-size', 'data-value', 'title', 'aria-label'];

    return attr(el, names) || (el ? el.textContent : '') || '';
  }

  function optionSelected(el) {
    return !!el && (
      el.getAttribute('aria-selected') === 'true' ||
      el.classList.contains('is-active') ||
      el.classList.contains('active') ||
      el.classList.contains('t-active') ||
      el.classList.contains('selected')
    );
  }

  function sizeButtons() {
    return all('button[data-size], [data-selfles-size], [data-option-size], .selfles-product-options__size, .selfles-product-options__sizes button')
      .filter(function (button, index, list) { return list.indexOf(button) === index && !button.closest('#rec2417486561'); });
  }

  function colorButtons() {
    return all('button[data-color], [data-selfles-color], [data-option-color], .swatch, .selfles-product-options__color, .selfles-product-options__color button')
      .filter(function (button, index, list) { return list.indexOf(button) === index && !button.closest('#rec2417486561'); });
  }

  function productAvailable(product) {
    var quantity = product && product.quantity;
    return !!product && (quantity === '' || quantity === null || quantity === undefined || Number(quantity) > 0 || Number(quantity) === 99999);
  }

  function buildAvailability() {
    var manifest = window.SELFLES_PRODUCTS_BY_SKU || {};
    var availability = {};

    Object.keys(manifest).forEach(function (sku) {
      var product = manifest[sku];
      var parsed = parseSku((product && product.sku) || sku);
      var type;
      var size;
      var color;

      if (!productAvailable(product) || !parsed) return;
      type = product.type || parsed.type;
      size = product.size || parsed.size;
      color = product.color || parsed.color;
      if (!type || !color) return;

      if (!availability[type]) availability[type] = {colors: {}, sizes: {}, sizeColors: {}, colorSizes: {}};
      availability[type].colors[color] = true;
      if (size) availability[type].sizes[size] = true;
      if (size) {
        if (!availability[type].sizeColors[size]) availability[type].sizeColors[size] = {};
        if (!availability[type].colorSizes[color]) availability[type].colorSizes[color] = {};
        availability[type].sizeColors[size][color] = true;
        availability[type].colorSizes[color][size] = true;
      }
    });

    return availability;
  }

  function selectedSize(type, buttons) {
    var parsed = parseSku(currentSku());
    var found = parsed && parsed.type === type ? parsed.size : '';

    (buttons || sizeButtons()).some(function (button) {
      var value;
      if (!optionSelected(button)) return false;
      value = sizeOptionKey(type, optionValue(button, 'size'));
      if (!value) return false;
      found = value;
      return true;
    });

    return found;
  }

  function selectedColor(buttons) {
    var parsed = parseSku(currentSku());
    var found = parsed && parsed.color ? parsed.color : '';

    (buttons || colorButtons()).some(function (button) {
      var value;
      if (!optionSelected(button)) return false;
      value = colorKey(optionValue(button, 'color'));
      if (!value) return false;
      found = value;
      return true;
    });

    return found;
  }

  function hasSizeColors(bucket, size) {
    return !!(bucket && size && bucket.sizeColors && bucket.sizeColors[size] && Object.keys(bucket.sizeColors[size]).length);
  }

  function hasColorForSize(bucket, size, color) {
    if (!bucket || !color) return false;
    if (!size) return !!(bucket.colors && bucket.colors[color]);
    return !!(bucket.sizeColors && bucket.sizeColors[size] && bucket.sizeColors[size][color]);
  }

  function setDisabled(el, disabled) {
    if (!el) return;

    if (disabled) {
      el.setAttribute(BLOCK_ATTR, '1');
      el.setAttribute('data-unavailable', 'true');
      el.setAttribute('aria-disabled', 'true');
      el.classList.add('is-disabled', 'selfles-option-disabled');
      if ('disabled' in el && /^(button|input|select|option)$/i.test(el.tagName)) el.disabled = true;
      return;
    }

    el.removeAttribute(BLOCK_ATTR);
    el.removeAttribute('data-unavailable');
    el.setAttribute('aria-disabled', 'false');
    el.classList.remove('is-disabled', 'selfles-option-disabled');
    if ('disabled' in el && /^(button|input|select|option)$/i.test(el.tagName)) el.disabled = false;
  }

  function autoSelectColor(bucket, size, buttons) {
    var current = selectedColor(buttons);
    var target = null;
    var colorOrder = (window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.colorOrder) || ['pink', 'green', 'coffee', 'blue', 'cream', 'white'];

    if (!size || hasColorForSize(bucket, size, current)) return;

    colorOrder.some(function (color) {
      if (!hasColorForSize(bucket, size, color)) return false;
      target = buttons.find(function (button) { return colorKey(optionValue(button, 'color')) === color; });
      return !!target;
    });

    if (!target || optionSelected(target)) return;

    setTimeout(function () {
      if (target.getAttribute(BLOCK_ATTR) === '1' || target.disabled) return;
      target.click();
    }, 0);
  }

  function applyOptions() {
    var type = currentType();
    var availability = buildAvailability();
    var bucket = availability[type];
    var sizes;
    var colors;
    var size;

    if (!type || !bucket) return;

    sizes = sizeButtons();
    colors = colorButtons();
    size = selectedSize(type, sizes);

    sizes.forEach(function (button) {
      var value = sizeOptionKey(type, optionValue(button, 'size'));
      if (value) setDisabled(button, !hasSizeColors(bucket, value));
    });

    colors.forEach(function (button) {
      var value = colorKey(optionValue(button, 'color'));
      if (value) setDisabled(button, !hasColorForSize(bucket, size, value));
    });

    autoSelectColor(bucket, size, colors);
  }

  function blockDisabledOption(event) {
    var disabled = event && event.target && event.target.closest && event.target.closest('[' + BLOCK_ATTR + '="1"], .selfles-option-disabled, [data-unavailable="true"][aria-disabled="true"]');

    if (!disabled) return true;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    return false;
  }

  function scheduleApply() {
    clearTimeout(scheduleApply.timer);
    scheduleApply.timer = setTimeout(applyOptions, 80);
  }

  function boot() {
    applyOptions();
    [120, 300, 700, 1300, 2500, 5000].forEach(function (delay) { setTimeout(applyOptions, delay); });
    ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(function (name) {
      window.addEventListener(name, blockDisabledOption, true);
      document.addEventListener(name, function () { setTimeout(applyOptions, 0); }, true);
    });

    if ('MutationObserver' in window) {
      new MutationObserver(scheduleApply).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'aria-selected', 'aria-disabled', 'data-unavailable', 'disabled', 'data-product-inv']
      });
    }

    window.addEventListener('selfles:live-products-ready', applyOptions);
    window.addEventListener('selfles:products-manifest-ready', applyOptions);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.addEventListener('load', function () { applyOptions(); setTimeout(applyOptions, 800); });
}());
</script>
