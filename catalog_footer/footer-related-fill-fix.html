<script>
(function(){
  var INIT='data-selfles-related-fill-fix';
  var MAX=3;
  var CODE={P:'pink',G:'green',C:'coffee',B:'blue',S:'cream',W:'white'};
  if(document.documentElement.getAttribute(INIT)==='1')return;
  document.documentElement.setAttribute(INIT,'1');

  function all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
  function closest(n,s){return n&&n.closest?n.closest(s):null;}
  function canonical(v){var fn=window.SELFLES_PRODUCT_DATA&&window.SELFLES_PRODUCT_DATA.canonicalSku;return typeof fn==='function'?fn(v):String(v||'').trim().toUpperCase();}
  function parseSku(v){var fn=window.SELFLES_PRODUCT_DATA&&window.SELFLES_PRODUCT_DATA.parseSku,p,m,s=canonical(v);if(typeof fn==='function'){p=fn(s);if(p)return p;}m=s.match(/^PP(150|180|220)([PGCBSW])-?/);if(m)return{sku:s,type:'duvet',size:m[1],color:CODE[m[2]]};m=s.match(/^PP([PGCBSW])-?/);if(m)return{sku:s,type:'duvet',size:'200',color:CODE[m[1]]};m=s.match(/^P(160|180)([PGCBSW])-?/);if(m)return{sku:s,type:'sheet',size:m[1],color:CODE[m[2]]};m=s.match(/^P(KS|EUR)([PGCBSW])-?/);if(m)return{sku:s,type:'sheet',size:m[1],color:CODE[m[2]]};m=s.match(/^N([PGCBSW])-?/);if(m)return{sku:s,type:'pillowcase',size:null,color:CODE[m[1]]};return null;}
  function productAvailable(p){var q=p&&p.quantity;return !!p&&(q===''||q==null||Number(q)>0||Number(q)===99999);}
  function productUrl(p){var url=p&&p.url||'';if(window.selflesNormalizeProductUrl)return window.selflesNormalizeProductUrl(url)||url;return url;}
  function currentSku(){var root=document.querySelector('.selfles-product-options[data-selfles-sku]'),node;if(root)return canonical(root.getAttribute('data-selfles-sku'));node=all('.js-product-sku,.js-store-prod-sku,.t-store__prod-popup__sku,.t-store__prod__sku').filter(function(n){return !closest(n,'#rec2417486561')&&!closest(n,'.t-store__card');})[0];return node?canonical(node.textContent):'';}
  function relatedRow(){return document.querySelector('.selfles-related-generated__row')||document.querySelector('.t-store__relevants-grid-cont .t-store__card-list,.js-store-relevants-grid-cont .t-store__card-list');}
  function existingSkus(row){var map={};all('.selfles-related-card,.js-product-relevant.t-store__card,.t-store__card.js-product-relevant',row).forEach(function(card){var sku=canonical(card.getAttribute('data-product-lid')||((card.querySelector('.js-product-sku,.t-store__card__sku')||{}).textContent));if(sku)map[sku]=1;});return map;}
  function countCards(row){return all('.selfles-related-card,.js-product-relevant.t-store__card,.t-store__card.js-product-relevant',row).filter(function(card){return card.style.display!=='none';}).length;}
  function baseTitle(p){var parsed=parseSku(p&&p.sku),labels={sheet:'Простыня на резинке',duvet:'Пододеяльник',pillowcase:'Комплект наволочек (2 шт.)'};return parsed&&labels[parsed.type]||p.title||p.sku;}
  function buildCard(p,order){var card=document.createElement('div'),link=document.createElement('a'),imgWrap=document.createElement('div'),img=document.createElement('div'),text=document.createElement('div'),title=document.createElement('div'),sku=document.createElement('div'),priceWrap=document.createElement('div'),price=document.createElement('div'),priceValue=document.createElement('span'),url=productUrl(p);card.className='js-product js-product-relevant t-store__card selfles-related-card';card.setAttribute('data-product-lid',p.sku);card.setAttribute('data-product-url',url);card.setAttribute('data-product-inv',String(p.quantity||0));card.setAttribute('data-selfles-related-fallback','1');card.style.setProperty('display','block','important');card.style.setProperty('order',String(order),'important');link.className='selfles-related-card__link';link.setAttribute('href',url);imgWrap.className='t-store__card__imgwrapper t-store__card__imgwrapper_1-1 selfles-related-card__imgwrapper';img.className='t-store__card__img selfles-related-card__img';img.style.backgroundImage='url("'+p.image+'")';imgWrap.appendChild(img);text.className='t-store__card__textwrapper selfles-related-card__textwrapper';title.className='js-product-name t-store__card__title selfles-related-card__title';title.textContent=baseTitle(p);sku.className='js-product-sku t-store__card__sku selfles-related-card__sku';sku.textContent=p.sku;priceWrap.className='t-store__card__price-wrapper selfles-related-card__price-wrapper';price.className='t-store__card__price selfles-related-card__price';priceValue.className='js-product-price t-store__card__price-value';priceValue.textContent=String(p.price||'').replace(/\s*р\.?$/,'')+'р.';price.appendChild(priceValue);priceWrap.appendChild(price);text.appendChild(title);text.appendChild(sku);text.appendChild(priceWrap);link.appendChild(imgWrap);link.appendChild(text);card.appendChild(link);return card;}
  function availableProducts(){var manifest=window.SELFLES_PRODUCTS_BY_SKU||{},list=[];Object.keys(manifest).forEach(function(sku){var p=manifest[sku],parsed;if(!p)return;p.sku=canonical(p.sku||sku);parsed=parseSku(p.sku);if(parsed){p.type=p.type||parsed.type;p.color=p.color||parsed.color;p.size=p.size||parsed.size;}if(!productAvailable(p)||!p.image||!productUrl(p)||!p.type)return;list.push(p);});return list;}
  function colorScore(color,prefs){var i=prefs.indexOf(color);return i===-1?99:i;}
  function chooseForShape(products,used,shape,current){var prefs=[];[shape&&shape.color,current&&current.color,'white','pink','green','coffee','blue','cream'].forEach(function(c){if(c&&prefs.indexOf(c)===-1)prefs.push(c);});return products.filter(function(p){return !used[p.sku]&&(!shape||!shape.type||p.type===shape.type);}).sort(function(a,b){return colorScore(a.color,prefs)-colorScore(b.color,prefs);})[0]||null;}
  function chooseAny(products,used,current){var preferred=current&&current.type==='duvet'?['sheet','pillowcase']:current&&current.type==='sheet'?['duvet','pillowcase']:['sheet','duvet','pillowcase'];return products.filter(function(p){return !used[p.sku]&&(!current||p.type!==current.type);}).sort(function(a,b){return preferred.indexOf(a.type)-preferred.indexOf(b.type);})[0]||null;}
  function apply(){var sku=currentSku(),current=parseSku(sku),row=relatedRow(),related=window.SELFLES_RELATED_PRODUCTS_BY_SKU||{},allowed=(related[sku]||[]).map(canonical),used,products,missing,count,order;if(!sku||!row)return;count=countCards(row);if(count>=MAX)return;used=existingSkus(row);products=availableProducts();missing=allowed.filter(function(s){return !used[s];}).map(parseSku).filter(Boolean);order=count;while(count<MAX){var shape=missing.shift()||null,p=chooseForShape(products,used,shape,current)||chooseAny(products,used,current);if(!p)break;used[p.sku]=1;row.appendChild(buildCard(p,order++));count++;}row.setAttribute('data-selfles-related-count',String(count));if(row.parentNode)row.parentNode.setAttribute('data-selfles-related-count',String(count));document.documentElement.setAttribute('data-selfles-related-ready','1');}
  function schedule(){clearTimeout(schedule.timer);schedule.timer=setTimeout(apply,120);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
  window.addEventListener('load',function(){schedule();setTimeout(schedule,700);setTimeout(schedule,1800);});
  window.addEventListener('selfles:products-manifest-ready',schedule);
  window.addEventListener('selfles:live-products-ready',schedule);
  if('MutationObserver'in window)new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['data-selfles-related-count','data-selfles-related-ready']});
}());
</script>
