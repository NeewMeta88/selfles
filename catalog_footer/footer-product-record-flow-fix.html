<style>
body.selfles-product-page #rec2310894021,
#rec2310894021.selfles-product-flow-fixed,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed,
body.selfles-product-page .r.t-rec:has(.t-store__product-snippet),
body.selfles-product-page .r.t-rec:has(.js-store-product.js-product) {
  display: flow-root !important;
  width: 100% !important;
  max-width: none !important;
  height: auto !important;
  min-height: 0 !important;
  overflow: visible !important;
  position: relative !important;
  left: 0 !important;
  right: auto !important;
  transform: none !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  z-index: 2 !important;
  box-sizing: border-box !important;
}

body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .t-store,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .t-store__prod-snippet__container,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .t-store__product-snippet,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .selfles-product-fluid-container,
body.selfles-product-page #rec2310894021 .t-store,
body.selfles-product-page #rec2310894021 .t-store__prod-snippet__container,
body.selfles-product-page #rec2310894021 .t-store__product-snippet,
body.selfles-product-page #rec2310894021 .selfles-product-fluid-container {
  width: 100% !important;
  max-width: none !important;
  height: auto !important;
  overflow: visible !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  box-sizing: border-box !important;
}

body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .t-store::after,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .t-store__prod-snippet__container::after,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .t-store__product-snippet::after,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .selfles-product-fluid-container::after,
body.selfles-product-page .r.t-rec.selfles-product-flow-fixed .selfles-product-main-layout::after {
  content: "" !important;
  display: table !important;
  clear: both !important;
}

body.selfles-product-page #t-footer {
  clear: both !important;
  position: relative !important;
  z-index: 1 !important;
}

@media screen and (max-width: 960px) {
  html body.selfles-product-page .selfles-buy-zone > .t-store__prod-popup__btn-wrapper.t-store__prod-popup__btn-wrapper-fixed,
  html body.selfles-product-page .selfles-buy-zone > .t-store__prod__btn-wrapper.t-store__prod-popup__btn-wrapper-fixed,
  html body.selfles-product-page .selfles-buy-zone > .js-store-prod-popup-buy-btn-wrapper.t-store__prod-popup__btn-wrapper-fixed {
    position: static !important;
    inset: auto !important;
    left: auto !important;
    right: auto !important;
    top: auto !important;
    bottom: auto !important;
    z-index: auto !important;
    display: block !important;
    width: auto !important;
    max-width: none !important;
    height: auto !important;
    min-height: 0 !important;
    padding: 0 !important;
    margin: 12px 0 0 !important;
    transform: none !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  html body.selfles-product-page .selfles-buy-zone .selfles-product-buy-button-fixed {
    position: relative !important;
    inset: auto !important;
    left: auto !important;
    right: auto !important;
    top: auto !important;
    bottom: auto !important;
    transform: none !important;
  }

  html body.selfles-product-page .selfles-buy-zone {
    padding-bottom: 0 !important;
  }
}
</style>
<script>
(function () {
  var INIT_ATTR = 'data-selfles-product-record-flow-fix';
  var FALLBACK_RECORD_ID = 'rec2310894021';
  var DONOR_ID = 'rec2417486561';
  var MIN_SAFE_HEIGHT = 320;
  var MAX_SAFE_HEIGHT = 3200;

  if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
  document.documentElement.setAttribute(INIT_ATTR, '1');

  function all(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  function closest(node, selector) {
    if (!node || !node.closest) return null;
    return node.closest(selector);
  }

  function isProductPage() {
    var path = location.pathname.replace(/\/+$/, '');
    return path.indexOf('/tproduct/') !== -1 ||
      path.indexOf('/catalog/tproduct/') !== -1 ||
      path.indexOf('/product/') !== -1 ||
      document.body && document.body.classList.contains('selfles-product-page');
  }

  function isVisible(node) {
    var rect;
    var style;

    if (!node || !node.getBoundingClientRect) return false;

    rect = node.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return false;

    style = window.getComputedStyle(node);
    return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) !== 0;
  }

  function isDonorNode(node) {
    return !!(node && closest(node, '#' + DONOR_ID));
  }

  function findProductRecord() {
    var fallback = document.getElementById(FALLBACK_RECORD_ID);
    var product;

    if (fallback && !isDonorNode(fallback) && fallback.querySelector('.js-store-product, .t-store__product-snippet, .selfles-product-main-layout')) {
      return fallback;
    }

    product = all('.t-store__product-snippet, .js-store-product.js-product, .selfles-product-main-layout')
      .filter(function (node) { return !isDonorNode(node) && !closest(node, '.t-store__card, .t706, .t-store__cart'); })[0];

    return product ? closest(product, '.r.t-rec') || product : null;
  }

  function contentNodes(root) {
    return all([
      '.t-store__prod-popup__slider',
      '.t-store__prod__slider',
      '.t-store__prod-snippet__gallery',
      '.js-store-prod-slider',
      '.t-slds',
      '.t-slds__thumbsbullet-wrapper',
      '.t-store__prod-popup__info',
      '.t-store__prod__info',
      '.t-store__prod-snippet__info',
      '.selfles-product-main-layout__gallery',
      '.selfles-product-main-layout__info',
      '.selfles-buy-zone',
      '.js-store-prod-text',
      '.t-store__product-snippet',
      '.js-store-error-msg'
    ].join(','), root);
  }

  function forceRecordFlow(node) {
    if (!node) return;

    node.style.setProperty('display', 'flow-root', 'important');
    node.style.setProperty('width', '100%', 'important');
    node.style.setProperty('max-width', 'none', 'important');
    node.style.setProperty('height', 'auto', 'important');
    node.style.setProperty('overflow', 'visible', 'important');
    node.style.setProperty('opacity', '1', 'important');
    node.style.setProperty('visibility', 'visible', 'important');
    node.style.setProperty('pointer-events', 'auto', 'important');
    node.style.setProperty('box-sizing', 'border-box', 'important');
  }

  function forceRecordPosition(root) {
    if (!root) return;

    root.style.setProperty('position', 'relative', 'important');
    root.style.setProperty('left', '0px', 'important');
    root.style.setProperty('right', 'auto', 'important');
    root.style.setProperty('transform', 'none', 'important');
    root.style.setProperty('margin-left', '0px', 'important');
    root.style.setProperty('margin-right', '0px', 'important');
    root.style.setProperty('z-index', '2', 'important');
  }

  function resetRunawayHeight(root) {
    if (!root) return;

    root.style.setProperty('height', 'auto', 'important');
    root.style.setProperty('min-height', '0px', 'important');
  }

  function measureProductHeight(root) {
    var rootTop = root.getBoundingClientRect().top;
    var minTop = null;
    var maxBottom = null;

    contentNodes(root).forEach(function (node) {
      var rect;

      if (!isVisible(node)) return;

      rect = node.getBoundingClientRect();
      minTop = minTop === null ? rect.top : Math.min(minTop, rect.top);
      maxBottom = maxBottom === null ? rect.bottom : Math.max(maxBottom, rect.bottom);
    });

    if (minTop === null || maxBottom === null) return 0;

    return Math.ceil(maxBottom - Math.min(rootTop, minTop) + 32);
  }

  function clampHeight(height) {
    if (!height || height < MIN_SAFE_HEIGHT) return 0;
    return Math.min(height, MAX_SAFE_HEIGHT);
  }

  function resetMobileBuyButton(root) {
    if (!root || window.innerWidth > 960) return;

    all([
      '.selfles-buy-zone > .t-store__prod-popup__btn-wrapper-fixed',
      '.selfles-buy-zone > .t-store__prod-popup__btn-wrapper',
      '.selfles-buy-zone > .t-store__prod__btn-wrapper',
      '.selfles-buy-zone > .js-store-prod-popup-buy-btn-wrapper'
    ].join(','), root).forEach(function (node) {
      node.style.setProperty('position', 'static', 'important');
      node.style.setProperty('inset', 'auto', 'important');
      node.style.setProperty('left', 'auto', 'important');
      node.style.setProperty('right', 'auto', 'important');
      node.style.setProperty('top', 'auto', 'important');
      node.style.setProperty('bottom', 'auto', 'important');
      node.style.setProperty('z-index', 'auto', 'important');
      node.style.setProperty('display', 'block', 'important');
      node.style.setProperty('width', 'auto', 'important');
      node.style.setProperty('max-width', 'none', 'important');
      node.style.setProperty('height', 'auto', 'important');
      node.style.setProperty('min-height', '0px', 'important');
      node.style.setProperty('padding', '0px', 'important');
      node.style.setProperty('margin', '12px 0px 0px', 'important');
      node.style.setProperty('transform', 'none', 'important');
      node.style.setProperty('background', 'transparent', 'important');
      node.style.setProperty('box-shadow', 'none', 'important');
    });

    all([
      '.selfles-buy-zone .selfles-product-buy-button-fixed',
      '.selfles-buy-zone .t-store__prod-popup__btn',
      '.selfles-buy-zone .t-store__prod__btn',
      '.selfles-buy-zone .js-store-prod-popup-buy-btn'
    ].join(','), root).forEach(function (node) {
      node.style.setProperty('position', 'relative', 'important');
      node.style.setProperty('inset', 'auto', 'important');
      node.style.setProperty('left', 'auto', 'important');
      node.style.setProperty('right', 'auto', 'important');
      node.style.setProperty('top', 'auto', 'important');
      node.style.setProperty('bottom', 'auto', 'important');
      node.style.setProperty('transform', 'none', 'important');
    });
  }

  function applyProductRecordFlowFix() {
    var root;
    var product;
    var height;
    var footer;

    if (!isProductPage()) return;

    root = findProductRecord();
    if (!root) return;

    product = root.querySelector('.js-store-product, .t-store__product-snippet, .selfles-product-main-layout');
    if (!product) return;

    root.classList.add('selfles-product-flow-fixed');
    if (document.body) document.body.classList.add('selfles-product-page');

    forceRecordPosition(root);
    resetMobileBuyButton(root);

    [
      root,
      root.querySelector('.t-store'),
      root.querySelector('.t-store__prod-snippet__container'),
      root.querySelector('.t-store__product-snippet'),
      root.querySelector('.selfles-product-fluid-container')
    ].forEach(forceRecordFlow);

    resetRunawayHeight(root);
    height = clampHeight(measureProductHeight(root));

    if (height) {
      root.style.setProperty('min-height', height + 'px', 'important');
    } else {
      root.style.setProperty('min-height', '0px', 'important');
    }

    footer = document.getElementById('t-footer');
    if (footer) {
      footer.style.setProperty('clear', 'both', 'important');
    }
  }

  function scheduleApply() {
    clearTimeout(scheduleApply.timer);
    scheduleApply.timer = setTimeout(applyProductRecordFlowFix, 80);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyProductRecordFlowFix);
  } else {
    applyProductRecordFlowFix();
  }

  window.addEventListener('load', function () {
    applyProductRecordFlowFix();
    [120, 300, 700, 1300, 2500].forEach(function (delay) {
      setTimeout(applyProductRecordFlowFix, delay);
    });
  });

  window.addEventListener('resize', scheduleApply);
  window.addEventListener('orientationchange', scheduleApply);
  window.addEventListener('selfles:products-manifest-ready', scheduleApply);
  window.addEventListener('selfles:live-products-ready', scheduleApply);

  if ('MutationObserver' in window && document.documentElement) {
    new MutationObserver(scheduleApply).observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['class', 'style', 'data-product-url', 'data-product-inv']
    });
  }
}());
</script>
