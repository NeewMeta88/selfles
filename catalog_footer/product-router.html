<script>
    (function () {
        var INIT_ATTR = 'data-selfles-product-router-v1';
        var BACK_URL_KEY = 'selflesProductBackUrl';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        var lastNavUrl = '';
        var lastNavAt = 0;
        var applyTimer = null;

        function all(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function findOne(selectors, root) {
            var list = Array.isArray(selectors) ? selectors : [selectors];
            var i;
            var found;

            for (i = 0; i < list.length; i += 1) {
                found = (root || document).querySelector(list[i]);
                if (found) return found;
            }

            return null;
        }

        function closest(node, selector) {
            if (!node || !node.closest) return null;
            return node.closest(selector);
        }

        function getPath(value) {
            var url;

            try {
                url = new URL(value || location.href, location.href);
            } catch (e) {
                return '';
            }

            return url.pathname.replace(/\/+$/, '') || '/';
        }

        function normalizeProductUrl(value) {
            var url;
            var path;

            if (!value) return '';

            try {
                url = new URL(value, location.href);
            } catch (e) {
                return '';
            }

            if (url.origin !== location.origin) return '';

            path = url.pathname.replace(/\/+$/, '');

            /*
              Важно: рабочий канонический путь товара сейчас /tproduct/...
              /catalog/tproduct/... оставляем только как входящий алиас,
              но для переходов всегда возвращаем /tproduct/...
            */
            if (path.indexOf('/catalog/tproduct/') !== -1) {
                return path.replace('/catalog/tproduct/', '/tproduct/') + url.search + url.hash;
            }

            if (path.indexOf('/tproduct/') !== -1) {
                return path + url.search + url.hash;
            }

            if (path.indexOf('/product/') !== -1) {
                return path + url.search + url.hash;
            }

            return '';
        }

        try {
            window.selflesNormalizeProductUrl = normalizeProductUrl;
        } catch (e) {}

        function isProductUrl(value) {
            return !!normalizeProductUrl(value);
        }

        function isProductPage() {
            return isProductUrl(location.href);
        }

        function normalizeBackUrl(value) {
            var url;
            var path;

            if (!value) return '';

            try {
                url = new URL(value, location.href);
            } catch (e) {
                return '';
            }

            if (url.origin !== location.origin) return '';
            if (isProductUrl(url.href)) return '';

            path = url.pathname.replace(/\/+$/, '') || '/';

            if (path === '/page136595006.html') return '/catalog';

            /*
              Главная у тебя сейчас может быть / или /page94832776.html.
              Оставляем оба варианта, чтобы товар возвращал пользователя туда,
              откуда он реально пришёл.
            */
            return path + url.search + url.hash;
        }

        function rememberBackUrl(value) {
            var backUrl = normalizeBackUrl(value);

            if (!backUrl) return;

            try {
                sessionStorage.setItem(BACK_URL_KEY, backUrl);
            } catch (e) {}
        }

        function getBackUrl() {
            var stored = '';

            try {
                stored = normalizeBackUrl(sessionStorage.getItem(BACK_URL_KEY));
            } catch (e) {}

            return stored || normalizeBackUrl(document.referrer) || '/catalog';
        }

        function isIgnoredClickTarget(target) {
            return !!closest(target, [
                '.t-store__prod-popup__btn',
                '.t-store__prod__btn',
                '.js-store-prod-popup-buy-btn',
                '.t-store__cart',
                '.t706',
                '.t706__cartwin',
                '.t-store__prod__quantity',
                '.t-store__prod-popup__quantity',
                '.t-store__prod-popup__quantity-wrapper',
                '.js-store-prod-quantity',
                '.selfles-product-options',
                '.t-product__option',
                '.t-store__filter',
                '.t-store__parts-switch-btn',
                '.t-store__pagination',
                '.js-store-load-more-btn',
                '.t-store__load-more-btn',
                '.selfles-home-store-arrow',
                '.selfles-catalog-slider-arrow'
            ].join(','));
        }

        function getProductUrlFromNode(node) {
            var link;
            var card;
            var url;

            if (!node) return '';

            link = closest(node, 'a[href]');
            if (link) {
                url = normalizeProductUrl(link.getAttribute('href') || link.href);
                if (url) return url;
            }

            card = closest(node, [
                '.js-product.t-store__card',
                '.t-store__card',
                '.js-store-product.js-product',
                '.t-store__product-popup',
                '.t-store__prod-popup',
                '[data-product-url]'
            ].join(','));

            if (!card) return '';

            url = normalizeProductUrl(card.getAttribute('data-product-url'));
            if (url) return url;

            link = card.querySelector('a[href*="/tproduct/"], a[href*="/catalog/tproduct/"], a[href*="/product/"]');
            if (link) {
                url = normalizeProductUrl(link.getAttribute('href') || link.href);
                if (url) return url;
            }

            return '';
        }

        function isCardClickTarget(target) {
            var card;

            if (!target) return false;
            if (isIgnoredClickTarget(target)) return false;

            if (
                isProductPage() &&
                closest(target, [
                    '.t-store__product-snippet',
                    '.js-store-product.js-product',
                    '.t-store__prod-popup',
                    '.t-store__product-popup'
                ].join(',')) &&
                !closest(target, '.selfles-related-card')
            ) {
                return false;
            }

            card = closest(target, [
                '.js-product.t-store__card',
                '.t-store__card',
                '.selfles-related-card',
                '[data-selfles-catalog-card]',
                '[data-product-url]'
            ].join(','));

            if (!card) return false;

            if (closest(target, '.t-store__prod-popup, .t-store__product-popup, .t-popup, .t-store__cart, .t706')) {
                return !!closest(target, '.selfles-related-card');
            }

            return true;
        }

        function forceNavigate(url, replace) {
            var now = Date.now();

            url = normalizeProductUrl(url);
            if (!url) return false;

            if (getPath(location.href) === getPath(url)) return false;

            if (lastNavUrl === url && now - lastNavAt < 1500) {
                return true;
            }

            lastNavUrl = url;
            lastNavAt = now;

            try {
                document.documentElement.classList.add('selfles-product-navigation-pending');
            } catch (e) {}

            if (replace) {
                location.replace(url);
            } else {
                location.assign(url);
            }

            return true;
        }

        function handleProductOpen(event) {
            var url;

            if (!event || !event.target) return;

            if (
                event.type === 'click' ||
                event.type === 'mousedown' ||
                event.type === 'pointerdown'
            ) {
                if (event.button && event.button !== 0) return;
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            }

            if (!isCardClickTarget(event.target)) return;

            url = getProductUrlFromNode(event.target);
            if (!url) return;

            rememberBackUrl(location.href);

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            forceNavigate(url, false);
        }

        function hasProductContext(node) {
            if (isProductPage()) return true;

            return !!closest(node, [
                '.t-store__product-popup',
                '.t-store__prod-popup',
                '.selfles-product-main-layout',
                '.t-popup_show .t-store__product-popup'
            ].join(','));
        }

        function handleProductClose(event) {
            var close;

            if (!event || !event.target || !event.target.closest) return;

            close = closest(event.target, [
                '.t-popup__close',
                '.t-store__prod-popup__close-txt-wr',
                '.t-store__prod-popup__close-txt',
                '.js-store-close-text',
                '[data-selfles-product-back]'
            ].join(','));

            if (!close) return;
            if (!hasProductContext(close)) return;

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            location.assign(getBackUrl());
        }

        function cleanSku(value) {
            return String(value || '')
                .replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i, '')
                .trim()
                .toUpperCase();
        }

        function findProductUrlBySku(sku) {
            var clean = cleanSku(sku);
            var products = window.SELFLES_PRODUCTS_BY_SKU || {};
            var product;

            if (!clean) return '';

            product = products[clean];
            if (product && product.url) {
                return normalizeProductUrl(product.url);
            }

            return '';
        }

        function findVisibleNativePopupProductUrl() {
            var popup = all('.t-popup_show .t-store__product-popup, .t-popup_show .t-store__prod-popup, .t-popup .t-store__product-popup')
                .filter(function (node) {
                    var rect;

                    if (!node) return false;
                    rect = node.getBoundingClientRect();

                    return rect.width > 0 &&
                        rect.height > 0 &&
                        window.getComputedStyle(node).display !== 'none' &&
                        window.getComputedStyle(node).visibility !== 'hidden';
                })[0];

            var skuNode;
            var url;

            if (!popup) return '';

            url = getProductUrlFromNode(popup);
            if (url) return url;

            skuNode = popup.querySelector('.js-product-sku, .js-store-prod-sku, .t-store__prod-popup__sku, .t-store__prod__sku');
            if (skuNode) {
                url = findProductUrlBySku(skuNode.textContent);
                if (url) return url;
            }

            return '';
        }

        function redirectOpenedNativePopup() {
            var url;

            if (isProductPage()) return;

            url = findVisibleNativePopupProductUrl();
            if (!url) return;

            rememberBackUrl(location.href);
            forceNavigate(url, true);
        }

        function markFluidContainer(info, gallery) {
            var container;

            container = closest(info, '.t-container, .t-container_fluid, .t-store__prod-popup__container, .t-store__prod-snippet__container') ||
                closest(gallery, '.t-container, .t-container_fluid, .t-store__prod-popup__container, .t-store__prod-snippet__container');

            if (!container) return;

            container.classList.add('selfles-product-fluid-container');

            if (container.classList.contains('t-container')) {
                container.classList.remove('t-container');
                container.classList.add('t-container_fluid');
            }
        }

        function closestCommonParent(a, b) {
            var node = a;

            while (node && node !== document) {
                if (node.contains(b)) return node;
                node = node.parentNode;
            }

            return null;
        }

        function hideProductMeta(root) {
            all([
                '.t-store__prod-popup__sku',
                '.t-store__prod__sku',
                '.js-product-sku',
                '.js-store-prod-sku',
                '.t-store__prod-popup__properties',
                '.t-store__prod__properties',
                '.t-store__prod-popup__charcs',
                '.t-store__prod__charcs',
                '.js-store-prod-all-charcs',
                '.js-store-prod-dimensions',
                '.js-store-prod-weight'
            ].join(','), root).forEach(function (node) {
                node.style.setProperty('display', 'none', 'important');
            });
        }

        function fixCurrencyText(root) {
            all([
                '.t-store__prod-popup__price-currency',
                '.t-store__prod__price-currency'
            ].join(','), root).forEach(function (node) {
                node.textContent = '₽';
            });
        }

        function setButtonText(button) {
            var label;
            var value;

            if (!button) return;

            label = button.querySelector('.t-btnflex__text, .t-btn__text, span, div');
            value = (label || button).textContent || '';

            if (
                !value.trim() ||
                /_?buy\s*now_?/i.test(value) ||
                /add\s*to\s*cart/i.test(value) ||
                /купить/i.test(value)
            ) {
                (label || button).textContent = 'в корзину';
            }
        }

        function styleButtons(root) {
            all([
                '.t-store__prod-popup__btn',
                '.t-store__prod__btn',
                '.js-store-prod-popup-buy-btn',
                '.t-store__prod-popup__btn-wrapper .t-btn',
                '.t-store__prod__btn-wrapper .t-btn',
                '.js-store-prod-popup-buy-btn-wrapper .t-btn'
            ].join(','), root || document).forEach(function (button) {
                if (closest(button, '.t706, .t-store__cart')) return;
                setButtonText(button);
                button.classList.add('selfles-product-buy-button-fixed');
                button.style.setProperty('background-color', '#EE413C', 'important');
                button.style.setProperty('background', '#EE413C', 'important');
                button.style.setProperty('border-color', '#EE413C', 'important');
                button.style.setProperty('color', '#fff', 'important');
                button.style.setProperty('border-radius', '80px', 'important');
            });
        }

        function createFallbackQuantity(info) {
            var product = closest(info, '.js-store-product, .js-product, .t-store__product-snippet, .t-store__prod-popup');
            var rawMax = product ? String(product.getAttribute('data-product-inv') || '').trim() : '';
            var max = Number(rawMax.replace(',', '.'));

            if (!isFinite(max) || max < 1) max = 99;
            max = Math.floor(max);

            var quantity = document.createElement('div');
            quantity.className = 't-store__prod__quantity selfles-product-quantity-created';
            quantity.style.borderRadius = '5px';

            quantity.innerHTML = ''
                + '<div class="t-store__prod__quantity__minus-wrapper">'
                + '<span class="t-store__prod__quantity__minus"></span>'
                + '</div>'
                + '<input class="t-store__prod__quantity-input t-descr t-descr_xxs" type="number" min="1" max="' + max + '" step="1" value="1" size="4" maxlength="4">'
                + '<div class="t-store__prod__quantity__plus-wrapper">'
                + '<span class="t-store__prod__quantity__plus"></span>'
                + '</div>';

            quantity.addEventListener('click', function (event) {
                var input = quantity.querySelector('.t-store__prod__quantity-input');
                var value;

                if (!input) return;

                value = Number(input.value || 1);
                if (!isFinite(value) || value < 1) value = 1;

                if (event.target.closest('.t-store__prod__quantity__minus-wrapper')) {
                    value = Math.max(1, value - 1);
                } else if (event.target.closest('.t-store__prod__quantity__plus-wrapper')) {
                    value = Math.min(max, value + 1);
                } else {
                    return;
                }

                input.value = String(value);
                input.dispatchEvent(new Event('input', {bubbles: true}));
                input.dispatchEvent(new Event('change', {bubbles: true}));
            });

            return quantity;
        }

        function fixBuyZone(info) {
            var quantity;
            var price;
            var buttonWrapper;
            var button;
            var nodes = [];
            var outerNodes;
            var zone;
            var first;

            if (!info) return;

            buttonWrapper = findOne([
                '.t-store__prod-popup__btn-wrapper',
                '.t-store__prod__btn-wrapper',
                '.js-store-prod-popup-buy-btn-wrapper',
                '.js-store-buttons-wrapper'
            ], info);

            quantity = findOne([
                '.t-store__prod__quantity',
                '.t-store__prod-popup__quantity',
                '.t-store__prod-popup__quantity-wrapper',
                '.js-store-prod-quantity'
            ], info);

            if (!quantity && buttonWrapper) {
                quantity = findOne([
                    '.t-store__prod__quantity',
                    '.t-store__prod-popup__quantity',
                    '.t-store__prod-popup__quantity-wrapper',
                    '.js-store-prod-quantity'
                ], buttonWrapper);
            }

            price = findOne([
                '.js-store-price-wrapper',
                '.t-store__prod-popup__price-wrapper',
                '.t-store__prod__price-wrapper'
            ], info);

            if (!quantity && price && buttonWrapper) {
                quantity = createFallbackQuantity(info);
            }

            [quantity, price, buttonWrapper].forEach(function (node) {
                if (!node) return;
                if (nodes.indexOf(node) !== -1) return;
                if (closest(node, '.t-store__cart, .t706')) return;
                nodes.push(node);
            });

            if (!nodes.length) return;

            zone = info.querySelector('.selfles-buy-zone');

            if (!zone) {
                zone = document.createElement('div');
                zone.className = 'selfles-buy-zone';

                outerNodes = nodes.filter(function (node) {
                    return !nodes.some(function (other) {
                        return other !== node && other.contains && other.contains(node);
                    });
                });

                outerNodes.sort(function (a, b) {
                    if (a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_PRECEDING) return 1;
                    return -1;
                });

                first = outerNodes[0] || nodes[0];

                if (first && first.parentNode) {
                    first.parentNode.insertBefore(zone, first);
                } else {
                    info.appendChild(zone);
                }
            }

            if (quantity) zone.appendChild(quantity);
            if (price) zone.appendChild(price);
            if (buttonWrapper) {
                zone.appendChild(buttonWrapper);

                buttonWrapper.style.setProperty('opacity', '1', 'important');
                buttonWrapper.style.setProperty('visibility', 'visible', 'important');
                buttonWrapper.style.setProperty('display', 'block', 'important');
                buttonWrapper.style.setProperty('pointer-events', 'auto', 'important');

                button = buttonWrapper.querySelector('.t-store__prod-popup__btn, .t-store__prod__btn, .js-store-prod-popup-buy-btn, .t-btn');

                if (button) {
                    button.style.setProperty('opacity', '1', 'important');
                    button.style.setProperty('visibility', 'visible', 'important');
                    button.style.setProperty('display', 'flex', 'important');
                    button.style.setProperty('pointer-events', 'auto', 'important');
                }
            }
        }

        function moveProductDescriptionBeforeBuyZone(info) {
            var description;
            var buyZone;

            if (!info) return;

            description = findOne([
                '.js-store-prod-text.t-store__prod-popup__text',
                '.js-store-prod-text',
                '.t-store__prod-popup__text',
                '.t-store__prod__text'
            ], info);

            buyZone = info.querySelector('.selfles-buy-zone');

            if (!description || !buyZone || !buyZone.parentNode) return;
            if (description === buyZone.previousElementSibling) return;
            if (closest(description, '.t-store__cart, .t706')) return;

            buyZone.parentNode.insertBefore(description, buyZone);
        }

        function getImageUrlFromNode(node) {
            var value;

            if (!node) return '';

            value = node.getAttribute('data-original') ||
                node.getAttribute('data-img-zoom-url') ||
                node.getAttribute('data-lazy-rule') ||
                node.getAttribute('data-product-img') ||
                node.getAttribute('content') ||
                '';

            if (!value && node.style && node.style.backgroundImage) {
                value = node.style.backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
            }

            return value;
        }

        function getProductFallbackImage(root) {
            var node;

            node = findOne([
                '.t-slds__item_active .t-slds__bgimg',
                '.t-slds__bgimg.js-product-img',
                '.t-slds__bgimg',
                '[data-product-img]',
                'meta[itemprop="image"][content]',
                'meta[property="og:image"][content]'
            ], root);

            return getImageUrlFromNode(node);
        }

        function currentProductUid(root) {
            var value = '';
            var meta;
            var match;

            if (root && root.getAttribute) {
                value = root.getAttribute('data-product-lid') ||
                    root.getAttribute('data-product-uid') ||
                    root.getAttribute('data-product-gen-uid') ||
                    '';
            }

            if (!value && root && root.querySelector) {
                meta = root.querySelector('meta[itemprop="productID"][content]');
                value = meta ? meta.getAttribute('content') : '';
            }

            if (!value) {
                meta = document.querySelector('meta[itemprop="productID"][content]');
                value = meta ? meta.getAttribute('content') : '';
            }

            if (!value) {
                match = String(location.pathname || '').match(/\/tproduct\/(\d+)-/);
                value = match ? match[1] : '';
            }

            return String(value || '').replace(/\D/g, '');
        }

        function uniqueImages(images) {
            var seen = {};
            var result = [];

            images.forEach(function (image) {
                image = String(image || '').replace(/\\\//g, '/').trim();

                if (!image || seen[image]) return;

                seen[image] = true;
                result.push(image);
            });

            return result;
        }

        function extractJsonArray(text, startIndex) {
            var start = text.indexOf('[', startIndex);
            var depth = 0;
            var inString = false;
            var escaped = false;
            var i;
            var ch;

            if (start === -1) return '';

            for (i = start; i < text.length; i += 1) {
                ch = text.charAt(i);

                if (inString) {
                    if (escaped) {
                        escaped = false;
                    } else if (ch === '\\') {
                        escaped = true;
                    } else if (ch === '"') {
                        inString = false;
                    }

                    continue;
                }

                if (ch === '"') {
                    inString = true;
                    continue;
                }

                if (ch === '[') depth += 1;
                if (ch === ']') {
                    depth -= 1;
                    if (depth === 0) return text.slice(start, i + 1);
                }
            }

            return '';
        }

        function galleryImagesFromScripts(uid) {
            var images = [];
            var uidRegexp;

            if (!uid) return images;

            uidRegexp = new RegExp('"uid"\\s*:\\s*"?'+ uid +'"?');

            all('script').some(function (script) {
                var text = script.textContent || '';
                var uidMatch;
                var galleryIndex;
                var rawArray;
                var parsed;

                if (text.indexOf('gallery') === -1 || text.indexOf(uid) === -1) return false;

                uidMatch = text.match(uidRegexp);
                if (!uidMatch) return false;

                galleryIndex = text.indexOf('"gallery"', uidMatch.index);
                if (galleryIndex === -1) return false;

                rawArray = extractJsonArray(text, galleryIndex);
                if (!rawArray) return false;

                try {
                    parsed = JSON.parse(rawArray);
                    images = parsed.map(function (item) {
                        return item && item.img;
                    }).filter(Boolean);
                } catch (e) {
                    images = [];
                }

                return images.length > 1;
            });

            return uniqueImages(images);
        }

        function collectProductGalleryImages(root) {
            var uid = currentProductUid(root);
            var images = galleryImagesFromScripts(uid);

            all([
                '.t-slds__items-wrapper .t-slds__bgimg',
                '.t-slds__item .t-slds__bgimg',
                '.js-product-img',
                '[data-product-img]',
                'meta[itemprop="image"][content]',
                'meta[property="og:image"][content]'
            ].join(','), root || document).forEach(function (node) {
                images.push(getImageUrlFromNode(node));
            });

            return uniqueImages(images);
        }

        function activateSliderImage(slider, image, index) {
            if (!slider || !image) return;

            all([
                '.t-slds__items-wrapper .t-slds__bgimg',
                '.t-slds__item .t-slds__bgimg',
                '.js-product-img'
            ].join(','), slider).forEach(function (img) {
                if (closest(img, '.t-slds__thumbsbullet-wrapper')) return;

                img.style.setProperty('background-image', 'url("' + image + '")', 'important');
                img.style.setProperty('background-size', 'cover', 'important');
                img.style.setProperty('background-position', 'center center', 'important');
                img.style.setProperty('opacity', '1', 'important');
                img.setAttribute('data-original', image);
                img.classList.add('loaded');
            });

            all('.t-slds__thumbsbullet, .t-slds__bullet', slider).forEach(function (bullet) {
                var active = String(bullet.getAttribute('data-slide-bullet-for') || '') === String(index + 1);

                bullet.classList.toggle('t-slds__bullet_active', active);
                bullet.classList.toggle('t-slds__thumbsbullet_active', active);
            });
        }

        function buildThumb(slider, image, index) {
            var bullet = document.createElement('div');
            var bg = document.createElement('div');
            var border = document.createElement('div');

            bullet.className = 't-slds__thumbsbullet t-slds__bullet' + (index === 0 ? ' t-slds__bullet_active t-slds__thumbsbullet_active' : '');
            bullet.setAttribute('data-slide-bullet-for', String(index + 1));
            bullet.setAttribute('role', 'button');
            bullet.setAttribute('tabindex', '0');

            bg.className = 't-slds__bgimg t-bgimg loaded';
            bg.setAttribute('data-original', image);
            bg.style.setProperty('padding-bottom', '100%', 'important');
            bg.style.setProperty('background-image', 'url("' + image + '")', 'important');
            bg.style.setProperty('background-size', 'cover', 'important');
            bg.style.setProperty('background-position', 'center center', 'important');
            bg.style.setProperty('opacity', '1', 'important');

            border.className = 't-slds__thumbsbullet-border';

            bullet.appendChild(bg);
            bullet.appendChild(border);

            bullet.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                activateSliderImage(slider, image, index);
            });

            bullet.addEventListener('keydown', function (event) {
                if (!event || (event.key !== 'Enter' && event.key !== ' ')) return;

                event.preventDefault();
                activateSliderImage(slider, image, index);
            });

            return bullet;
        }

        function ensureSliderThumbs(root) {
            var images = collectProductGalleryImages(root);

            if (images.length < 2) return;

            all([
                '.t-store__prod__slider',
                '.t-store__prod-popup__slider',
                '.t-store__prod-snippet__gallery',
                '.js-store-prod-slider'
            ].join(','), root).forEach(function (slider) {
                var wrapper = slider.querySelector('.t-slds__thumbsbullet-wrapper');
                var currentCount;

                if (!wrapper) {
                    wrapper = document.createElement('div');
                    wrapper.className = 't-slds__thumbsbullet-wrapper';
                    slider.appendChild(wrapper);
                }

                currentCount = Number(wrapper.getAttribute('data-selfles-built-thumbs-count') || 0);

                if (
                    wrapper.getAttribute('data-selfles-built-thumbs') === '1' &&
                    currentCount === images.length &&
                    wrapper.querySelectorAll('.t-slds__thumbsbullet').length === images.length
                ) {
                    return;
                }

                wrapper.innerHTML = '';
                wrapper.setAttribute('data-selfles-built-thumbs', '1');
                wrapper.setAttribute('data-selfles-built-thumbs-count', String(images.length));

                images.forEach(function (image, index) {
                    wrapper.appendChild(buildThumb(slider, image, index));
                });

                activateSliderImage(slider, images[0], 0);
            });
        }

        function repairProductMainImage(root) {
            var fallback = getProductFallbackImage(root);

            all([
                '.t-store__prod__slider .t-slds__bgimg',
                '.t-store__prod-popup__slider .t-slds__bgimg',
                '.t-store__prod-snippet__gallery .t-slds__bgimg'
            ].join(','), root).forEach(function (img) {
                var bg = getImageUrlFromNode(img) || fallback;

                if (!bg) return;

                img.style.setProperty('background-image', 'url("' + bg + '")', 'important');
                img.style.setProperty('background-size', 'cover', 'important');
                img.style.setProperty('background-position', 'center center', 'important');
                img.style.setProperty('opacity', '1', 'important');
            });

            all([
                '.t-store__prod__slider > .js-product-img',
                '.t-store__prod-popup__slider > .js-product-img',
                '.t-store__prod-snippet__gallery > .js-product-img',
                '.js-store-prod-slider > .js-product-img'
            ].join(','), root).forEach(function (img) {
                var bg = getImageUrlFromNode(img) || fallback;

                if (!bg) return;

                img.style.setProperty('background-image', 'url("' + bg + '")', 'important');
                img.style.setProperty('background-size', 'cover', 'important');
                img.style.setProperty('background-position', 'center center', 'important');
                img.style.setProperty('opacity', '1', 'important');
            });
        }

        function getRecordId(node) {
            var rec = closest(node, '.t-rec[id^="rec"]');
            var id = rec ? String(rec.id || '').replace(/^rec/, '') : '';

            return /^\d+$/.test(id) ? id : '';
        }

        function hydrateSliderImages(root) {
            all([
                '.t-store__prod__slider .t-slds__thumbsbullet-wrapper .t-bgimg',
                '.t-store__prod-popup__slider .t-slds__thumbsbullet-wrapper .t-bgimg',
                '.t-store__prod-snippet__gallery .t-slds__thumbsbullet-wrapper .t-bgimg',
                '.t-store__prod__slider .t-slds__thumbsbullet-wrapper .t-slds__bgimg',
                '.t-store__prod-popup__slider .t-slds__thumbsbullet-wrapper .t-slds__bgimg',
                '.t-store__prod-snippet__gallery .t-slds__thumbsbullet-wrapper .t-slds__bgimg'
            ].join(','), root).forEach(function (img) {
                var bg = getImageUrlFromNode(img);

                if (!bg) return;

                img.style.setProperty('background-image', 'url("' + bg + '")', 'important');
                img.style.setProperty('background-size', 'cover', 'important');
                img.style.setProperty('background-position', 'center center', 'important');
                img.style.setProperty('opacity', '1', 'important');
                img.classList.add('loaded');
            });
        }

        function refreshNativeSlider(slider) {
            var recid = getRecordId(slider);
            var now = Date.now();
            var last = Number(slider.getAttribute('data-selfles-slider-refresh-at') || 0);

            if (!recid || now - last < 350) return;

            slider.setAttribute('data-selfles-slider-refresh-at', String(now));

            try {
                if (typeof window.t_sldsInit === 'function') {
                    window.t_sldsInit(recid);
                }
            } catch (e) {}

            try {
                if (typeof window.t_lazyload_update === 'function') {
                    window.t_lazyload_update();
                }
            } catch (e) {}
        }

        function updateSlider(root) {
            all([
                '.t-store__prod__slider',
                '.t-store__prod-popup__slider',
                '.t-store__prod-snippet__gallery',
                '.js-store-prod-slider'
            ].join(','), root).forEach(function (slider) {
                refreshNativeSlider(slider);
            });

            ensureSliderThumbs(root);

            all([
                '.t-store__prod__slider .t-slds__thumbsbullet-wrapper',
                '.t-store__prod-popup__slider .t-slds__thumbsbullet-wrapper',
                '.t-store__prod-snippet__gallery .t-slds__thumbsbullet-wrapper',
                '.js-store-prod-slider .t-slds__thumbsbullet-wrapper'
            ].join(','), root).forEach(function (node) {
                node.style.setProperty('display', 'flex', 'important');
                node.style.setProperty('visibility', 'visible', 'important');
                node.style.setProperty('opacity', '1', 'important');
            });

            hydrateSliderImages(root);
            repairProductMainImage(root);
        }

        function getProductRoots() {
            var roots = [];

            all([
                '.t-store__product-popup',
                '.t-store__prod-popup',
                '.t-store__product-snippet',
                '.js-store-product.js-product'
            ].join(',')).forEach(function (root) {
                if (roots.indexOf(root) !== -1) return;
                if (closest(root, '.t-store__card') && !root.querySelector('.t-store__prod-popup__info, .t-store__prod__info')) return;
                roots.push(root);
            });

            return roots;
        }

        function moveProductTabs(root, info) {
            var tabs;

            if (!root || !info) return;

            tabs = findOne([
                '.js-store-tabs.t-store__tabs',
                '.t-store__tabs'
            ], root);

            if (!tabs) return;
            if (closest(tabs, '.selfles-product-main-layout__info') === info) return;

            tabs.classList.add('selfles-product-details-tabs');
            info.appendChild(tabs);
        }

        function createTabsCloseIcon() {
            var close = document.createElement('div');

            close.className = 't-store__tabs__close';
            close.innerHTML = ''
                + '<svg class="t-store__tabs__close-icon" width="24px" height="24px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">'
                + '<g stroke="none" stroke-width="1px" fill="none" fill-rule="evenodd" stroke-linecap="square">'
                + '<g transform="translate(1.000000, 1.000000)" stroke="#EE413C">'
                + '<path d="M0,11 L22,11"></path>'
                + '<path d="M11,0 L11,22"></path>'
                + '</g>'
                + '</g>'
                + '</svg>';

            return close;
        }

        function repairProductTabs(root) {
            all('.selfles-product-main-layout__info .t-store__tabs__item', root || document).forEach(function (item) {
                var button = item.querySelector('.t-store__tabs__item-button, .js-store-tab-button');
                var title = item.querySelector('.t-store__tabs__item-title, .t-store__tabs__button-title');
                var content = item.querySelector('.t-store__tabs__content');
                var titleText = title ? title.textContent.trim() : '';
                var closeIcons;

                if (!button || !content) return;

                if (titleText) {
                    item.setAttribute('data-tab-title', titleText);
                    button.setAttribute('data-tab-title', titleText);
                }

                closeIcons = all('.t-store__tabs__close', button);

                if (!closeIcons.length) {
                    button.appendChild(createTabsCloseIcon());
                    closeIcons = all('.t-store__tabs__close', button);
                }

                closeIcons.forEach(function (close, index) {
                    if (index > 0) {
                        close.remove();
                        return;
                    }

                    close.style.setProperty('display', 'flex', 'important');

                    all('svg g', close).forEach(function (group) {
                        group.setAttribute('stroke', '#EE413C');
                    });
                });

                button.setAttribute('role', 'button');
                button.setAttribute('tabindex', '0');
            });
        }

        function normalizeProductTabs(root) {
            all('.selfles-product-main-layout__info .t-store__tabs', root || document).forEach(function (tabs) {
                var items;

                if (tabs.getAttribute('data-selfles-tabs-user-touched') === '1') return;

                items = all('.t-store__tabs__item', tabs);

                items.forEach(function (item, index) {
                    var button = item.querySelector('.t-store__tabs__item-button, .js-store-tab-button');
                    var content = item.querySelector('.t-store__tabs__content');
                    var isActive = index === 0;

                    item.classList.toggle('t-store__tabs__item_active', isActive);

                    if (button) {
                        button.classList.toggle('t-store__tabs__item-button_active', isActive);
                    }

                    if (content) {
                        content.style.setProperty('display', isActive ? 'block' : 'none', 'important');
                    }
                });
            });
        }

        function toggleProductTab(button) {
            var item = closest(button, '.t-store__tabs__item');
            var tabs = closest(button, '.t-store__tabs');
            var content;

            if (!item || !tabs) return;

            content = item.querySelector('.t-store__tabs__content');

            if (item.classList.contains('t-store__tabs__item_active')) {
                item.classList.remove('t-store__tabs__item_active');
                button.classList.remove('t-store__tabs__item-button_active');
                if (content) content.style.setProperty('display', 'none', 'important');
                return;
            }

            all('.t-store__tabs__item', tabs).forEach(function (other) {
                var otherButton = other.querySelector('.t-store__tabs__item-button, .js-store-tab-button');
                var otherContent = other.querySelector('.t-store__tabs__content');

                other.classList.remove('t-store__tabs__item_active');
                if (otherButton) otherButton.classList.remove('t-store__tabs__item-button_active');
                if (otherContent) otherContent.style.setProperty('display', 'none', 'important');
            });

            item.classList.add('t-store__tabs__item_active');
            button.classList.add('t-store__tabs__item-button_active');
            if (content) content.style.setProperty('display', 'block', 'important');
        }

        function handleProductTabClick(event) {
            var button;

            if (!event || !event.target) return;

            button = closest(event.target, '.selfles-product-main-layout__info .t-store__tabs__item-button.js-store-tab-button');

            if (!button) return;

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            var tabs = closest(button, '.t-store__tabs');
            if (tabs) tabs.setAttribute('data-selfles-tabs-user-touched', '1');

            toggleProductTab(button);
        }

        function fixProductRoot(root) {
            var info;
            var gallery;
            var parent;

            if (!root) return;
            if (closest(root, '.t-store__cart, .t706')) return;

            info = findOne([
                '.t-store__prod__info',
                '.t-store__prod-popup__info',
                '.t-store__prod-snippet__info'
            ], root);

            gallery = findOne([
                '.t-store__prod__slider',
                '.t-store__prod-popup__slider',
                '.t-store__prod-snippet__gallery',
                '.js-store-prod-slider'
            ], root);

            if (!info || !gallery) return;

            if (document.body) {
                document.body.classList.add('selfles-product-page');
            }

            markFluidContainer(info, gallery);

            parent = closestCommonParent(info, gallery) || root;
            parent.classList.add('selfles-product-main-layout');
            gallery.classList.add('selfles-product-main-layout__gallery');
            info.classList.add('selfles-product-main-layout__info');

            fixBuyZone(info);
            moveProductDescriptionBeforeBuyZone(info);
            fixCurrencyText(info);
            hideProductMeta(info);
            updateSlider(parent);
            moveProductTabs(root, info);
            repairProductTabs(root);
            normalizeProductTabs(root);
        }

        function repairProductLinks(root) {
            all([
                '.js-product.t-store__card',
                '.t-store__card',
                '.selfles-related-card',
                '[data-product-url]'
            ].join(','), root || document).forEach(function (card) {
                var url = normalizeProductUrl(card.getAttribute('data-product-url'));
                var link;

                if (!url) {
                    link = card.querySelector('a[href*="/tproduct/"], a[href*="/catalog/tproduct/"], a[href*="/product/"]');
                    if (link) url = normalizeProductUrl(link.getAttribute('href') || link.href);
                }

                if (!url) return;

                card.setAttribute('data-product-url', url);

                all('a[href]', card).forEach(function (a) {
                    if (closest(a, [
                        '.t-store__prod-popup__btn',
                        '.t-store__prod__btn',
                        '.js-store-prod-popup-buy-btn',
                        '.selfles-product-buy-button-fixed'
                    ].join(','))) {
                        return;
                    }

                    if (!normalizeProductUrl(a.getAttribute('href') || a.href)) return;

                    a.setAttribute('href', url);
                    a.removeAttribute('target');
                });
            });
        }

        function applyFixes() {
            renameCatalogLoadMore();
            repairProductLinks(document);
            getProductRoots().forEach(fixProductRoot);
            styleButtons(document);
            redirectOpenedNativePopup();
        }

        function scheduleApplyFixes() {
            clearTimeout(applyTimer);
            applyTimer = setTimeout(applyFixes, 50);
        }

        function scheduleProductGalleryFixes() {
            if (!isProductPage()) return;

            [80, 180, 360, 700, 1200, 2200, 4000].forEach(function (delay) {
                setTimeout(applyFixes, delay);
            });
        }

        function getPageAlias() {
            var allrecords = document.querySelector('#allrecords');
            return allrecords ? String(allrecords.getAttribute('data-tilda-page-alias') || '') : '';
        }

        function isCatalogPage() {
            return getPath(location.href) === '/catalog' || getPageAlias() === 'catalog';
        }

        function renameCatalogLoadMore() {
            if (!isCatalogPage()) return;

            all('.js-store-load-more-btn-text').forEach(function (node) {
                if (/load\s*more/i.test(node.textContent || '')) {
                    node.textContent = 'ещё';
                }
            });

            all('template[id^="button_loadmore_"]').forEach(function (tpl) {
                if (tpl.innerHTML && /Load\s*more/i.test(tpl.innerHTML)) {
                    tpl.innerHTML = tpl.innerHTML.replace(/Load\s*more/gi, 'ещё');
                }
            });
        }

        ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(function (eventName) {
            window.addEventListener(eventName, handleProductOpen, true);
            document.addEventListener(eventName, handleProductOpen, true);
        });

        function handleBuyButtonDefault(event) {
            var button;

            if (!event || !event.target) return;

            button = closest(event.target, [
                '.selfles-buy-zone .t-store__prod-popup__btn',
                '.selfles-buy-zone .t-store__prod__btn',
                '.selfles-buy-zone .js-store-prod-popup-buy-btn',
                '.selfles-buy-zone .selfles-product-buy-button-fixed'
            ].join(','));

            if (!button) return;
            if (!isProductPage()) return;

            /*
              Не стопаем событие, чтобы родной обработчик Тильды успел добавить товар в корзину.
              Только запрещаем браузеру перейти по href, если Тильда не сделала preventDefault сама.
            */
            event.preventDefault();
        }

        window.addEventListener('click', handleProductClose, true);
        document.addEventListener('click', handleProductClose, true);
        document.addEventListener('click', handleProductTabClick, true);
        document.addEventListener('click', handleBuyButtonDefault, false);
        document.addEventListener('keydown', function (event) {
            var button;

            if (!event || (event.key !== 'Enter' && event.key !== ' ')) return;

            button = closest(event.target, '.selfles-product-main-layout__info .t-store__tabs__item-button.js-store-tab-button');

            if (!button) return;

            event.preventDefault();
            toggleProductTab(button);
        }, true);

        if (!document.getElementById('selfles-product-router-v1-style')) {
            var style = document.createElement('style');
            style.id = 'selfles-product-router-v1-style';
            style.textContent = ''
                + 'html.selfles-product-navigation-pending .t-popup_show .t-store__product-popup,'
                + 'html.selfles-product-navigation-pending .t-popup_show .t-store__prod-popup{'
                + 'opacity:0!important;pointer-events:none!important;'
                + '}';
            document.head.appendChild(style);
        }

        if ('MutationObserver' in window && document.documentElement) {
            new MutationObserver(function (records) {
                var shouldApply = records.some(function (record) {
                    var target = record.target;

                    if (
                        target &&
                        target.nodeType === 1 &&
                        target.closest &&
                        target.closest('.t-store__relevants__container, #t-footer, .t396, .selfles-buy-zone')
                    ) {
                        return false;
                    }

                    if (
                        record.type === 'attributes' &&
                        target &&
                        target.nodeType === 1 &&
                        target.closest &&
                        target.closest('.t-slds, .t-store__prod__slider, .t-store__prod-popup__slider, .t-store__prod-snippet__gallery, .js-store-prod-slider')
                    ) {
                        return true;
                    }

                    if (record.type !== 'childList') return false;

                    return Array.prototype.slice.call(record.addedNodes || []).some(function (node) {
                        if (!node || node.nodeType !== 1) return false;

                        if (
                            node.matches &&
                            node.matches('.t-store__relevants__container, .js-product-relevant, #t-footer, .t396')
                        ) {
                            return false;
                        }

                        return node.matches && (
                            node.matches('.t-store__prod-popup, .t-store__product-snippet, .js-store-product.js-product') ||
                            node.matches('.t-slds, .t-slds__thumbsbullet-wrapper, .t-slds__thumbsbullet, .t-store__prod__slider, .t-store__prod-popup__slider, .t-store__prod-snippet__gallery, .js-store-prod-slider') ||
                            node.matches('.t-store__prod-popup__info, .t-store__prod__info, .t-store__prod-snippet__info') ||
                            node.querySelector('.t-slds, .t-slds__thumbsbullet-wrapper, .t-slds__thumbsbullet, .t-store__prod__slider, .t-store__prod-popup__slider, .t-store__prod-snippet__gallery, .js-store-prod-slider') ||
                            node.querySelector('.t-store__prod-popup__info, .t-store__prod__info, .t-store__prod-snippet__info')
                        );
                    });
                });

                if (shouldApply) scheduleApplyFixes();
            }).observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style', 'data-original', 'data-img-zoom-url', 'src']
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyFixes);
        } else {
            applyFixes();
        }

        window.addEventListener('load', function () {
            applyFixes();
            setTimeout(applyFixes, 250);
            setTimeout(applyFixes, 750);
            setTimeout(applyFixes, 1500);
            scheduleProductGalleryFixes();
        });

        scheduleProductGalleryFixes();

        try {
            window.selflesProductRouterApply = applyFixes;
        } catch (e) {}
    })();
</script>
