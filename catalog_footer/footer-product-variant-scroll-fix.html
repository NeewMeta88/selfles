<script>
(function(){
  var INIT='data-selfles-product-variant-scroll-fix';
  var KEY='selflesProductVariantNavigation';
  var COLORS=['pink','green','coffee','blue','cream','white'];
  var CODE={P:'pink',G:'green',C:'coffee',B:'blue',S:'cream',W:'white'};
  if(document.documentElement.getAttribute(INIT)==='1')return;
  document.documentElement.setAttribute(INIT,'1');

  function all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
  function closest(n,s){return n&&n.closest?n.closest(s):null;}
  function norm(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/&nbsp;/g,' ').replace(/\u00a0/g,' ').replace(/["'«»]/g,'').replace(/\s+/g,' ').trim();}
  function compact(v){return norm(v).replace(/[^a-zа-я0-9]+/g,'');}
  function isProductPage(){var p=location.pathname.replace(/\/+$/,'');return p.indexOf('/tproduct/')!==-1||p.indexOf('/catalog/tproduct/')!==-1||p.indexOf('/product/')!==-1;}
  function parseSku(v){var s=String(v||'').trim().toUpperCase(),m;m=s.match(/^PP(150|180|220)([PGCBSW])-?/);if(m)return{sku:s,type:'duvet',size:m[1],color:CODE[m[2]]};m=s.match(/^PP([PGCBSW])-?/);if(m)return{sku:s,type:'duvet',size:'200',color:CODE[m[1]]};m=s.match(/^P(160|180)([PGCBSW])-?/);if(m)return{sku:s,type:'sheet',size:m[1],color:CODE[m[2]]};m=s.match(/^P(KS|EUR)([PGCBSW])-?/);if(m)return{sku:s,type:'sheet',size:m[1],color:CODE[m[2]]};m=s.match(/^N([PGCBSW])-?/);if(m)return{sku:s,type:'pillowcase',size:null,color:CODE[m[1]]};return null;}
  function sizeKey(v){return norm(v).replace(/[×хx]/g,'x').replace(/\s+/g,'').replace(/см/g,'').replace(/,/g,'.');}
  function sizeOptionKey(type,v){var raw=sizeKey(v),labels=type==='duvet'?{'150':'150 х 200','180':'180 х 210','200':'200 х 220','220':'220 х 240'}:{'160':'160 х 200 х 30','180':'180 х 200 х 30','EUR':'220 х 240 (без резинки)','KS':'240 х 260 (без резинки)'},k;if(!raw)return'';if(labels[raw]||raw==='150'||raw==='180'||raw==='200'||raw==='220'||raw==='160'||raw==='EUR'||raw==='KS')return raw;for(k in labels){if(sizeKey(labels[k])===raw||sizeKey(k)===raw)return k;}return raw;}
  function colorKey(v){var r=compact(v);if(!r)return'';if(r==='pink'||r==='rose'||r==='розовый'||r==='розовая'||r==='red'||r==='красный'||r==='красная')return'pink';if(r==='green'||r==='зеленый'||r==='зеленая')return'green';if(r==='coffee'||r==='coffe'||r==='brown'||r==='кофейный'||r==='кофейная'||r==='коричневый')return'coffee';if(r==='blue'||r==='cyan'||r==='голубой'||r==='голубая'||r==='синий')return'blue';if(r==='cream'||r==='ivory'||r==='milk'||r==='сливочный'||r==='молочный')return'cream';if(r==='white'||r==='белый'||r==='белая')return'white';return r;}
  function normalize(v){var u,p;if(!v)return'';try{u=new URL(v,location.href);}catch(e){return'';}if(u.origin!==location.origin)return'';p=u.pathname.replace(/\/+$/,'');if(window.selflesNormalizeProductUrl){return window.selflesNormalizeProductUrl(u.href)||p+u.search;}if(p.indexOf('/catalog/tproduct/')!==-1)p=p.replace('/catalog/tproduct/','/tproduct/');return p+u.search;}
  function available(q){var n,raw=String(q==null?'':q).trim();if(raw==='')return false;if(/^(notlimited|unlimited)$/i.test(raw))return true;n=Number(raw.replace(',','.'));return isFinite(n)&&n>0;}
  function variants(hash){return String(hash||'').split('|').map(function(chunk){var parts=chunk.split(':'),sku=parts.shift()||'',q=parts.shift()||'',price=parts.length>1?parts.pop():'',url=parts.join(':'),p=parseSku(sku);if(!p)return null;p.url=url;p.quantity=q;p.price=price;p.available=available(q)&&!!url;return p;}).filter(Boolean);}
  function currentSku(root){return String(root&&root.getAttribute('data-selfles-sku')||((document.querySelector('.js-product-sku,.js-store-prod-sku,.t-store__prod-popup__sku,.t-store__prod__sku')||{}).textContent)||'').trim().toUpperCase();}
  function selected(btn){return !!btn&&(btn.getAttribute('aria-selected')==='true'||btn.classList.contains('is-active')||btn.classList.contains('active')||btn.classList.contains('selected'));}
  function value(btn,kind){return kind==='color'?(btn.getAttribute('data-color')||btn.getAttribute('aria-label')||btn.getAttribute('title')||btn.textContent||''):(btn.getAttribute('data-size')||btn.getAttribute('aria-label')||btn.getAttribute('title')||btn.textContent||'');}
  function selectedSize(root,type,current){var found=current&&current.size||'';all('.selfles-product-options__size,.selfles-product-options__sizes button',root).some(function(b){if(!selected(b))return false;found=sizeOptionKey(type,value(b,'size'));return !!found;});return found;}
  function selectedColor(root,current){var found=current&&current.color||'';all('.selfles-product-options__color,.selfles-product-options__colors button,.swatch',root).some(function(b){if(!selected(b))return false;found=colorKey(value(b,'color'));return !!found;});return found;}
  function findVariant(list,type,size,color){return list.find(function(v){return v.available&&v.type===type&&String(v.size||'')===String(size||'')&&v.color===color;})||null;}
  function firstForSize(list,type,size){var target=null;COLORS.some(function(color){target=findVariant(list,type,size,color);return !!target;});return target;}
  function mark(url){try{sessionStorage.setItem(KEY,JSON.stringify({at:Date.now(),from:location.href,target:url}));}catch(e){}document.documentElement.classList.add('selfles-variant-navigation-pending');}
  function readMark(){var p;try{p=JSON.parse(sessionStorage.getItem(KEY)||'null');}catch(e){p=null;}return p&&p.at&&Date.now()-Number(p.at)<20000?p:null;}
  function clearMark(){try{sessionStorage.removeItem(KEY);}catch(e){}document.documentElement.classList.remove('selfles-variant-navigation-pending');}
  function productRoot(){return all('.r.t-rec.selfles-product-flow-fixed,.r.t-rec').find(function(r){return !closest(r,'#rec2417486561')&&r.querySelector('.t-store__product-snippet,.js-store-product.js-product,.selfles-product-main-layout');})||document.querySelector('.t-store__product-snippet,.js-store-product.js-product,.selfles-product-main-layout');}
  function scrollTop(){var root;if(!isProductPage()||!readMark())return;root=productRoot();try{window.scrollTo({top:0,left:0,behavior:'auto'});}catch(e){window.scrollTo(0,0);}if(root&&root.scrollIntoView){try{root.scrollIntoView({block:'start',inline:'nearest',behavior:'auto'});}catch(e){root.scrollIntoView(true);}}}
  function scheduleScroll(){if(!isProductPage()||!readMark())return;scrollTop();[40,120,300,700,1300,2200].forEach(function(d){setTimeout(scrollTop,d);});setTimeout(clearMark,2600);}
  function clickedOption(target){var o=closest(target,'.selfles-product-options__size,.selfles-product-options__color,.selfles-product-options__sizes button,.selfles-product-options__colors button,.selfles-product-options button');if(!o||closest(o,'#rec2417486561')||o.disabled||o.getAttribute('aria-disabled')==='true'||o.getAttribute('data-selfles-option-blocked')==='1'||o.getAttribute('data-unavailable')==='true'||o.classList.contains('selfles-option-disabled')||o.classList.contains('is-disabled'))return null;return o;}
  function onClick(e){var o,root,list,current,type,size,color,target,url;if(!isProductPage()||!e||e.type!=='click')return;o=clickedOption(e.target);if(!o)return;root=closest(o,'.selfles-product-options');if(!root)return;list=variants(root.getAttribute('data-selfles-variants-hash'));current=parseSku(currentSku(root));type=current&&current.type;if(!type||!list.length)return;size=selectedSize(root,type,current);color=selectedColor(root,current);if(o.classList.contains('selfles-product-options__size')||closest(o,'.selfles-product-options__sizes')){size=sizeOptionKey(type,value(o,'size'));target=findVariant(list,type,size,color)||firstForSize(list,type,size);}else{color=colorKey(value(o,'color'));target=findVariant(list,type,size,color);}if(!target||!target.url)return;url=normalize(target.url);if(!url)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();mark(url);if(normalize(location.href)===url){scheduleScroll();return;}location.assign(url);}
  try{if('scrollRestoration'in history)history.scrollRestoration='manual';}catch(e){}
  document.addEventListener('click',onClick,true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scheduleScroll);else scheduleScroll();
  window.addEventListener('load',scheduleScroll);
}());
</script>
