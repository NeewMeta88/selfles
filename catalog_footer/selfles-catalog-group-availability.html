<style>
  body #allrecords .t-store__card[data-selfles-group-available="1"] a {
    pointer-events: auto !important;
    cursor: pointer !important;
  }

  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__imgwrapper::before,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__imgwrapper::after,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__imgwrapper_1-1::before,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__imgwrapper_1-1::after {
    content: none !important;
    display: none !important;
  }

  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__title,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .js-product-name,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__price,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__price-value,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .js-product-price,
  body #allrecords .t-store__card[data-selfles-group-available="1"] .t-store__card__price-currency {
    color: #EE413C !important;
  }
</style>

<script>
(function () {
  var INIT = 'data-selfles-catalog-group-availability-v2';
  var DONOR = '#rec2417486561';

  if (document.documentElement.getAttribute(INIT) === '1') return;
  document.documentElement.setAttribute(INIT, '1');

  var COLOR_BY_CODE = {
    P: 'pink',
    G: 'green',
    C: 'coffee',
    B: 'blue',
    S: 'cream',
    W: 'white'
  };

  var SIZE_RANK = {
    pillowcase: 0,
    '150': 1,
    '160': 1,
    '180': 2,
    '200': 3,
    '220': 4,
    EUR: 5,
    KS: 6
  };

  function all(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  function attr(node, names) {
    var i;
    var value;

    if (!node || !node.getAttribute) return '';

    for (i = 0; i < names.length; i += 1) {
      value = node.getAttribute(names[i]);
      if (value !== null && value !== undefined && String(value).trim() !== '') {
        return String(value).trim();
      }
    }

    return '';
  }

  function cleanSku(value) {
    return String(value || '')
      .replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i, '')
      .trim()
      .toUpperCase();
  }

  function canonicalSku(value) {
    var sku = cleanSku(value);
    var aliases = window.SELFLES_SKU_ALIASES || {};

    return cleanSku(aliases[sku] || aliases[sku.replace(/\s+/g, '')] || sku);
  }

  function parseSku(value) {
    var external = window.SELFLES_PRODUCT_DATA && window.SELFLES_PRODUCT_DATA.parseSku;
    var sku = canonicalSku(value);
    var match;

    if (typeof external === 'function') {
      try {
        match = external(sku);
        if (match && match.type && match.color) return match;
      } catch (e) {}
    }

    match = sku.match(/^N([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'pillowcase', size: null, color: COLOR_BY_CODE[match[1]]};

    match = sku.match(/^PP(150|180|220)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'duvet', size: match[1], color: COLOR_BY_CODE[match[2]]};

    match = sku.match(/^PP([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'duvet', size: '200', color: COLOR_BY_CODE[match[1]]};

    match = sku.match(/^P(160|180|EUR|KS)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'sheet', size: match[1], color: COLOR_BY_CODE[match[2]]};

    return null;
  }

  function normalizeProductUrl(value) {
    var url;

    if (!value) return '';

    try {
      url = new URL(String(value), location.href);
    } catch (e) {
      return '';
    }

    if (url.pathname.indexOf('/tproduct/') === -1 && url.pathname.indexOf('/product/') === -1) return '';

    return url.pathname.replace('/tproduct/', '/catalog/tproduct/') + url.search + url.hash;
  }

  function urlPath(value) {
    return normalizeProductUrl(value).replace(/\/$/, '');
  }

  function uidFromUrl(value) {
    var match = String(value || '').match(/\/tproduct\/(\d+)/);
    return match ? match[1] : '';
  }

  function moneyNumber(value) {
    var number = Number(String(value || '')
      .replace(/\s+/g, '')
      .replace(/[^\d.,-]/g, '')
      .replace(',', '.'));

    return isFinite(number) ? number : NaN;
  }

  function formatMoney(value) {
    return String(Math.round(value)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function productUrl(product) {
    return normalizeProductUrl(product && (product.url || product.productUrl || product.href || product.link));
  }

  function productQuantity(product) {
    return product && (product.quantity !== undefined ? product.quantity : product.inv);
  }

  function isAvailable(product) {
    var quantity = productQuantity(product);

    if (quantity === undefined || quantity === null || quantity === '') return true;
    if (/^(notlimited|unlimited)$/i.test(String(quantity))) return true;

    return Number(String(quantity).replace(',', '.')) > 0;
  }

  function skuFromCard(card) {
    var nested;
    var value;
    var match;

    if (!card) return '';

    value = attr(card, ['data-selfles-sku', 'data-product-sku', 'data-sku', 'data-product-lid']);
    if (value && !/^\d+$/.test(value) && parseSku(value)) return canonicalSku(value);

    nested = card.querySelector('.js-product-sku,.js-store-prod-sku,.t-store__card__sku,[data-product-sku],[data-sku]');
    value = attr(nested, ['data-product-sku', 'data-sku']) || (nested ? nested.textContent : '');
    if (value && parseSku(value)) return canonicalSku(value);

    match = String(card.textContent || '').toUpperCase().match(/\b(?:N[PGCBSW]-?BAM\d+|P(?:160|180|EUR|KS)[PGCBSW]-?BAM\d+|PP(?:150|180|220)?[PGCBSW]-?BAM\d+)\b/);

    return match ? canonicalSku(match[0]) : '';
  }

  function products() {
    var source;

    if (typeof window.selflesRefreshLiveProductsSource === 'function') {
      try {
        window.selflesRefreshLiveProductsSource({dispatch: false});
      } catch (e) {}
    }

    source = window.SELFLES_PRODUCTS_BY_SKU || {};

    return Object.keys(source).map(function (key) {
      var product = source[key] || {};
      var sku = canonicalSku(product.sku || key);
      var parsed = parseSku(sku);

      if (!parsed) return null;

      return Object.assign({}, product, parsed, {sku: sku});
    }).filter(Boolean);
  }

  function allProductsForPrices() {
    var result = [];
    var seen = {};

    products().forEach(function (product) {
      if (product && product.sku && !seen[product.sku]) {
        seen[product.sku] = 1;
        result.push(product);
      }
    });

    all(DONOR + ' .js-product,' + DONOR + ' .t-store__card,' + DONOR + ' [data-product-url]').forEach(function (card) {
      var sku = skuFromCard(card);
      var parsed = parseSku(sku);
      var priceElement = card.querySelector('.js-product-price,.js-store-prod-price-val,.t-store__card__price-value,.t-store__card__price');
      var url = attr(card, ['data-product-url']) ||
        ((card.querySelector('a[href*="/tproduct/"],a[href*="/catalog/tproduct/"]') || {}).href || '');

      if (!parsed || seen[parsed.sku]) return;

      seen[parsed.sku] = 1;
      result.push({
        sku: parsed.sku,
        type: parsed.type,
        size: parsed.size,
        color: parsed.color,
        price: priceElement ? priceElement.textContent : '',
        url: normalizeProductUrl(url),
        quantity: attr(card, ['data-product-inv', 'data-store-prod-inv', 'data-inv'])
      });
    });

    return result;
  }

  function cardProduct(card, list) {
    var sku = skuFromCard(card);
    var link = card && card.querySelector('a[href*="/tproduct/"],a[href*="/catalog/tproduct/"],a[data-selfles-original-href]');
    var href = attr(card, ['data-product-url', 'data-selfles-original-product-url']) ||
      (link ? (link.getAttribute('href') || link.href || attr(link, ['data-selfles-original-href'])) : '');
    var path = urlPath(href);
    var uid = attr(card, ['data-product-uid', 'data-product-gen-uid', 'data-product-lid']) || uidFromUrl(href);

    return list.find(function (product) {
      return sku && product.sku === sku;
    }) || list.find(function (product) {
      return uid && String(product.tildaUid || product.uid || product.product_uid || product.productUid || '') === String(uid);
    }) || list.find(function (product) {
      return path && urlPath(productUrl(product)) === path;
    }) || parseSku(sku) || null;
  }

  function groupForCard(card, availableList, priceList) {
    var current = cardProduct(card, priceList.concat(availableList));
    var group;
    var available;
    var minPrice = Infinity;

    if (!current || !current.type || !current.color) return null;

    group = priceList.filter(function (product) {
      return product.type === current.type && product.color === current.color;
    });

    group.forEach(function (product) {
      var number = moneyNumber(product.price);
      if (isFinite(number) && number > 0 && number < minPrice) minPrice = number;
    });

    available = availableList.filter(function (product) {
      return product.type === current.type &&
        product.color === current.color &&
        isAvailable(product) &&
        productUrl(product);
    }).sort(function (a, b) {
      return (SIZE_RANK[a.size || a.type] || 99) - (SIZE_RANK[b.size || b.type] || 99);
    });

    if (!available.length) return null;

    return {
      target: available[0],
      minPrice: isFinite(minPrice) ? minPrice : moneyNumber(available[0].price)
    };
  }

  function removeGuards(card) {
    var id = card && card.getAttribute('data-selfles-click-guard-id');

    if (!id) return;

    all('.selfles-card-click-guard').forEach(function (guard) {
      if (guard.getAttribute('data-selfles-click-guard') === id) guard.remove();
    });

    card.removeAttribute('data-selfles-click-guard-id');
  }

  function setPrice(card, value) {
    var number = Number(value);

    if (!isFinite(number) || number <= 0) return;

    all('.js-product-price,.js-store-prod-price-val,.t-store__card__price-value', card).forEach(function (element) {
      element.textContent = formatMoney(number);
      element.setAttribute('data-product-price-def-str', String(Math.round(number)));
    });
  }

  function applyCard(card, group) {
    var product = group && group.target;
    var url = productUrl(product);

    if (!product || !url) return;

    card.setAttribute('data-selfles-group-available', '1');
    card.classList.remove('selfles-card-disabled', 'selfles-card-sold-out', 't-store__card_soldout', 't-store__card_sold-out');
    card.removeAttribute('data-selfles-card-disabled');
    card.removeAttribute('data-selfles-original-product-url');
    card.setAttribute('data-product-url', url);
    card.setAttribute('data-product-inv', String(productQuantity(product) || 1));

    all('a', card).forEach(function (link) {
      link.href = url;
      link.removeAttribute('data-selfles-original-href');
      link.removeAttribute('aria-disabled');
      link.removeAttribute('tabindex');
    });

    all('.selfles-sold-out-badge,.js-store-prod-sold-out,.t-store__card__sold-out-msg,.t-store__card__soldout', card).forEach(function (element) {
      element.style.setProperty('display', 'none', 'important');
    });

    setPrice(card, group.minPrice);
    removeGuards(card);
  }

  function run() {
    var availableList = products();
    var priceList = allProductsForPrices();

    if (!availableList.length || !priceList.length) return;

    all('.js-product.t-store__card:not(.js-product-relevant),.t-store__card:not(.js-product-relevant)').forEach(function (card) {
      var group = groupForCard(card, availableList, priceList);
      if (group) applyCard(card, group);
    });
  }

  window.selflesCatalogGroupDebug = function () {
    var availableList = products();
    var priceList = allProductsForPrices();

    return all('.js-product.t-store__card:not(.js-product-relevant),.t-store__card:not(.js-product-relevant)').map(function (card) {
      var current = cardProduct(card, priceList.concat(availableList));
      var group = groupForCard(card, availableList, priceList);

      return {
        card: current && current.sku,
        type: current && current.type,
        color: current && current.color,
        target: group && group.target && group.target.sku,
        minPrice: group && group.minPrice
      };
    }).filter(function (item) {
      return item.card || item.target;
    });
  };

  [0, 200, 600, 1200, 2500, 5000].forEach(function (delay) {
    setTimeout(run, delay);
  });

  window.addEventListener('load', run);
  window.addEventListener('selfles:products-manifest-ready', run);
  window.addEventListener('selfles:live-products-ready', run);

  if ('MutationObserver' in window && document.body) {
    new MutationObserver(function () {
      clearTimeout(run.timer);
      run.timer = setTimeout(run, 120);
    }).observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['class', 'data-product-inv', 'data-product-url']
    });
  }
}());
</script>
