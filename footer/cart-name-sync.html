<!-- Дублирование ФИО в соответствующее поле доставки + проверка корректности ввода данных -->
<script>
    t_onReady(() => {
        const inputsbox = document.querySelector('.t706 .t-form__inputsbox')

        if (!inputsbox) return

        const inputName = inputsbox.querySelector('input[name="Name"]')
        const tSubmit = inputsbox.querySelector('button.t-submit') || document.querySelector('.t706 button.t-submit')

        if (!inputName || !tSubmit) return

        let userinitials

        function inputValidation(input) {
            return input.value.replace(/[^\p{L}\s]/gu, '').replace(/\s+/g, ' ')
        }

        function blurValidation(input) {
            input.value = input.value.trim()

            if (input.value.split(' ').length < 3) {
                input.parentElement.classList.add('t-input-custom-error')
                tSubmit.style.pointerEvents = 'none'
                tSubmit.style.opacity = '.2'
            } else {
                input.parentElement.classList.remove('t-input-custom-error')
                tSubmit.style.pointerEvents = ''
                tSubmit.style.opacity = ''
            }
        }

        function copyValue(userinitials, value) {
            if (userinitials) {
                userinitials.value = value
            }
        }

        inputName.addEventListener('input', (e) => {
            const target = e.target

            target.value = inputValidation(target)

            copyValue(userinitials, target.value)
        })

        inputName.addEventListener('blur', (e) => {
            const target = e.target

            target.value = target.value.trim()

            blurValidation(target)
            copyValue(userinitials, target.value)
        })

        if (!('MutationObserver' in window)) return

        const cartObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.target.id === 'addresses-wrapper' && mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                    mutation.addedNodes.forEach((node) => {
                        const input = node.querySelector('input[name="tildadelivery-userinitials"]')

                        if (input) {
                            userinitials = input
                            input.value = inputName.value
                            node.style.display = 'none'
                        }
                    })
                }
            })
        })

        cartObserver.observe(inputsbox, { childList: true, subtree: true })
    })
</script>
