<script>
    (function () {
        var INIT_ATTR = 'data-selfles-product-title-and-back-hotfix-v1';
        var STYLE_ID = 'selfles-product-title-and-back-hotfix-style-v1';
        var BACK_URL_KEY = 'selflesProductBackUrl';
        var APPLY_TIMER = null;

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        function all(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function closest(node, selector) {
            return node && node.closest ? node.closest(selector) : null;
        }

        function lower(value) {
            try {
                return String(value || '').toLocaleLowerCase('ru-RU');
            } catch (e) {
                return String(value || '').toLowerCase();
            }
        }

        function isProductUrl(value) {
            var url;

            if (!value) return false;

            try {
                url = new URL(value, location.href);
            } catch (e) {
                return false;
            }

            return url.origin === location.origin && (
                url.pathname.indexOf('/catalog/tproduct/') !== -1 ||
                url.pathname.indexOf('/tproduct/') !== -1 ||
                url.pathname.indexOf('/product/') !== -1
            );
        }

        function isProductPage() {
            return isProductUrl(location.href);
        }

        function normalizeBackUrl(value) {
            var url;
            var path;

            if (!value) return '';

            try {
                url = new URL(value, location.href);
            } catch (e) {
                return '';
            }

            if (url.origin !== location.origin) return '';
            if (isProductUrl(url.href)) return '';

            path = url.pathname.replace(/\/+$/, '') || '/';

            /*
              page136595006.html — техническая/служебная страница Tilda.
              Пользователю туда возвращаться нельзя.
            */
            if (path === '/page136595006.html') return '/catalog';

            /*
              Текущая главная у тебя может быть техническим URL.
              Оставляем его валидным, потому что если товар открыли с главной,
              надо вернуть именно туда.
            */
            if (path === '/page94832776.html') return '/page94832776.html';

            if (path === '/' || path === '/catalog') {
                return path + url.search + url.hash;
            }

            /*
              Остальные внутренние страницы лучше не использовать как back для товара,
              чтобы случайно не возвращать на технические Tilda-страницы.
            */
            return '';
        }

        function cleanStoredBadBackUrl() {
            var stored = '';

            try {
                stored = sessionStorage.getItem(BACK_URL_KEY) || '';
            } catch (e) {}

            if (!stored) return;

            try {
                if (new URL(stored, location.href).pathname.replace(/\/+$/, '') === '/page136595006.html') {
                    sessionStorage.removeItem(BACK_URL_KEY);
                }
            } catch (e) {}
        }

        function rememberBackUrl(value) {
            var backUrl = normalizeBackUrl(value);

            if (!backUrl) return;

            try {
                sessionStorage.setItem(BACK_URL_KEY, backUrl);
            } catch (e) {}
        }

        function getBackUrl() {
            var stored = '';
            var ref = '';

            cleanStoredBadBackUrl();

            try {
                stored = normalizeBackUrl(sessionStorage.getItem(BACK_URL_KEY) || '');
            } catch (e) {}

            if (stored) return stored;

            ref = normalizeBackUrl(document.referrer || '');
            if (ref) return ref;

            return '/catalog';
        }

        function rememberCurrentPageIfNotProduct() {
            if (isProductPage()) return;
            rememberBackUrl(location.href);
        }

        function handleProductCardClick(event) {
            var card;
            var link;

            if (!event || !event.target) return;
            if (isProductPage()) return;

            card = closest(event.target, [
                '.js-product.t-store__card',
                '.t-store__card',
                '.selfles-related-card',
                '[data-product-url]'
            ].join(','));

            link = closest(event.target, 'a[href]');

            if (!card && !(link && isProductUrl(link.href || link.getAttribute('href')))) return;
            if (closest(event.target, '.t706, .t-store__cart, .t-store__prod-popup, .t-store__product-popup')) return;

            rememberBackUrl(location.href);
        }

        function getCloseSelector() {
            return [
                '.t-store__prod-popup__close-txt-wr',
                '.t-store__prod-popup__close-txt',
                '.js-store-close-text',
                '.t-popup__close',
                '.t-popup__close-wrapper',
                '[data-selfles-product-back]',
                'a[href="/catalog"]',
                'a[href="https://selfles.ru/catalog"]',
                'a[href="/page136595006.html"]',
                'a[href="https://selfles.ru/page136595006.html"]'
            ].join(',');
        }

        function fixCloseTargets() {
            var backUrl = getBackUrl();

            if (!isProductPage()) {
                rememberCurrentPageIfNotProduct();
                return;
            }

            all(getCloseSelector()).forEach(function (node) {
                var link = node.tagName === 'A' ? node : closest(node, 'a');

                if (link) {
                    link.setAttribute('href', backUrl);
                }

                node.setAttribute('data-selfles-product-back', '1');
            });
        }

        function handleCloseClick(event) {
            var close;

            if (!event || !event.target) return;

            close = closest(event.target, getCloseSelector());
            if (!close) return;

            if (!isProductPage() && !closest(close, '.t-popup, .t-store__prod-popup, .t-store__product-popup')) return;

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            location.assign(getBackUrl());
        }

        function ensureStyle() {
            var style;

            if (document.getElementById(STYLE_ID)) return;

            style = document.createElement('style');
            style.id = STYLE_ID;
            style.textContent = [
                '.selfles-title-no-uppercase{',
                'text-transform:none!important;',
                'letter-spacing:0!important;',
                '}',

                'body.selfles-product-page .selfles-title-no-uppercase,',
                '.t-store__prod-popup .selfles-title-no-uppercase,',
                '.t-store__prod-snippet .selfles-title-no-uppercase,',
                '.t-popup .selfles-title-no-uppercase,',
                '.t-store__card__title .selfles-title-no-uppercase,',
                '.js-product-name .selfles-title-no-uppercase{',
                'text-transform:none!important;',
                'letter-spacing:0!important;',
                '}'
            ].join('');

            (document.head || document.documentElement).appendChild(style);
        }

        function hasBackticks(value) {
            return String(value || '').indexOf('`') !== -1;
        }

        function stripBackticks(value) {
            return String(value || '').replace(/`/g, '');
        }

        function normalizeTitle(value) {
            return stripBackticks(value)
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function buildFragmentFromBackticks(rawValue) {
            var raw = String(rawValue || '');
            var fragment = document.createDocumentFragment();
            var regexp = /`([^`]*)`/g;
            var lastIndex = 0;
            var match;
            var protectedFound = false;

            function appendText(value) {
                if (!value) return;
                fragment.appendChild(document.createTextNode(value));
            }

            function appendProtected(value) {
                var span;

                if (!value) return;

                span = document.createElement('span');
                span.className = 'selfles-title-no-uppercase';
                span.textContent = lower(value);
                fragment.appendChild(span);
            }

            while ((match = regexp.exec(raw)) !== null) {
                appendText(raw.slice(lastIndex, match.index));
                appendProtected(match[1]);
                lastIndex = regexp.lastIndex;
                protectedFound = true;
            }

            appendText(raw.slice(lastIndex));

            if (!protectedFound) {
                fragment.textContent = stripBackticks(raw);
            }

            return fragment;
        }

        function replaceKnownCollabPhrase(el) {
            var source = normalizeTitle(el.textContent || '');
            var lowerSource = lower(source);
            var phrase = 'anchovy’s club x selfles';
            var phrasePlain = "anchovy's club x selfles";
            var index = lowerSource.indexOf(phrase);
            var originalPhraseLength = phrase.length;
            var before;
            var after;
            var span;

            if (index === -1) {
                index = lowerSource.indexOf(phrasePlain);
                originalPhraseLength = phrasePlain.length;
            }

            if (index === -1) return false;

            before = source.slice(0, index);
            after = source.slice(index + originalPhraseLength);

            el.textContent = '';

            if (before) {
                el.appendChild(document.createTextNode(before.replace(/[`'’]\s*$/g, '').trimEnd() + ' '));
            }

            span = document.createElement('span');
            span.className = 'selfles-title-no-uppercase';
            span.textContent = phrase;
            el.appendChild(span);

            if (after) {
                el.appendChild(document.createTextNode(after.replace(/^\s*[`'’]/g, '')));
            }

            el.setAttribute('data-selfles-known-collab-fixed', '1');

            return true;
        }

        function applyBacktickTitle(el) {
            var raw;
            var expected;

            if (!el) return;
            if (closest(el, '.selfles-product-details, .selfles-product-options, .t706, .t-store__cart')) return;

            raw = el.getAttribute('data-selfles-title-raw') || el.textContent || '';

            if (hasBackticks(raw)) {
                expected = normalizeTitle(raw);

                if (
                    el.getAttribute('data-selfles-title-raw') === raw &&
                    el.querySelector('.selfles-title-no-uppercase') &&
                    normalizeTitle(el.textContent) === expected
                ) {
                    return;
                }

                el.textContent = '';
                el.appendChild(buildFragmentFromBackticks(raw));
                el.setAttribute('data-selfles-title-raw', raw);
                return;
            }

            /*
              Страховка для страницы товара, где Tilda уже могла удалить backticks
              или превратить их в обычные кавычки, но всё равно загнать коллаб в uppercase.
            */
            replaceKnownCollabPhrase(el);
        }

        function applyTitleFix() {
            ensureStyle();

            all([
                '.js-product.t-store__card .t-store__card__title',
                '.js-product.t-store__card .js-product-name',
                '.t-store__card .t-store__card__title',
                '.t-store__card .js-product-name',
                '.selfles-related-card__title',

                '.selfles-product-main-layout__info .t-store__prod__title',
                '.selfles-product-main-layout__info .t-store__prod-popup__title',
                '.selfles-product-main-layout__info .t-store__prod__name',
                '.selfles-product-main-layout__info .t-store__prod-popup__name',
                '.selfles-product-main-layout__info .js-store-prod-name',
                '.selfles-product-main-layout__info .js-product-name',
                '.selfles-product-main-layout__info h1',

                '.t-store__prod-snippet h1',
                '.t-store__prod-popup h1',
                '.t-store__prod-snippet__title',
                '.t-store__prod-popup__title',
                '.t-store__prod-snippet__name',
                '.t-store__prod-popup__name',
                '.t-store__prod-snippet .js-store-prod-name',
                '.t-store__prod-popup .js-store-prod-name',
                '.t-popup .t-store__prod-popup__name',
                '.t-popup .js-store-prod-name'
            ].join(',')).forEach(applyBacktickTitle);
        }

        function applyAll() {
            cleanStoredBadBackUrl();

            if (document.body && isProductPage()) {
                document.body.classList.add('selfles-product-page');
            }

            fixCloseTargets();
            applyTitleFix();
        }

        function scheduleApplyAll() {
            clearTimeout(APPLY_TIMER);
            APPLY_TIMER = setTimeout(applyAll, 50);
        }

        ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(function (eventName) {
            document.addEventListener(eventName, handleProductCardClick, true);
        });

        document.addEventListener('click', handleCloseClick, true);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyAll);
        } else {
            applyAll();
        }

        window.addEventListener('load', function () {
            applyAll();
            setTimeout(applyAll, 100);
            setTimeout(applyAll, 300);
            setTimeout(applyAll, 700);
            setTimeout(applyAll, 1200);
            setTimeout(applyAll, 2000);
            setTimeout(applyAll, 3500);
        });

        if ('MutationObserver' in window && document.documentElement) {
            new MutationObserver(scheduleApplyAll).observe(document.documentElement, {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,
                attributeFilter: ['class', 'style', 'href']
            });
        }

        window.selflesProductTitleAndBackHotfix = applyAll;
    })();
</script>
