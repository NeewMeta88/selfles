<style>
  /* ===== SELFLES: global title backtick cleaner ===== */
  .selfles-title-no-uppercase {
    text-transform: none !important;
    letter-spacing: normal !important;
  }
</style>
<script>
  (function () {
    var INIT_ATTR = 'data-selfles-global-title-product-entry-v1';
    var BACK_URL_KEY = 'selflesProductBackUrl';

    if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
    document.documentElement.setAttribute(INIT_ATTR, '1');

    var lastNavUrl = '';
    var lastNavAt = 0;
    var applyTimer = null;

    function all(selector, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(selector));
    }

    function closest(node, selector) {
      if (!node || !node.closest) return null;
      return node.closest(selector);
    }

    function getPath(value) {
      var url;

      try {
        url = new URL(value || location.href, location.href);
      } catch (e) {
        return '';
      }

      return url.pathname.replace(/\/+$/, '') || '/';
    }

    function getPageAlias() {
      var allrecords = document.getElementById('allrecords');
      return allrecords ? String(allrecords.getAttribute('data-tilda-page-alias') || '') : '';
    }

    function isProductPage() {
      var path = getPath(location.href);

      return path.indexOf('/catalog/tproduct/') !== -1 ||
        path.indexOf('/tproduct/') !== -1 ||
        path.indexOf('/product/') !== -1 ||
        !!(document.body && document.body.classList.contains('selfles-product-page'));
    }

    function isMainPage() {
      var path = getPath(location.href);
      var alias = getPageAlias();

      return path === '/' ||
        path === '/page94832776.html' ||
        alias === 'main' ||
        alias === 'home' ||
        alias === 'index';
    }

    function normalizeProtectedText(value) {
      return String(value || '').toLowerCase();
    }

    function stripProductTitleMarkers(value) {
      return String(value || '')
        .replace(/`([^`]*)`/g, function (_, protectedText) {
          return normalizeProtectedText(protectedText);
        })
        .replace(/`/g, '');
    }

    function buildProtectedProductTitleFragment(value) {
      var raw = String(value || '');
      var fragment = document.createDocumentFragment();
      var regexp = /`([^`]*)`/g;
      var lastIndex = 0;
      var match;
      var hasProtectedPart = false;

      function appendText(text) {
        if (!text) return;
        fragment.appendChild(document.createTextNode(text));
      }

      function appendProtectedText(text) {
        var span;

        if (!text) return;

        span = document.createElement('span');
        span.className = 'selfles-title-no-uppercase';
        span.textContent = normalizeProtectedText(text);

        try {
          span.style.setProperty('text-transform', 'none', 'important');
          span.style.setProperty('letter-spacing', 'normal', 'important');
        } catch (e) {}

        fragment.appendChild(span);
      }

      while ((match = regexp.exec(raw)) !== null) {
        appendText(raw.slice(lastIndex, match.index));
        appendProtectedText(match[1]);
        lastIndex = regexp.lastIndex;
        hasProtectedPart = true;
      }

      appendText(raw.slice(lastIndex));

      if (!hasProtectedPart) {
        fragment.textContent = stripProductTitleMarkers(raw);
      }

      return fragment;
    }

    function getRawTitle(el) {
      var raw;

      if (!el) return '';

      raw = el.getAttribute('data-selfles-title-raw') || '';
      if (raw) return raw;

      return el.textContent || '';
    }

    function applyProtectedProductTitle(el) {
      var raw;

      if (!el) return;
      if (closest(el, '.selfles-product-details, .selfles-product-options, .t-store__cart, .t706')) return;

      raw = getRawTitle(el);
      if (raw.indexOf('`') === -1) return;

      el.textContent = '';
      el.appendChild(buildProtectedProductTitleFragment(raw));
      el.setAttribute('data-selfles-title-raw', raw);
    }

    function applyPlainProductTitle(el) {
      var raw;
      var clean;

      if (!el) return;
      if (closest(el, '.t-store__prod-popup, .t-store__prod-snippet, .selfles-product-main-layout__info, .t-store__cart, .t706')) return;

      raw = getRawTitle(el);
      if (raw.indexOf('`') === -1) return;

      clean = stripProductTitleMarkers(raw);

      if ((el.textContent || '') !== clean) {
        el.textContent = clean;
      }

      el.setAttribute('data-selfles-title-raw', raw);
    }

    function applyTitleBacktickCleaner() {
      if (isProductPage()) {
        all([
          '.selfles-product-main-layout__info .t-store__prod__title',
          '.selfles-product-main-layout__info .t-store__prod-popup__title',
          '.selfles-product-main-layout__info .t-store__prod__name',
          '.selfles-product-main-layout__info .t-store__prod-popup__name',
          '.selfles-product-main-layout__info .js-product-name',
          '.selfles-product-main-layout__info .t-title',
          '.t-store__prod-snippet h1',
          '.t-store__prod-popup h1',
          '.t-store__prod-snippet__title',
          '.t-store__prod-popup__title',
          '.t-store__prod-snippet__name',
          '.t-store__prod-popup__name',
          '.t-store__prod-snippet .js-store-prod-name',
          '.t-store__prod-popup .js-store-prod-name'
        ].join(',')).forEach(applyProtectedProductTitle);
      }

      all([
        '.js-product.t-store__card .t-store__card__title',
        '.js-product.t-store__card .js-product-name',
        '.t-store__card .t-store__card__title',
        '.t-store__card .js-product-name',
        '.selfles-related-card__title',
        '.selfles-home-store-track .t-store__card__title',
        '.selfles-home-store-track .js-product-name'
      ].join(',')).forEach(applyPlainProductTitle);
    }

    function normalizeProductUrl(value) {
      var url;
      var path;

      if (!value) return '';

      try {
        url = new URL(value, location.href);
      } catch (e) {
        return '';
      }

      if (url.origin !== location.origin) return '';

      path = url.pathname.replace(/\/+$/, '');

      if (path.indexOf('/catalog/tproduct/') !== -1) {
        return path.replace('/catalog/tproduct/', '/tproduct/') + url.search + url.hash;
      }

      if (path.indexOf('/tproduct/') !== -1) {
        return path + url.search + url.hash;
      }

      if (path.indexOf('/product/') !== -1) {
        return path + url.search + url.hash;
      }

      return '';
    }

    try {
      window.selflesNormalizeProductUrl = window.selflesNormalizeProductUrl || normalizeProductUrl;
    } catch (e) {}

    function normalizeBackUrl(value) {
      var url;
      var path;

      if (!value) return '';

      try {
        url = new URL(value, location.href);
      } catch (e) {
        return '';
      }

      if (url.origin !== location.origin) return '';
      if (normalizeProductUrl(url.href)) return '';

      path = url.pathname.replace(/\/+$/, '') || '/';

      if (path === '/page136595006.html') return '/catalog';

      return path + url.search + url.hash;
    }

    function rememberBackUrl(value) {
      var backUrl = normalizeBackUrl(value);

      if (!backUrl) return;

      try {
        sessionStorage.setItem(BACK_URL_KEY, backUrl);
      } catch (e) {}
    }

    function getBackUrl() {
      var stored = '';

      try {
        stored = normalizeBackUrl(sessionStorage.getItem(BACK_URL_KEY));
      } catch (e) {}

      return stored || normalizeBackUrl(document.referrer) || (isMainPage() ? '/' : '/catalog');
    }

    function isIgnoredClickTarget(target) {
      return !!closest(target, [
        '.t-store__prod-popup__btn',
        '.t-store__prod__btn',
        '.js-store-prod-popup-buy-btn',
        '.selfles-product-buy-button-fixed',
        '.t-store__cart',
        '.t706',
        '.t706__cartwin',
        '.t-store__prod__quantity',
        '.t-store__prod-popup__quantity',
        '.t-store__prod-popup__quantity-wrapper',
        '.js-store-prod-quantity',
        '.selfles-product-options',
        '.t-product__option',
        '.t-store__filter',
        '.t-store__parts-switch-btn',
        '.t-store__pagination',
        '.js-store-load-more-btn',
        '.t-store__load-more-btn',
        '.selfles-home-store-arrow',
        '.selfles-catalog-slider-arrow',
        '.t-slds__arrow_wrapper',
        '.t-slds__bullet',
        '.t-slds__thumbsbullet'
      ].join(','));
    }

    function getProductUrlFromNode(node) {
      var link;
      var card;
      var url;

      if (!node) return '';

      link = closest(node, 'a[href]');
      if (link) {
        url = normalizeProductUrl(link.getAttribute('href') || link.href);
        if (url) return url;
      }

      card = closest(node, [
        '.js-product.t-store__card',
        '.t-store__card',
        '.js-store-product.js-product',
        '.selfles-related-card',
        '[data-product-url]'
      ].join(','));

      if (!card) return '';

      url = normalizeProductUrl(card.getAttribute('data-product-url'));
      if (url) return url;

      link = card.querySelector('a[href*="/tproduct/"], a[href*="/catalog/tproduct/"], a[href*="/product/"]');
      if (link) {
        url = normalizeProductUrl(link.getAttribute('href') || link.href);
        if (url) return url;
      }

      return '';
    }

    function isCardClickTarget(target) {
      var card;

      if (!target) return false;
      if (isIgnoredClickTarget(target)) return false;

      card = closest(target, [
        '.js-product.t-store__card',
        '.t-store__card',
        '.selfles-related-card',
        '[data-product-url]'
      ].join(','));

      if (!card) return false;

      if (closest(target, '.t-store__prod-popup, .t-store__product-popup, .t-popup, .t-store__cart, .t706')) {
        return !!closest(target, '.selfles-related-card');
      }

      return true;
    }

    function forceNavigate(url) {
      var now = Date.now();

      url = normalizeProductUrl(url);
      if (!url) return false;

      if (getPath(location.href) === getPath(url)) return false;

      if (lastNavUrl === url && now - lastNavAt < 1500) {
        return true;
      }

      lastNavUrl = url;
      lastNavAt = now;

      try {
        document.documentElement.classList.add('selfles-product-navigation-pending');
      } catch (e) {}

      location.assign(url);

      return true;
    }

    function handleProductOpen(event) {
      var url;

      if (!event || !event.target) return;

      if (
        event.type === 'click' ||
        event.type === 'mousedown' ||
        event.type === 'pointerdown'
      ) {
        if (event.button && event.button !== 0) return;
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      }

      if (!isCardClickTarget(event.target)) return;

      url = getProductUrlFromNode(event.target);
      if (!url) return;

      rememberBackUrl(location.href);

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      forceNavigate(url);
    }

    function hasProductContext(node) {
      if (isProductPage()) return true;

      return !!closest(node, [
        '.t-store__product-popup',
        '.t-store__prod-popup',
        '.selfles-product-main-layout',
        '.t-popup_show .t-store__product-popup'
      ].join(','));
    }

    function handleProductClose(event) {
      var close;

      if (!event || !event.target || !event.target.closest) return;

      close = closest(event.target, [
        '.t-popup__close',
        '.t-store__prod-popup__close-txt-wr',
        '.t-store__prod-popup__close-txt',
        '.js-store-close-text',
        '[data-selfles-product-back]'
      ].join(','));

      if (!close) return;
      if (!hasProductContext(close)) return;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      location.assign(getBackUrl());
    }

    function repairProductLinks(root) {
      all([
        '.js-product.t-store__card',
        '.t-store__card',
        '.selfles-related-card',
        '[data-product-url]'
      ].join(','), root || document).forEach(function (card) {
        var url = normalizeProductUrl(card.getAttribute('data-product-url'));
        var link;

        if (!url) {
          link = card.querySelector('a[href*="/tproduct/"], a[href*="/catalog/tproduct/"], a[href*="/product/"]');
          if (link) url = normalizeProductUrl(link.getAttribute('href') || link.href);
        }

        if (!url) return;

        card.setAttribute('data-product-url', url);

        all('a[href]', card).forEach(function (a) {
          if (isIgnoredClickTarget(a)) return;
          if (!normalizeProductUrl(a.getAttribute('href') || a.href)) return;

          a.setAttribute('href', url);
          a.removeAttribute('target');
        });
      });
    }

    function applyGlobalFixes() {
      applyTitleBacktickCleaner();
      repairProductLinks(document);
    }

    function scheduleGlobalFixes() {
      clearTimeout(applyTimer);
      applyTimer = setTimeout(applyGlobalFixes, 80);
    }

    ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(function (eventName) {
      window.addEventListener(eventName, handleProductOpen, true);
      document.addEventListener(eventName, handleProductOpen, true);
    });

    window.addEventListener('click', handleProductClose, true);
    document.addEventListener('click', handleProductClose, true);

    if (!document.getElementById('selfles-global-title-product-entry-style')) {
      var style = document.createElement('style');
      style.id = 'selfles-global-title-product-entry-style';
      style.textContent = ''
        + 'html.selfles-product-navigation-pending .t-popup_show .t-store__product-popup,'
        + 'html.selfles-product-navigation-pending .t-popup_show .t-store__prod-popup{'
        + 'opacity:0!important;pointer-events:none!important;'
        + '}';
      document.head.appendChild(style);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyGlobalFixes);
    } else {
      applyGlobalFixes();
    }

    window.addEventListener('load', function () {
      applyGlobalFixes();
      setTimeout(applyGlobalFixes, 300);
      setTimeout(applyGlobalFixes, 900);
      setTimeout(applyGlobalFixes, 1500);
    });

    if ('MutationObserver' in window && document.body) {
      new MutationObserver(scheduleGlobalFixes).observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
      });
    }

    try {
      window.selflesApplyTitleBacktickCleaner = applyTitleBacktickCleaner;
      window.selflesApplyGlobalProductEntryFixes = applyGlobalFixes;
    } catch (e) {}
  })();
</script>
