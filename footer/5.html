<script>
    (function () {
        var INIT_ATTR = 'data-selfles-product-popup-hotfix-v2';
        var BACK_URL_KEY = 'selflesProductBackUrl';

        if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
        document.documentElement.setAttribute(INIT_ATTR, '1');

        var timer = null;

        function all(selector, root) {
            return Array.prototype.slice.call((root || document).querySelectorAll(selector));
        }

        function closest(node, selector) {
            return node && node.closest ? node.closest(selector) : null;
        }

        function normalizePath(value) {
            var url;
            var path;

            try {
                url = new URL(value || location.href, location.href);
            } catch (e) {
                return '';
            }

            if (url.origin !== location.origin) return '';

            path = url.pathname.replace(/\/+$/, '') || '/';

            if (path === '/page136595006.html') path = '/catalog';
            if (path === '/page94832776.html') path = '/';

            return path + url.search + url.hash;
        }

        function isProductPath(value) {
            var path = normalizePath(value).split('?')[0].split('#')[0];

            return path.indexOf('/tproduct/') !== -1 ||
                path.indexOf('/catalog/tproduct/') !== -1 ||
                path.indexOf('/product/') !== -1;
        }

        function getBackUrl() {
            var stored = '';

            try {
                stored = sessionStorage.getItem(BACK_URL_KEY) || '';
            } catch (e) {}

            stored = normalizePath(stored);

            if (stored && !isProductPath(stored)) return stored;

            if (document.referrer) {
                stored = normalizePath(document.referrer);
                if (stored && !isProductPath(stored)) return stored;
            }

            return '/catalog';
        }

        function rememberCurrentPage() {
            var current = normalizePath(location.href);

            if (!current || isProductPath(current)) return;

            try {
                sessionStorage.setItem(BACK_URL_KEY, current);
            } catch (e) {}
        }

        function rememberFromCard(event) {
            var card;

            if (!event || !event.target) return;

            card = closest(event.target, [
                '.js-product.t-store__card',
                '.t-store__card',
                '.selfles-related-card',
                '[data-product-url]'
            ].join(','));

            if (!card) return;
            if (closest(event.target, '.t-store__prod-popup, .t-store__product-popup, .t-popup, .t706, .t-store__cart')) return;

            rememberCurrentPage();
        }

        function handleClose(event) {
            var close;

            if (!event || !event.target) return;

            close = closest(event.target, [
                '.t-popup__close',
                '.t-store__prod-popup__close-txt-wr',
                '.t-store__prod-popup__close-txt',
                '.js-store-close-text',
                '[data-selfles-product-back]'
            ].join(','));

            if (!close) return;

            if (!closest(close, '.t-popup, .t-store__prod-popup, .t-store__product-popup') && !isProductPath(location.href)) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            location.assign(getBackUrl());
        }

        function setButtonText(button) {
            var label;
            var value;

            if (!button) return;

            label = button.querySelector('.t-btnflex__text, .t-btn__text, span, div');
            value = (label || button).textContent || '';

            if (
                !value.trim() ||
                /_?buy\s*now_?/i.test(value) ||
                /add\s*to\s*cart/i.test(value) ||
                /купить/i.test(value)
            ) {
                (label || button).textContent = 'в корзину';
            }
        }

        function styleButtons(root) {
            all([
                '.t-store__prod-popup__btn',
                '.t-store__prod__btn',
                '.js-store-prod-popup-buy-btn',
                '.t-store__prod-popup__btn-wrapper .t-btn',
                '.t-store__prod__btn-wrapper .t-btn',
                '.js-store-prod-popup-buy-btn-wrapper .t-btn'
            ].join(','), root || document).forEach(function (button) {
                if (closest(button, '.t706, .t-store__cart')) return;
                setButtonText(button);
                button.classList.add('selfles-product-buy-button-fixed');
                button.style.setProperty('background-color', '#EE413C', 'important');
                button.style.setProperty('background', '#EE413C', 'important');
                button.style.setProperty('border-color', '#EE413C', 'important');
                button.style.setProperty('color', '#fff', 'important');
                button.style.setProperty('border-radius', '80px', 'important');
            });
        }

        function hideMeta(root) {
            all([
                '.t-store__prod-popup__sku',
                '.t-store__prod__sku',
                '.js-product-sku',
                '.js-store-prod-sku',
                '.t-store__prod-popup__properties',
                '.t-store__prod__properties',
                '.t-store__prod-popup__charcs',
                '.t-store__prod__charcs',
                '.js-store-prod-all-charcs',
                '.js-store-prod-dimensions',
                '.js-store-prod-weight'
            ].join(','), root || document).forEach(function (node) {
                if (closest(node, '.t-store__card') && !closest(node, '.t-store__prod-popup, .t-store__product-popup, .t-store__prod')) return;
                node.style.setProperty('display', 'none', 'important');
                node.style.setProperty('visibility', 'hidden', 'important');
            });
        }

        function fixCurrency(root) {
            all('.t-store__prod-popup__price-currency, .t-store__prod__price-currency', root || document).forEach(function (node) {
                node.textContent = '₽';
            });
        }

        function markLayout(root) {
            all('.t-store__prod-popup, .t-store__product-popup, .t-store__prod, .js-store-product.js-product', root || document).forEach(function (product) {
                var info = product.querySelector('.t-store__prod-popup__info, .t-store__prod__info, .t-store__prod-snippet__info');
                var gallery = product.querySelector('.t-store__prod-popup__slider, .t-store__prod__slider, .js-store-prod-slider, .t-store__prod-snippet__gallery');
                var parent;

                if (!info || !gallery) return;
                if (closest(product, '.t-store__card') && !closest(product, '.t-store__prod-popup, .t-store__product-popup')) return;

                document.body.classList.add('selfles-product-page');

                parent = product.querySelector('.t-store__prod-popup__container') ||
                    product.querySelector('.t-store__prod__container') ||
                    product;

                parent.classList.add('selfles-product-main-layout');
                gallery.classList.add('selfles-product-main-layout__gallery');
                info.classList.add('selfles-product-main-layout__info');
            });
        }

        function applyFix() {
            markLayout(document);
            styleButtons(document);
            hideMeta(document);
            fixCurrency(document);
        }

        function scheduleFix() {
            clearTimeout(timer);
            timer = setTimeout(applyFix, 60);
        }

        ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach(function (eventName) {
            document.addEventListener(eventName, rememberFromCard, true);
        });

        document.addEventListener('click', handleClose, true);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyFix);
        } else {
            applyFix();
        }

        window.addEventListener('load', function () {
            applyFix();
            setTimeout(applyFix, 250);
            setTimeout(applyFix, 750);
            setTimeout(applyFix, 1500);
        });

        if ('MutationObserver' in window && document.documentElement) {
            new MutationObserver(scheduleFix).observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class', 'style', 'disabled', 'href']
            });
        }

        window.selflesProductPopupHotfixApply = applyFix;
    })();
</script>
