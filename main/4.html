    function isStaticProductAvailable(product) {
      const quantity = product && product.quantity;

      if (quantity === '' || quantity === null || quantity === undefined) return true;
      if (/^(notlimited|unlimited)$/i.test(String(quantity))) return true;

      return Number(String(quantity).replace(',', '.')) > 0;
    }

    function publishStaticProductsFallback() {
      const availableProducts = {};

      window.SELFLES_STATIC_PRODUCTS_BY_SKU = Object.assign(
              {},
              window.SELFLES_STATIC_PRODUCTS_BY_SKU || {},
              STATIC_CONSTRUCTOR_PRODUCTS_BY_SKU
      );
      window.SELFLES_ALL_PRODUCTS_BY_SKU = Object.assign(
              {},
              window.SELFLES_STATIC_PRODUCTS_BY_SKU,
              window.SELFLES_ALL_PRODUCTS_BY_SKU || {}
      );

      if (!window.SELFLES_PRODUCTS_BY_SKU || !Object.keys(window.SELFLES_PRODUCTS_BY_SKU).length) {
        Object.keys(STATIC_CONSTRUCTOR_PRODUCTS_BY_SKU).forEach(function (sku) {
          const product = STATIC_CONSTRUCTOR_PRODUCTS_BY_SKU[sku];

          if (isStaticProductAvailable(product)) availableProducts[sku] = product;
        });
        window.SELFLES_PRODUCTS_BY_SKU = availableProducts;
      }

      try {
        window.dispatchEvent(new CustomEvent('selfles:products-manifest-ready', {
          detail: {
            source: 'constructor-static-fallback',
            productsCount: Object.keys(window.SELFLES_PRODUCTS_BY_SKU || {}).length,
            allProductsCount: Object.keys(window.SELFLES_ALL_PRODUCTS_BY_SKU || {}).length,
            staticManifest: true
          }
        }));
      } catch (e) {
      }
    }

    publishStaticProductsFallback();

    function getMergedProductsManifest() {
      return Object.assign({}, STATIC_CONSTRUCTOR_PRODUCTS_BY_SKU, window.SELFLES_ALL_PRODUCTS_BY_SKU || {}, window.SELFLES_PRODUCTS_BY_SKU || {});
    }

    function getManifestProductUidList() {
      const manifest = getMergedProductsManifest();
      return Object.keys(manifest).map(function (sku) {
        const item = manifest[sku] || {};
        return String(firstNotEmpty(
                item.tildaUid,
                item.uid,
                item.product_uid,
                item.gen_uid,
                item['Tilda UID']
        ) || '').trim();
      }).filter(Boolean);
    }

    function getManifestSkuByUid(uid) {
      const cleanUid = String(uid || '').trim();
      const manifest = getMergedProductsManifest();

      if (!cleanUid) return '';

      for (const sku of Object.keys(manifest)) {
        const item = manifest[sku] || {};
        const itemUid = String(firstNotEmpty(
                item.tildaUid,
                item.uid,
                item.product_uid,
                item.gen_uid,
                item['Tilda UID']
        ) || '').trim();

        if (itemUid === cleanUid) {
          return canonicalConstructorSku(item.sku || sku);
        }
      }

      return '';
    }

    let catalogBlock = null;
    let CATALOG_BLOCK_ID = null;
    let PRODUCT_GEN_UIDS = [];

    function hideTechnicalCatalogBlock(block) {
      if (!block) return;

      /*
        Важно: не ставим display:none.
        Tilda может не успеть отрисовать карточки и data-product-inv,
        а конструктор из-за этого получает неполный список цветов/размеров.
        Прячем технический каталог визуально, но оставляем его в DOM-раскладке Tilda.
      */
      block.style.removeProperty('display');
      block.style.removeProperty('visibility');
      block.removeAttribute('hidden');

      block.style.setProperty('position', 'absolute', 'important');
      block.style.setProperty('left', '-99999px', 'important');
      block.style.setProperty('top', '0', 'important');
      block.style.setProperty('width', '1px', 'important');
      block.style.setProperty('height', '1px', 'important');
      block.style.setProperty('overflow', 'hidden', 'important');
      block.style.setProperty('opacity', '0', 'important');
      block.style.setProperty('pointer-events', 'none', 'important');
      block.style.setProperty('z-index', '-1', 'important');
      block.setAttribute('aria-hidden', 'true');
    }

    function findCatalogAndCollectUIDs() {
      const genUids = new Set(PRODUCT_GEN_UIDS);
      getManifestProductUidList().forEach(function (uid) {
        genUids.add(uid);
      });
      let foundInTechnicalBlocks = false;

      for (const id of CATALOG_IDS) {
        const block = document.getElementById(id);
        if (!block) continue;

        hideTechnicalCatalogBlock(block);

        const products = block.querySelectorAll('[data-product-gen-uid]');
        if (products.length > 0) {
          if (!catalogBlock) {
            catalogBlock = block;
            CATALOG_BLOCK_ID = id;
          }

          foundInTechnicalBlocks = true;

          products.forEach(p => {
            const genUid = p.getAttribute('data-product-gen-uid');
            if (genUid) genUids.add(genUid);
          });
        }
      }

      if (foundInTechnicalBlocks) {
        PRODUCT_GEN_UIDS = Array.from(genUids);
        return PRODUCT_GEN_UIDS.length > 0;
      }

      const allProducts = document.querySelectorAll('[data-product-gen-uid]');
      if (allProducts.length > 0) {
        allProducts.forEach(p => {
          const genUid = p.getAttribute('data-product-gen-uid');
          if (genUid) genUids.add(genUid);
        });
        PRODUCT_GEN_UIDS = Array.from(genUids);

        return PRODUCT_GEN_UIDS.length > 0;
      }

      if (genUids.size > 0) {
        PRODUCT_GEN_UIDS = Array.from(genUids);
        return true;
      }

      return false;
    }

    findCatalogAndCollectUIDs();

    let constructorSelectHoldUntil = 0;
    let constructorSelectDeferredTimer = null;

    function isConstructorSizeSelect(node) {
      return !!(node && node.matches && node.matches('#setConstructor .size-select'));
    }

    function holdConstructorSelectUpdates(duration) {
      constructorSelectHoldUntil = Math.max(constructorSelectHoldUntil, Date.now() + (duration || 700));
    }

    function isConstructorSelectBusy() {
      return Date.now() < constructorSelectHoldUntil || isConstructorSizeSelect(document.activeElement);
    }

    function deferConstructorUpdateWhileSelectBusy(callback) {
      if (!isConstructorSelectBusy()) return false;

      clearTimeout(constructorSelectDeferredTimer);
      constructorSelectDeferredTimer = setTimeout(function retryDeferredConstructorUpdate() {
        if (isConstructorSelectBusy()) {
          constructorSelectDeferredTimer = setTimeout(retryDeferredConstructorUpdate, 250);
          return;
        }
        callback();
      }, 300);

      return true;
    }

    function bindConstructorSelectGuard() {
      if (document.documentElement.getAttribute('data-selfles-constructor-select-guard') === '1') return;
      document.documentElement.setAttribute('data-selfles-constructor-select-guard', '1');

      ['pointerdown', 'mousedown', 'touchstart', 'focusin', 'keydown'].forEach(function (eventName) {
        document.addEventListener(eventName, function (event) {
          if (isConstructorSizeSelect(event.target)) holdConstructorSelectUpdates(1200);
        }, true);
      });

      document.addEventListener('change', function (event) {
        if (isConstructorSizeSelect(event.target)) holdConstructorSelectUpdates(250);
      }, true);

      document.addEventListener('blur', function (event) {
        if (isConstructorSizeSelect(event.target)) holdConstructorSelectUpdates(250);
      }, true);
    }

    bindConstructorSelectGuard();

    function closeCustomSizeSelect(shell) {
      if (!shell) return;
      shell.classList.remove('selfles-size-open');
      const trigger = shell.querySelector('.selfles-size-trigger');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
    }

    function closeOtherCustomSizeSelects(exceptShell) {
      document.querySelectorAll('#setConstructor .size.selfles-size-open').forEach(function (shell) {
        if (shell !== exceptShell) closeCustomSizeSelect(shell);
      });
    }

    function syncCustomSizeSelect(select) {
      if (!select || !select._selflesCustomSize) return;

      const parts = select._selflesCustomSize;
      const selected = select.options[select.selectedIndex] || select.options[0];
      parts.trigger.textContent = selected ? selected.textContent : '';
      parts.menu.innerHTML = '';

      Array.from(select.options).forEach(function (option) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'selfles-size-option';
        button.textContent = option.textContent;
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', option.value === select.value ? 'true' : 'false');
        button.dataset.value = option.value;

        if (option.value === select.value) button.classList.add('is-active');
        if (option.disabled) {
          button.disabled = true;
          button.setAttribute('aria-disabled', 'true');
        }

        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          if (button.disabled) return;

          select.value = option.value;
          closeCustomSizeSelect(parts.shell);
          select.dispatchEvent(new Event('change', {bubbles: true}));
          syncCustomSizeSelect(select);
        });

        parts.menu.appendChild(button);
      });
    }

    function enhanceConstructorSizeSelect(select) {
      let shell;
      let trigger;
      let menu;

      if (!select || select._selflesCustomSize) {
        syncCustomSizeSelect(select);
        return;
      }

      ensureCustomSizeSelectStyles();

      shell = select.closest('.size');
      if (!shell) return;

      if (shell.tagName && shell.tagName.toLowerCase() === 'label') {
        const replacement = document.createElement('div');
        replacement.className = shell.className;
        shell.parentNode.insertBefore(replacement, shell);
        replacement.appendChild(select);
        shell.remove();
        shell = replacement;
      }

      shell.classList.add('selfles-size-shell');
      select.classList.add('selfles-native-size-select');
      select.setAttribute('tabindex', '-1');
      select.setAttribute('aria-hidden', 'true');

      trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'selfles-size-trigger';
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');
      trigger.setAttribute('aria-label', select.getAttribute('aria-label') || 'Выбор размера');

      menu = document.createElement('div');
      menu.className = 'selfles-size-menu';
      menu.setAttribute('role', 'listbox');
      menu.setAttribute('aria-label', select.getAttribute('aria-label') || 'Выбор размера');

      shell.appendChild(trigger);
      shell.appendChild(menu);

      select._selflesCustomSize = {shell: shell, trigger: trigger, menu: menu};

      trigger.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const willOpen = !shell.classList.contains('selfles-size-open');
        closeOtherCustomSizeSelects(shell);
        shell.classList.toggle('selfles-size-open', willOpen);
        trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });

      trigger.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeCustomSizeSelect(shell);
        }
      });

      syncCustomSizeSelect(select);
    }

    if (document.documentElement.getAttribute('data-selfles-custom-size-close') !== '1') {
      document.documentElement.setAttribute('data-selfles-custom-size-close', '1');
      const closeSizeSelectOnOutsideTouch = function (event) {
        if (event.target.closest && event.target.closest('#setConstructor .size.selfles-size-shell')) return;
        closeOtherCustomSizeSelects(null);
      };
      document.addEventListener('pointerdown', closeSizeSelectOnOutsideTouch, true);
      document.addEventListener('touchstart', closeSizeSelectOnOutsideTouch, true);
    }

    function normalizeTildaSize(value) {
      return String(value || '')
              .toLowerCase()
              .trim()
              .replace(/[x×]/g, 'х')
              .replace(/\s*х\s*/g, 'х')
              .replace(/\s+/g, '');
    }

    function normalizeTildaColor(value) {
      return String(value || '')
              .toLowerCase()
              .trim()
              .replace(/ё/g, 'е');
    }

    function firstNotEmpty() {
      for (let i = 0; i < arguments.length; i++) {
        const value = arguments[i];
        if (value !== undefined && value !== null && String(value).trim() !== '') {
          return value;
        }
      }
      return '';
    }

    function parseMoney(value) {
      if (typeof value === 'number') return value;
      return parseFloat(String(value || '0').replace(/\s/g, '').replace(',', '.')) || 0;
    }

    function cleanSku(value) {
      return String(value || '')
              .replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i, '')
              .trim()
              .toUpperCase();
    }

    function getColorByCode(code) {
      const map = {
        W: 'white',
        P: 'pink',
        G: 'green',
        C: 'coffee',
        B: 'blue',
        S: 'cream'
      };

      return map[String(code || '').toUpperCase()] || null;
    }

    function detectColorFromText(value) {
      const text = normalizeTildaColor(value);

      if (text.includes('бел')) return 'white';
      if (text.includes('розов')) return 'pink';
      if (text.includes('зелен')) return 'green';
      if (text.includes('коф')) return 'coffee';
      if (text.includes('голуб')) return 'blue';
      if (text.includes('слив')) return 'cream';

      return null;
    }

    function detectBySku(skuValue) {
      const sku = cleanSku(skuValue);
      let match = null;

      match = sku.match(/^N([WPGCBS])-?/);
      if (match) {
        return {
          productType: 'pillowcase',
          color: getColorByCode(match[1]),
          size: null
        };
      }

      match = sku.match(/^PP(150|180|220)([WPGCBS])-?/);
      if (match) {
        return {
          productType: 'duvet',
          size: match[1],
          color: getColorByCode(match[2])
        };
      }

      match = sku.match(/^PP([WPGCBS])-?/);
      if (match) {
        return {
          productType: 'duvet',
          size: '200',
          color: getColorByCode(match[1])
        };
      }

      match = sku.match(/^P(160|180)([WPGCBS])-?/);
      if (match) {
        return {
          productType: 'sheet',
          size: match[1],
          color: getColorByCode(match[2])
        };
      }

      match = sku.match(/^P(KS|EUR)([WPGCBS])-?/);
      if (match) {
        return {
          productType: 'sheet',
          size: match[1],
          color: getColorByCode(match[2])
        };
      }

      return {
        productType: null,
        color: null,
        size: null
      };
    }

    function detectProductType(title, sku) {
      const titleLower = String(title || '').toLowerCase();
      const skuUpper = cleanSku(sku);

      if (skuUpper.startsWith('PP') || titleLower.includes('пододеяльник')) return 'duvet';
      if (skuUpper.startsWith('N') || titleLower.includes('наволоч')) return 'pillowcase';
      if (skuUpper.startsWith('P') || titleLower.includes('простын')) return 'sheet';

      return null;
    }

    function detectSizeFromText(productType, value) {
      const text = String(value || '')
              .toLowerCase()
              .replace(/[x×]/g, 'х')
              .replace(/\s+/g, '');

      if (productType === 'sheet') {
        if (text.includes('king') || text.includes('240х260')) return 'KS';
        if (text.includes('euro') || text.includes('евро') || text.includes('220х240')) return 'EUR';
        if (text.includes('180х200') || text.includes('180')) return '180';
        if (text.includes('160х200') || text.includes('160')) return '160';
      }

      if (productType === 'duvet') {
        if (text.includes('220х240')) return '220';
        if (text.includes('200х220')) return '200';
        if (text.includes('180х210')) return '180';
        if (text.includes('150х200')) return '150';
      }

      return null;
    }

    function getProductTitle(product) {
      return firstNotEmpty(product.title, product.name, product.product, product.product_name);
    }

    function getProductSku(product, edition) {
      return firstNotEmpty(
              edition && edition.sku,
              edition && edition.SKU,
              edition && edition.vendorCode,
              edition && edition.vendor_code,
              product.sku,
              product.SKU,
              product.vendorCode,
              product.vendor_code,
              product.product_sku
      );
    }

    function getProductUid(product, edition) {
      return String(firstNotEmpty(
              edition && edition.uid,
              edition && edition.edition_uid,
              edition && edition.gen_uid,
              product.uid,
              product.edition_uid,
              product.gen_uid,
              product.genUid,
              product.product_uid
      ));
    }

    function getProductQuantity(product, edition) {
      var values = [
        edition && edition.quantity,
        edition && edition.amount,
        edition && edition.balance,
        edition && edition.inv,
        edition && edition.inventory,
        edition && edition.stock,
        edition && edition.available,
        edition && edition['data-product-inv'],
        product.quantity,
        product.amount,
        product.balance,
        product.inv,
        product.inventory,
        product.stock,
        product.available,
        product['data-product-inv']
      ];
      var raw = null;
      var qty;
      var availability = String(firstNotEmpty(
              edition && edition.availability,
              edition && edition.available,
              product.availability,
              product.available
      ) || '').toLowerCase();

      for (var i = 0; i < values.length; i++) {
        if (values[i] !== undefined && values[i] !== null && String(values[i]).trim() !== '') {
          raw = values[i];
          break;
        }
      }

      if (raw !== null) {
        qty = Number(String(raw).replace(',', '.'));
        return isFinite(qty) ? qty : 0;
      }

      if (availability.indexOf('outofstock') !== -1 || availability === 'false') {
        return 0;
      }

      /*
        В Tilda пустой/отсутствующий остаток часто означает,
        что складской учёт для товара не ограничен, но товар доступен.
        Это та же логика, что и на странице товара/в рекомендациях.
      */
      return 99999;
    }

    function getProductPrice(product, edition) {
      return parseMoney(firstNotEmpty(
              edition && edition.price,
              product.price
      ));
    }

    function getProductImage(product, edition) {
      return firstNotEmpty(
              edition && edition.img,
              edition && edition.image,
              product.img,
              product.image,
              product.photo
      );
    }

    function registerCatalogVariant(product, edition, matchStats) {
      const title = getProductTitle(product);
      const sku = canonicalConstructorSku(getProductSku(product, edition));
      const uid = getProductUid(product, edition);

      if (!uid) {
        console.warn('[setConstructor] UID не найден:', {product, edition});
        return;
      }

      const skuInfo = detectBySku(sku);

      const productType = skuInfo.productType || detectProductType(title, sku);

      if (!productType) {
        /* Это может быть плед/другой товар из каталога — для конструктора он не нужен. */
        if (/^(P|PP|N)/.test(cleanSku(sku))) {
          console.warn('[setConstructor] Тип товара не определён:', {title, sku, product, edition});
        }
        return;
      }

      const colorRaw = firstNotEmpty(
              edition && edition['Цвет'],
              edition && edition.color,
              edition && edition.Color,
              product['Цвет'],
              product.color,
              product.Color
      );

      let color = null;

      if (colorRaw) {
        color = TILDA_COLOR_MAP[normalizeTildaColor(colorRaw)] || detectColorFromText(colorRaw);
      }

      color = color || skuInfo.color || detectColorFromText(title);

      if (!color) {
        console.warn('[setConstructor] Цвет не определён:', {
          productType,
          title,
          sku,
          colorRaw,
          product,
          edition
        });
        return;
      }

      const sizeRaw = firstNotEmpty(
              edition && edition['Размер'],
              edition && edition.size,
              edition && edition.Size,
              product['Размер'],
              product.size,
              product.Size
      );

      let size = null;

      if (productType === 'sheet') {
        size = TILDA_SIZE_MAP[normalizeTildaSize(sizeRaw)]
                || skuInfo.size
                || detectSizeFromText(productType, title + ' ' + sku + ' ' + sizeRaw);

        if (!size) {
          console.warn('[setConstructor] Размер простыни не определён:', {
            title,
            sku,
            sizeRaw,
            product,
            edition
          });
          return;
        }
      }

      if (productType === 'duvet') {
        size = TILDA_DUVET_SIZE_MAP[normalizeTildaSize(sizeRaw)]
                || skuInfo.size
                || detectSizeFromText(productType, title + ' ' + sku + ' ' + sizeRaw);

        if (!size) {
          console.warn('[setConstructor] Размер пододеяльника не определён:', {
            title,
            sku,
            sizeRaw,
            product,
            edition
          });
          return;
        }
      }

      const quantity = getProductQuantity(product, edition);
      const price = getProductPrice(product, edition);
      const img = getProductImage(product, edition);

      const source = product._selflesSource || (edition ? 'edition' : 'single-card');
      const nextRecord = {
        quantity,
        price,
        sku,
        img,
        title,
        color,
        size,
        name: title || sku,
        url: product.url || product.href || '',
        source
      };

      if (shouldReplaceStockRecord(stockCache[uid], nextRecord)) {
        stockCache[uid] = nextRecord;
      } else if (stockCache[uid]) {
        /*
          Не даём более слабому/неполному источнику затереть рабочий остаток,
          но добираем пустые поля, если они появились позже.
        */
        stockCache[uid].price = stockCache[uid].price || nextRecord.price;
        stockCache[uid].img = stockCache[uid].img || nextRecord.img;
        stockCache[uid].title = stockCache[uid].title || nextRecord.title;
        stockCache[uid].name = stockCache[uid].name || nextRecord.name;
        stockCache[uid].url = stockCache[uid].url || nextRecord.url;
        stockCache[uid].sku = stockCache[uid].sku || nextRecord.sku;
        stockCache[uid].color = stockCache[uid].color || nextRecord.color;
        stockCache[uid].size = stockCache[uid].size || nextRecord.size;
      }

      setMappedUid(productType, size, color, uid);

      matchStats[productType]++;

    }

    function isSizedItem(itemKey) {
      return itemKey === 'sheet' || itemKey === 'duvet';
    }

    function getItemSize(itemKey) {
      return isSizedItem(itemKey) ? state[itemKey].size : null;
    }

    function hasApiDataLoaded() {
      return Object.keys(stockCache).length > 0;
    }

    function hasValidApiMapping(itemKey, size) {
      if (!hasApiDataLoaded()) return false;
      if (isSizedItem(itemKey)) {
        return !!(PRODUCT_UID_MAP[itemKey] && PRODUCT_UID_MAP[itemKey][size] && Object.keys(PRODUCT_UID_MAP[itemKey][size]).length);
      }
      return !!(PRODUCT_UID_MAP[itemKey] && Object.keys(PRODUCT_UID_MAP[itemKey]).length);
    }

    function getVariant(itemKey, color, size) {
      const uid = getProductUID(itemKey, color, size);
      return uid && stockCache[uid] ? stockCache[uid] : null;
    }

    function isVariantInStock(variant) {
      return !!(variant && Number(variant.quantity) > 0);
    }

    function getAvailableSizes(itemKey) {
      if (!isSizedItem(itemKey) || !hasApiDataLoaded()) return [];
      return Object.keys(PRODUCT_UID_MAP[itemKey] || {}).filter(sizeKey => {
        const sizeMap = PRODUCT_UID_MAP[itemKey][sizeKey];
        return sizeMap && Object.keys(sizeMap).some(colorKey => {
          return isVariantInStock(getVariant(itemKey, colorKey, sizeKey));
        });
      });
    }

    function syncSizeOptions(itemKey, itemEl) {
      if (!isSizedItem(itemKey)) return;
      const select = itemEl.querySelector(itemKey === 'sheet' ? '.js-size' : '.js-size-duvet');
      if (!select) return;

      const availableSizes = getAvailableSizes(itemKey);
      const hasSizes = availableSizes.length > 0;
      const sizeList = itemKey === 'sheet' ? SHEET_SIZES : DUVET_SIZES;

      Array.from(select.options).forEach(option => {
        const baseLabel = sizeList.find(s => s.key === option.value)?.label || option.textContent.replace(/\s·\sнет в наличии$/, '');
        const isAvailable = hasApiDataLoaded() && hasSizes && availableSizes.includes(option.value);
        const nextText = isAvailable || !hasApiDataLoaded() ? baseLabel : `${baseLabel} · нет в наличии`;
        const nextDisabled = !(!hasApiDataLoaded() || !hasSizes) && !isAvailable;

        if (option.textContent !== nextText) option.textContent = nextText;
        if (option.disabled !== nextDisabled) option.disabled = nextDisabled;
      });

      enhanceConstructorSizeSelect(select);
      syncCustomSizeSelect(select);
    }

    function getFirstAvailableSize(itemKey) {
      const availableSizes = getAvailableSizes(itemKey);
      return availableSizes.length ? availableSizes[0] : null;
    }

    function getLastValidSize(itemKey) {
      return state[itemKey].lastValidSize || getFirstAvailableSize(itemKey) || state[itemKey].size;
    }

    function updateAddToCartState() {
      const addBtn = document.getElementById('addToCart');
      if (!addBtn) return;

      const hasReadySelection = Object.keys(state).some(itemKey => {
        const itemState = state[itemKey];
        if (!itemState.enabled || !itemState.qty || !itemState.color) return false;
        return isVariantInStock(getVariant(itemKey, itemState.color, getItemSize(itemKey)));
      });

      addBtn.disabled = !hasReadySelection;
      addBtn.setAttribute('aria-disabled', String(!hasReadySelection));
      addBtn.style.opacity = hasReadySelection ? '1' : '0.5';
      addBtn.style.cursor = hasReadySelection ? 'pointer' : 'not-allowed';
    }

    const stockCache = {};

    const PRODUCT_UID_MAP = {
      pillowcase: {},
      duvet: {},
      sheet: {}
    };

    function getConstructorSourceRank(source) {
      const sourceRank = {
        manifest: 1,
        api: 2,
        edition: 2,
        dom: 4,
        'single-card': 4
      };

      return sourceRank[source] || 1;
    }

    function shouldReplaceStockRecord(existing, candidate) {
      if (!candidate) return false;
      if (!existing) return true;

      const existingQty = Number(existing.quantity) || 0;
      const candidateQty = Number(candidate.quantity) || 0;
      const existingRank = getConstructorSourceRank(existing.source);
      const candidateRank = getConstructorSourceRank(candidate.source);

      /*
        API/manifest не должны гасить рабочий остаток положительного DOM/manifest,
        если пришли раньше полного рендера Tilda и принесли quantity: 0.
        Реальный DOM-каталог при этом всё равно может перебить запись на 0,
        если карточка Tilda действительно помечена как нет в наличии.
      */
      if (candidateQty <= 0 && existingQty > 0 && candidateRank < 4) return false;

      if (candidateRank > existingRank) return true;
      if (candidateRank < existingRank) return false;

      if (candidateQty > 0 && existingQty <= 0) return true;
      if (candidateQty <= 0 && existingQty > 0) return false;

      return false;
    }

    function shouldReplaceMappedUid(existingUid, candidateUid) {
      if (!existingUid) return true;
      if (existingUid === candidateUid) return true;

      return shouldReplaceStockRecord(stockCache[existingUid], stockCache[candidateUid]);
    }

    function setMappedUid(productType, size, color, uid) {
      if (productType === 'sheet' || productType === 'duvet') {
        if (!PRODUCT_UID_MAP[productType][size]) PRODUCT_UID_MAP[productType][size] = {};

        const existingUid = PRODUCT_UID_MAP[productType][size][color];

        if (shouldReplaceMappedUid(existingUid, uid)) {
          PRODUCT_UID_MAP[productType][size][color] = uid;
        }

        return;
      }

      const existingUid = PRODUCT_UID_MAP[productType][color];

      if (shouldReplaceMappedUid(existingUid, uid)) {
        PRODUCT_UID_MAP[productType][color] = uid;
      }
    }

    function canonicalConstructorSku(value) {
      const clean = cleanSku(value);
      const aliases = window.SELFLES_SKU_ALIASES || {};
      return cleanSku(aliases[clean] || clean);
    }

    function getCardSku(card) {
      const skuEl = card && card.querySelector('.js-product-sku, .js-store-prod-sku, .t-store__card__sku');

      if (skuEl && String(skuEl.textContent || '').trim()) {
        return canonicalConstructorSku(skuEl.textContent);
      }

      return getManifestSkuByUid(firstNotEmpty(
              card && card.getAttribute('data-product-gen-uid'),
              card && card.getAttribute('data-product-uid'),
              card && card.getAttribute('data-product-lid')
      ));
    }

    function getCardTitle(card) {
      const titleEl = card && card.querySelector('.js-product-name, .js-store-prod-name, .t-store__card__title');
      return titleEl ? String(titleEl.textContent || '').trim() : '';
    }

    function getCardPrice(card) {
      const priceEl = card && card.querySelector('.js-product-price, .js-store-prod-price-val, .t-store__card__price-value, .t-store__card__price');
      return priceEl ? parseMoney(priceEl.textContent) : 0;
    }

    function extractCardImage(card) {
      const img = card && card.querySelector('img[src], img[data-original], .t-store__card__img[data-original], [data-original]');
      const bgNode = card && card.querySelector('[style*="background-image"]');
      const bg = bgNode && bgNode.style ? bgNode.style.backgroundImage.match(/url\(["']?([^"')]+)["']?\)/) : null;

      return (img && (img.getAttribute('data-original') || img.getAttribute('src'))) || (bg && bg[1]) || '';
    }

    function getCardUrl(card) {
      const link = card && card.querySelector('a[href]');
      return (card && card.getAttribute('data-product-url')) || (link ? link.getAttribute('href') : '') || '';
    }

    function isExplicitlySoldOutCard(card) {
      const text = String(card && card.textContent || '')
              .replace(/\s+/g, ' ')
              .trim()
              .toLowerCase();

      return !!(card && (
              card.classList.contains('selfles-card-sold-out') ||
              card.classList.contains('t-store__card_sold-out') ||
              card.querySelector('.js-store-prod-sold-out, .t-store__card__sold-out-msg, .t-store__prod-popup__sold-out, .t-store__prod__sold-out') ||
              text === 'нет в наличии'
      ));
    }

    function getCardQuantity(card, fallbackQuantity) {
      const hasInv = card && card.hasAttribute('data-product-inv');
      const rawInv = hasInv ? String(card.getAttribute('data-product-inv') || '').trim() : '';
      const availability = card ? card.querySelector('[itemprop="availability"]') : null;
      const availabilityHref = availability ? String(availability.getAttribute('href') || '').toLowerCase() : '';
      let qty;

      if (hasInv && rawInv !== '') {
        qty = Number(rawInv.replace(',', '.'));
        return isFinite(qty) ? qty : 0;
      }

      if (isExplicitlySoldOutCard(card) || availabilityHref.indexOf('outofstock') !== -1) {
        return 0;
      }

      /* Пустой data-product-inv="" у Tilda = товар доступен без ограниченного остатка. */
      if (hasInv && rawInv === '') {
        return 99999;
      }

      if (availabilityHref.indexOf('instock') !== -1) {
        return 99999;
      }

      qty = Number(fallbackQuantity || 0);
      return isFinite(qty) ? qty : 0;
    }

    function loadProductsFromManifest() {
      const manifest = getMergedProductsManifest();
      const matchStats = {pillowcase: 0, duvet: 0, sheet: 0};
      let count = 0;

      Object.keys(manifest).forEach(skuKey => {
        const item = manifest[skuKey] || {};
        const sku = canonicalConstructorSku(item.sku || skuKey);
        const parsed = detectBySku(sku);

        if (!sku || !parsed.productType) return;

        registerCatalogVariant({
          uid: firstNotEmpty(item.tildaUid, item.uid, item.product_uid, item.gen_uid, sku),
          sku: sku,
          title: firstNotEmpty(item.fullTitle, item.title),
          price: getProductPrice(item, null),
          img: firstNotEmpty(item.image, item.img, item.photo),
          quantity: getProductQuantity(item, null),
          color: item.color,
          size: item.size,
          url: item.url,
          _selflesSource: 'manifest'
        }, null, matchStats);
        count++;
      });

      if (count) {
        window.SELFLES_STOCK_DEBUG = {PRODUCT_GEN_UIDS, PRODUCT_UID_MAP, stockCache};
      }

      return count > 0;
    }

    function loadProductsFromCatalogDom() {
      const matchStats = {pillowcase: 0, duvet: 0, sheet: 0};
      const seen = new Set();
      let count = 0;
      const selectors = [];

      CATALOG_IDS.forEach(id => {
        selectors.push('#' + id + ' .js-product.t-store__card');
        selectors.push('#' + id + ' .t-store__card');
      });

      selectors.push('.js-product.t-store__card:not(.js-product-relevant)');
      selectors.push('.t-store__card:not(.js-product-relevant)');

      document.querySelectorAll(selectors.join(',')).forEach(card => {
        const sku = getCardSku(card);
        const uid = String(firstNotEmpty(
                card.getAttribute('data-product-gen-uid'),
                card.getAttribute('data-product-uid'),
                card.getAttribute('data-product-lid'),
                sku
        ));

        if (!sku || !uid || seen.has(uid + ':' + sku)) return;
        seen.add(uid + ':' + sku);

        registerCatalogVariant({
          uid: uid,
          sku: sku,
          title: getCardTitle(card),
          price: getCardPrice(card),
          img: extractCardImage(card),
          quantity: getCardQuantity(card, 0),
          url: getCardUrl(card),
          _selflesSource: 'single-card'
        }, null, matchStats);
        count++;
      });

      if (count) {
        window.SELFLES_STOCK_DEBUG = {PRODUCT_GEN_UIDS, PRODUCT_UID_MAP, stockCache};
      }

      return count > 0;
    }

    function bootstrapProductDataFromPage() {
      const fromManifest = loadProductsFromManifest();
      const fromDom = loadProductsFromCatalogDom();
      return fromManifest || fromDom;
    }

    async function loadProductsFromTildaAPI() {
      if (typeof window.t_cart__loadProductsInfoById !== 'function') {
        return false;
      }

      if (PRODUCT_GEN_UIDS.length === 0) {
        return false;
      }

      try {
        const result = await window.t_cart__loadProductsInfoById(PRODUCT_GEN_UIDS);
        const matchStats = {
          pillowcase: 0,
          duvet: 0,
          sheet: 0
        };

        if (!result || !result.products || result.products.length === 0) {
          console.warn('[setConstructor] API вернул пустой результат');
          return false;
        }

        /*
          Не очищаем весь кэш перед API.
          t_cart__loadProductsInfoById иногда приходит раньше, чем технический каталог
          успел собрать все PRODUCT_GEN_UIDS. Если очистить кэш здесь, после reload
          остаётся только часть вариантов, и цвета/размеры снова блокируются.
        */

        result.products.forEach(product => {
          const editions = Array.isArray(product.editions) ? product.editions : [];

          if (editions.length > 0) {
            product._selflesSource = 'api';
            editions.forEach(edition => {
              registerCatalogVariant(product, edition, matchStats);
            });
            return;
          }

          product._selflesSource = 'api';
          registerCatalogVariant(product, null, matchStats);
        });

        loadProductsFromCatalogDom();

        const sheetStock = {};
        for (const size of Object.keys(PRODUCT_UID_MAP.sheet)) {
          sheetStock[size] = {};
          for (const color of Object.keys(PRODUCT_UID_MAP.sheet[size])) {
            const uid = PRODUCT_UID_MAP.sheet[size][color];
            sheetStock[size][color] = stockCache[uid] ? stockCache[uid].quantity : 'no data';
          }
        }
        const duvetStock = {};
        for (const size of Object.keys(PRODUCT_UID_MAP.duvet)) {
          duvetStock[size] = {};
          for (const color of Object.keys(PRODUCT_UID_MAP.duvet[size])) {
            const uid = PRODUCT_UID_MAP.duvet[size][color];
            duvetStock[size][color] = stockCache[uid] ? stockCache[uid].quantity : 'no data';
          }
        }

        window.SELFLES_STOCK_DEBUG = {
          PRODUCT_GEN_UIDS,
          PRODUCT_UID_MAP,
          stockCache
        };

        return true;
      } catch (e) {
        console.error('[setConstructor] Ошибка загрузки данных из API:', e);
        return false;
      }
    }

    function getProductUID(itemKey, color, size) {
      if (isSizedItem(itemKey)) {
        return PRODUCT_UID_MAP[itemKey][size] && PRODUCT_UID_MAP[itemKey][size][color];
      }
      return PRODUCT_UID_MAP[itemKey] && PRODUCT_UID_MAP[itemKey][color];
    }

    function getProductStock(itemKey, color, size) {
      const uid = getProductUID(itemKey, color, size);
      if (!uid || !stockCache[uid]) return null;
      return stockCache[uid].quantity || 0;
    }

    function isProductAvailable(itemKey, color, size) {
      if (!hasApiDataLoaded()) {
        return false;
      }
      return isVariantInStock(getVariant(itemKey, color, size));
    }

    function getAvailableColors(itemKey, size) {
      if (!hasApiDataLoaded()) {
        return [];
      }

      return COLORS
              .map(c => c.key)
              .filter(color => {
                return isProductAvailable(itemKey, color, size);
              });
    }

    function getFirstAvailableColor(itemKey, size) {
      const available = getAvailableColors(itemKey, size);
      if (available.length > 0) {
        return available[0];
      }
      return null;
    }

    const state = {
      pillowcase: {enabled: false, color: '', qty: 0},
      sheet: {enabled: false, color: '', qty: 0, size: '160', lastValidSize: ''},
      duvet: {enabled: false, color: '', qty: 0, size: '200', lastValidSize: ''}
    };

    const root = document.getElementById('setConstructor');
    if (!root) {
      console.warn('Элемент #setConstructor не найден');
      return;
    }

    const imgLayers = {
      pillowcase: document.getElementById('img-pillowcase'),
      sheet: document.getElementById('img-sheet'),
      duvet: document.getElementById('img-duvet')
    };
    Object.values(imgLayers).forEach(img => {
      if (img && !img.dataset.defaultSrc) {
        img.dataset.defaultSrc = img.src || '';
      }
    });

    const fmt = new Intl.NumberFormat('ru-RU');

    function recalcTotal() {
      let sum = 0;
      for (const key of Object.keys(state)) {
        const s = state[key];
        if (!s.enabled) continue;
        const size = isSizedItem(key) ? s.size : null;
        if (!isProductAvailable(key, s.color, size)) continue;

        const variant = getVariant(key, s.color, size);
        if (!variant) continue;
        const price = Number(variant.price) || 0;

        sum += price * (s.qty || 0);
      }
      const el = document.getElementById('totalSum');
      if (el) el.textContent = fmt.format(sum) + ' ₽';
      updateAddToCartState();
    }

    function addProductViaCatalog(itemKey, color, size, quantity) {
      if (typeof window.tcart__addProduct !== 'function') {
        console.warn('tcart__addProduct не найдена');
        return;
      }

      const uid = getProductUID(itemKey, color, size);
      const variant = getVariant(itemKey, color, size);
      if (!uid || !variant) {
        console.warn(`Вариант не найден в каталоге: ${itemKey}, цвет: ${color}${size ? ', размер: ' + size : ''}`);
        return;
      }

      window.tcart__addProduct({
        uid,
        name: variant.name,
        price: variant.price,
        sku: variant.sku,
        img: variant.img,
        quantity: quantity || 1
      });
    }

    function updateColorAvailability(itemKey, size) {
      const itemEl = root.querySelector(`.item[data-item="${itemKey}"]`);
      if (!itemEl) return;

      const sw = itemEl.querySelector('.swatches');
      if (!sw) return;

      if (!sw.hasAttribute('data-cursor-handlers-added')) {

        sw.addEventListener('mouseover', function (e) {
          const target = e.target;
          if (target && target.classList.contains('swatch') &&
                  (target.disabled || target.hasAttribute('aria-disabled') || target.hasAttribute('data-unavailable'))) {
            target.style.setProperty('cursor', 'not-allowed', 'important');
            sw.style.setProperty('cursor', 'not-allowed', 'important');
          } else if (target && target.classList.contains('swatch')) {
            sw.style.setProperty('cursor', 'default', 'important');
          }
        });
        sw.addEventListener('mouseout', function (e) {
          const target = e.target;
          if (target && target.classList.contains('swatch')) {
            sw.style.setProperty('cursor', 'default', 'important');
          }
        });
        sw.setAttribute('data-cursor-handlers-added', 'true');
      }

      const availableColors = getAvailableColors(itemKey, size);

      sw.querySelectorAll('.swatch').forEach(btn => {
        const colorKey = btn.dataset.color;
        const isAvailable = availableColors.includes(colorKey);

        if (isAvailable) {

          btn.disabled = false;
          btn.removeAttribute('disabled');
          btn.removeAttribute('aria-disabled');
          btn.removeAttribute('data-unavailable');
          btn.style.setProperty('cursor', 'pointer', 'important');
          btn.style.opacity = '1';
          btn.style.setProperty('pointer-events', 'auto', 'important');
        } else {
          btn.disabled = true;
          btn.setAttribute('aria-disabled', 'true');
          btn.setAttribute('data-unavailable', 'true');
          btn.setAttribute('aria-selected', 'false');
          btn.style.setProperty('cursor', 'not-allowed', 'important');
          btn.style.opacity = '0.3';
          btn.style.setProperty('pointer-events', 'auto', 'important');
        }
      });

      updateQtyAvailability(itemKey, size);
    }

    function updateQtyAvailability(itemKey, size) {
      const itemEl = root.querySelector(`.item[data-item="${itemKey}"]`);
      if (!itemEl) return;

      const currentColor = state[itemKey].color;
      const isAvailable = isProductAvailable(itemKey, currentColor, size);

      const qtyInput = itemEl.querySelector('.js-qty');
      const decBtn = itemEl.querySelector('.js-qty-dec');
      const incBtn = itemEl.querySelector('.js-qty-inc');

      if (!isAvailable) {
        if (qtyInput) {
          qtyInput.disabled = true;
          qtyInput.setAttribute('aria-disabled', 'true');
          qtyInput.value = 0;
          state[itemKey].qty = 0;
          state[itemKey].enabled = false;
        }
        if (decBtn) {
          decBtn.disabled = true;
          decBtn.setAttribute('aria-disabled', 'true');
        }
        if (incBtn) {
          incBtn.disabled = true;
          incBtn.setAttribute('aria-disabled', 'true');
        }
        updateLayer(itemKey);
        updateControls(itemKey, itemEl);
      } else {
        if (qtyInput) {
          qtyInput.disabled = false;
          qtyInput.removeAttribute('aria-disabled');
          if (state[itemKey].qty === 0) {
            state[itemKey].qty = 1;
            qtyInput.value = 1;
            state[itemKey].enabled = true;
          }
        }
        if (decBtn) {
          decBtn.disabled = false;
          decBtn.removeAttribute('aria-disabled');
        }
        if (incBtn) {
          incBtn.disabled = false;
          incBtn.removeAttribute('aria-disabled');
        }
        updateLayer(itemKey);
        updateControls(itemKey, itemEl);
      }

      recalcTotal();
    }

    function updateControls(itemKey, itemEl) {
      const enabled = state[itemKey].enabled;
      const el = itemEl || root.querySelector(`.item[data-item="${itemKey}"]`);
      if (!el) return;

      const size = getItemSize(itemKey);
      const isAvailable = isProductAvailable(itemKey, state[itemKey].color, size);

      if (isAvailable) {
        el.querySelectorAll('.js-qty, .js-qty-dec, .js-qty-inc').forEach(ctrl => {
          ctrl.disabled = false;
          ctrl.removeAttribute('disabled');
          ctrl.removeAttribute('aria-disabled');
        });
      } else {

        el.querySelectorAll('.js-qty, .js-qty-dec').forEach(ctrl => {
          ctrl.disabled = !enabled;
          ctrl.setAttribute('aria-disabled', String(!enabled));
        });
        const plus = el.querySelector('.js-qty-inc');
        if (plus) {
          plus.disabled = false;
          plus.removeAttribute('aria-disabled');
        }
      }
    }

    function selectColor(itemKey, colorKey, swWrap) {
      const size = getItemSize(itemKey);
      const previousColor = state[itemKey].color;

      const isAvailable = isProductAvailable(itemKey, colorKey, size);
      if (!isAvailable) {
        console.warn(`[setConstructor] Цвет ${colorKey} недоступен для ${itemKey}`);
        return;
      }

      state[itemKey].color = colorKey;
      swWrap.querySelectorAll('.swatch').forEach(b =>
              b.setAttribute('aria-selected', b.dataset.color === colorKey ? 'true' : 'false')
      );

      if (previousColor !== colorKey && isAvailable) {
        state[itemKey].qty = 1;
        state[itemKey].enabled = true;
        const itemEl = root.querySelector(`.item[data-item="${itemKey}"]`);
        if (itemEl) {
          const qtyInput = itemEl.querySelector('.js-qty');
          if (qtyInput) qtyInput.value = 1;
        }
      }

      updateLayer(itemKey);
      updateQtyAvailability(itemKey, size);
      recalcTotal();
    }

    function updateLayer(itemKey) {
      const img = imgLayers[itemKey];
      if (!img) return;

      const color = state[itemKey].color;

      const layerUrl =
              color &&
              IMAGE_LAYERS[itemKey] &&
              IMAGE_LAYERS[itemKey][color]
                      ? IMAGE_LAYERS[itemKey][color]
                      : (img.dataset.defaultSrc || '');

      if (layerUrl) {
        if ((img.getAttribute('src') || '') !== layerUrl) {
          img.setAttribute('src', layerUrl);
        }
        if (!img.classList.contains('layer-visible')) img.classList.add('layer-visible');
      } else {
        img.classList.remove('layer-visible');
      }
    }

    function initializeItems() {
      const duvetItem = root.querySelector('.item[data-item="duvet"]');
      if (duvetItem && !duvetItem.querySelector('.js-size-duvet')) {
        const itemHead = duvetItem.querySelector('.item-head');
        if (itemHead) {
          itemHead.insertAdjacentHTML('afterend', '<label class="size"><select class="size-select js-size-duvet" aria-label="Размер пододеяльника"><option value="150">150 × 200</option><option value="180">180 × 210</option><option value="200">200 × 220</option><option value="220">220 × 240</option></select></label>');
        }
      }
      root.querySelectorAll('.item').forEach(item => {
        const key = item.dataset.item;
        const sw = item.querySelector('.swatches');
        const qtyInput = item.querySelector('.js-qty');
        const dec = item.querySelector('.js-qty-dec');
        const inc = item.querySelector('.js-qty-inc');
        if (!sw || !qtyInput || !dec || !inc) return;

        if (item.hasAttribute('data-ui-initialized')) {
          syncSizeOptions(key, item);
          updateColorAvailability(key, getItemSize(key));
          updateControls(key, item);
          return;
        }

        sw.innerHTML = COLORS.map(c =>
                `<button class="swatch" type="button" data-color="${c.key}" title="${c.label}" style="background:${c.hex}"></button>`
        ).join('');

        sw.querySelectorAll('.swatch').forEach(btn => {
          btn.disabled = false;
          btn.removeAttribute('disabled');
          btn.removeAttribute('aria-disabled');
          btn.removeAttribute('data-unavailable');
          btn.style.setProperty('cursor', 'pointer', 'important');
          btn.style.opacity = '1';
          btn.style.setProperty('pointer-events', 'auto', 'important');
        });

        if (qtyInput) {
          qtyInput.disabled = false;
          qtyInput.removeAttribute('disabled');
          qtyInput.removeAttribute('aria-disabled');
        }
        if (dec) {
          dec.disabled = false;
          dec.removeAttribute('disabled');
          dec.removeAttribute('aria-disabled');
        }
        if (inc) {
          inc.disabled = false;
          inc.removeAttribute('disabled');
          inc.removeAttribute('aria-disabled');
        }

        syncSizeOptions(key, item);
        updateColorAvailability(key, getItemSize(key));

        const size = getItemSize(key);
        const firstAvailable = getFirstAvailableColor(key, size);
        if (firstAvailable) {
          state[key].color = firstAvailable;
          selectColor(key, state[key].color, sw);
        } else {

          state[key].color = '';
          state[key].enabled = false;
          state[key].qty = 0;
          qtyInput.value = 0;
          updateLayer(key);
          updateControls(key, item);
        }

        sw.addEventListener('click', e => {
          const btn = e.target.closest('.swatch');
          if (!btn || !btn.classList.contains('swatch')) return;

          const colorKey = btn.dataset.color;
          if (!colorKey) return;

          const size = getItemSize(key);
          const isAvailable = isProductAvailable(key, colorKey, size);
          if (!isAvailable) {
            console.warn(`[setConstructor] Клик по недоступному цвету ${colorKey}`);
            e.preventDefault();
            e.stopPropagation();
            return;
          }

          if (btn.disabled || btn.hasAttribute('data-unavailable') || btn.hasAttribute('aria-disabled')) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }

          selectColor(key, colorKey, sw);
        }, {passive: false});

        if (key === 'sheet' || key === 'duvet') {
          const sizeSelect = item.querySelector(key === 'sheet' ? '.js-size' : '.js-size-duvet');
          const sizeList = key === 'sheet' ? SHEET_SIZES : DUVET_SIZES;
          if (sizeSelect) {
            sizeSelect.innerHTML = sizeList.map(s =>
                    `<option value="${s.key}">${s.label}</option>`
            ).join('');
            sizeSelect.value = state[key].size;
            sizeSelect.addEventListener('change', () => {
              const requestedSize = sizeSelect.value;
              const availableSizes = getAvailableSizes(key);
              if (availableSizes.length > 0 && !availableSizes.includes(requestedSize)) {
                const fallbackSize = getLastValidSize(key);
                sizeSelect.value = fallbackSize;
                return;
              }

              state[key].size = requestedSize;
              state[key].lastValidSize = requestedSize;
              syncSizeOptions(key, item);
              updateColorAvailability(key, requestedSize);

              const availableColors = getAvailableColors(key, requestedSize);

              if (availableColors.length > 0) {

                state[key].qty = 1;
                state[key].enabled = true;
                qtyInput.value = 1;

                if (!availableColors.includes(state[key].color)) {
                  selectColor(key, availableColors[0], sw);
                } else {
                  sw.querySelectorAll('.swatch').forEach(btn =>
                          btn.setAttribute('aria-selected', btn.dataset.color === state[key].color ? 'true' : 'false')
                  );
                  updateQtyAvailability(key, requestedSize);
                  updateLayer(key);
                }
                recalcTotal();
              } else {
                state[key].color = '';
                state[key].qty = 0;
                state[key].enabled = false;
                updateQtyAvailability(key, requestedSize);
                updateLayer(key);
                recalcTotal();
              }
            });
            syncSizeOptions(key, item);
            updateColorAvailability(key, state[key].size);
          }
        }

        const clamp = (v, maxStock) => {

          const max = maxStock || 99;
          v = parseInt(v);
          if (isNaN(v)) v = 0;
          return Math.max(0, Math.min(max, v));
        };

        const getMaxQty = () => {
          const size = getItemSize(key);
          const hasData = hasValidApiMapping(key, size);
          if (!hasData) {
            return 99;
          }
          const stock = getProductStock(key, state[key].color, size);
          return stock > 0 ? stock : 99;
        };

        qtyInput.value = state[key].qty;

        qtyInput.addEventListener('input', () => {
          const size = getItemSize(key);
          const isAvailable = isProductAvailable(key, state[key].color, size);
          if (!isAvailable) {
            qtyInput.value = 0;
            state[key].qty = 0;
            state[key].enabled = false;
            updateLayer(key);
            updateControls(key, item);
            recalcTotal();
            return;
          }
          const maxQty = getMaxQty();
          const v = clamp(qtyInput.value, maxQty);
          qtyInput.value = v;
          state[key].qty = v;
          state[key].enabled = v > 0;
          updateLayer(key);
          updateControls(key, item);
          recalcTotal();
        });

        dec.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();

          const size = getItemSize(key);
          const isAvailable = isProductAvailable(key, state[key].color, size);
          if (!isAvailable) {
            console.warn(`[setConstructor] Товар недоступен: ${key}, цвет: ${state[key].color}`);
            return;
          }

          const maxQty = getMaxQty();
          const currentQty = state[key].qty || 0;
          const v = clamp(currentQty - 1, maxQty);

          state[key].qty = v;
          qtyInput.value = v;
          state[key].enabled = v > 0;
          updateLayer(key);
          updateControls(key, item);
          recalcTotal();

        }, {passive: false});

        inc.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();

          const size = getItemSize(key);
          const isAvailable = isProductAvailable(key, state[key].color, size);
          if (!isAvailable) {
            console.warn(`[setConstructor] Товар недоступен: ${key}, цвет: ${state[key].color}`);
            return;
          }

          const maxQty = getMaxQty();
          const currentQty = state[key].qty || 0;

          if (maxQty > 0 && currentQty >= maxQty) {

            return;
          }

          if (!state[key].enabled || currentQty === 0) {
            state[key].enabled = true;
            state[key].qty = 1;
            qtyInput.value = 1;
            updateLayer(key);
            updateControls(key, item);
            recalcTotal();

            return;
          }

          const v = clamp(currentQty + 1, maxQty);
          state[key].qty = v;
          qtyInput.value = v;
          recalcTotal();

        }, {passive: false});

        dec.disabled = false;
        dec.removeAttribute('disabled');
        dec.removeAttribute('aria-disabled');
        inc.disabled = false;
        inc.removeAttribute('disabled');
        inc.removeAttribute('aria-disabled');

        const removeBtn = item.querySelector('.js-remove');
        if (removeBtn) {
          removeBtn.addEventListener('click', () => {
            state[key].enabled = false;
            state[key].qty = 0;
            qtyInput.value = 0;
            updateLayer(key);
            updateControls(key, item);
            recalcTotal();
          });
        }

        updateControls(key, item);
        item.setAttribute('data-ui-initialized', 'true');
      });

      Object.keys(state).forEach(updateLayer);
      recalcTotal();
    }

    function updateUIAfterDataLoad() {
      if (deferConstructorUpdateWhileSelectBusy(updateUIAfterDataLoad)) return;

      root.querySelectorAll('.item').forEach(item => {
        const key = item.dataset.item;
        const sw = item.querySelector('.swatches');
        if (!sw) return;

        if (isSizedItem(key)) {
          const firstSize = getFirstAvailableSize(key);
          if (firstSize && !getAvailableSizes(key).includes(state[key].size)) {
            state[key].size = firstSize;
            state[key].lastValidSize = firstSize;
            const select = item.querySelector(key === 'sheet' ? '.js-size' : '.js-size-duvet');
            if (select) select.value = firstSize;
          } else if (firstSize) {
            state[key].lastValidSize = state[key].size;
          }
        }
        syncSizeOptions(key, item);
        updateColorAvailability(key, getItemSize(key));

        const size = getItemSize(key);
        if (!isProductAvailable(key, state[key].color, size)) {
          const firstAvailable = getFirstAvailableColor(key, size);
          if (firstAvailable && firstAvailable !== state[key].color) {
            selectColor(key, firstAvailable, sw);
          } else if (!firstAvailable) {

            state[key].color = '';
            state[key].enabled = false;
            state[key].qty = 0;
            const qtyInput = item.querySelector('.js-qty');
            if (qtyInput) qtyInput.value = 0;
            updateLayer(key);
            updateControls(key, item);
          } else if (firstAvailable === state[key].color) {
            state[key].enabled = true;
            if (state[key].qty <= 0) state[key].qty = 1;
          }
        } else {
          sw.querySelectorAll('.swatch').forEach(btn =>
                  btn.setAttribute('aria-selected', btn.dataset.color === state[key].color ? 'true' : 'false')
          );
        }
      });

      recalcTotal();
    }

    function forceUnlockAll() {
      if (deferConstructorUpdateWhileSelectBusy(forceUnlockAll)) return;
      if (!root) return;

      const duvetItem = root.querySelector('.item[data-item="duvet"]');
      if (duvetItem && !duvetItem.querySelector('.js-size-duvet')) {
        initializeItems();
        return;
      }

      root.querySelectorAll('.item').forEach(item => {
        const key = item.dataset.item;
        syncSizeOptions(key, item);
        updateColorAvailability(key, getItemSize(key));
      });
      updateAddToCartState();
    }

    function init() {
      if (!root) {
        console.warn('Элемент #setConstructor не найден, повторная попытка...');
        setTimeout(init, 100);
        return;
      }
      bootstrapProductDataFromPage();
      initializeItems();

      setTimeout(function () {
        bootstrapProductDataFromPage();
        forceUnlockAll();
      }, 50);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    setTimeout(forceUnlockAll, 100);
    setTimeout(forceUnlockAll, 300);
    setTimeout(forceUnlockAll, 500);
    window.addEventListener('load', forceUnlockAll);

    let dataLoadInterval = null;
    let lastLoadTime = 0;
    const DATA_REFRESH_INTERVAL = 60000;

    async function initStockCheck() {
      let tries = 0;
      const maxTries = 30;

      async function tryLoadData() {

        if (PRODUCT_GEN_UIDS.length === 0) {
          findCatalogAndCollectUIDs();
        }

        if (bootstrapProductDataFromPage()) {
          updateUIAfterDataLoad();
        }

        if (PRODUCT_GEN_UIDS.length > 0 && typeof window.t_cart__loadProductsInfoById === 'function') {
          const success = await loadProductsFromTildaAPI();
          if (success) {
            lastLoadTime = Date.now();
            updateUIAfterDataLoad();

            if (!dataLoadInterval) {
              startPeriodicRefresh();
            }
            return;
          }
        }

        if (tries < maxTries) {
          tries++;
          setTimeout(tryLoadData, 500);
        } else {
          console.warn('[setConstructor] Не удалось загрузить данные из API после', maxTries, 'попыток');

          setTimeout(() => {
            findCatalogAndCollectUIDs();
            initStockCheck();
          }, 5000);
        }
      }

      tryLoadData();
    }

    function startPeriodicRefresh() {
      if (dataLoadInterval) return;

      dataLoadInterval = setInterval(async () => {

        if (Date.now() - lastLoadTime >= DATA_REFRESH_INTERVAL) {

          findCatalogAndCollectUIDs();
          bootstrapProductDataFromPage();

          if (PRODUCT_GEN_UIDS.length > 0 && typeof window.t_cart__loadProductsInfoById === 'function') {
            const success = await loadProductsFromTildaAPI();
            if (success) {
              lastLoadTime = Date.now();
              updateUIAfterDataLoad();

            }
          }
        }
      }, DATA_REFRESH_INTERVAL);
    }

    window.refreshCatalogData = async function () {

      findCatalogAndCollectUIDs();
      bootstrapProductDataFromPage();
      if (PRODUCT_GEN_UIDS.length > 0 && typeof window.t_cart__loadProductsInfoById === 'function') {
        const success = await loadProductsFromTildaAPI();
        if (success) {
          lastLoadTime = Date.now();
          updateUIAfterDataLoad();

          return true;
        }
      }
      console.warn('[setConstructor] Не удалось обновить данные');
      return false;
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStockCheck);
    } else {
      initStockCheck();
    }
    window.addEventListener('load', initStockCheck);

    let bootstrapUpdateTimer = null;

    function scheduleBootstrapUpdate() {
      clearTimeout(bootstrapUpdateTimer);
      bootstrapUpdateTimer = setTimeout(function () {
        if (deferConstructorUpdateWhileSelectBusy(scheduleBootstrapUpdate)) return;

        findCatalogAndCollectUIDs();
        if (bootstrapProductDataFromPage()) {
          updateUIAfterDataLoad();
        }
      }, 180);
    }

    window.addEventListener('selfles:products-manifest-ready', scheduleBootstrapUpdate);
    window.addEventListener('load', scheduleBootstrapUpdate);

    if (typeof MutationObserver !== 'undefined') {
      const observer = new MutationObserver(function (records) {
        const onlyConstructorChanged = records.length > 0 && records.every(function (record) {
          return root && record.target && (record.target === root || root.contains(record.target));
        });

        if (onlyConstructorChanged) return;
        scheduleBootstrapUpdate();
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    }

    const addBtn = document.getElementById('addToCart');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        const picks = [];
        for (const itemKey of Object.keys(state)) {
          const s = state[itemKey];
          if (!s.enabled || !s.qty) continue;
          const size = isSizedItem(itemKey) ? s.size : null;
          if (!isProductAvailable(itemKey, s.color, size)) {
            console.warn(`Товар недоступен: ${itemKey}, цвет: ${s.color}${size ? ', размер: ' + size : ''}`);
            continue;
          }
          picks.push({itemKey, color: s.color, size, qty: s.qty});
        }

        if (!picks.length) {
          alert('Выберите хотя бы одну позицию');
          return;
        }

        for (const pick of picks) {
          addProductViaCatalog(pick.itemKey, pick.color, pick.size, pick.qty);
        }

        setTimeout(() => {
          if (window.tcart__openCart) window.tcart__openCart();
        }, 100);
      });
    }

    document.querySelectorAll('#deskInfo .acc-head').forEach(btn => {
      btn.addEventListener('click', () => {
        const section = btn.closest('.acc');
        const body = section.querySelector('.acc-body');
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        if (expanded) {
          body.hidden = true;
          section.classList.add('acc-closed');
          section.classList.remove('acc-open');
        } else {
          body.hidden = false;
          section.classList.add('acc-open');
          section.classList.remove('acc-closed');
        }
      });
    });
  })();
</script>
