<script>

  function cleanSku(v){var s=String(v||'').replace(/^\s*(sku|артикул|арт\.?|art\.?|vendor\s+code)\s*:?\s*/i,'').trim().toUpperCase(),al=window.SELFLES_SKU_ALIASES||{};return String(al[s]||al[s.replace(/\s+/g,'')]||s).trim().toUpperCase();}
  function parseSku(v){var ext=window.SELFLES_PRODUCT_DATA&&window.SELFLES_PRODUCT_DATA.parseSku,s=cleanSku(v),m;if(typeof ext==='function'){try{m=ext(s);if(m&&m.type&&m.color)return m;}catch(e){}}
    m=s.match(/^N([PGCBSW])-?/);if(m)return{sku:s,type:'pillowcase',color:CODE[m[1]]||''};

  function skuFromCard(c){var n,v,m,ids=[],link,url;if(!c)return'';
    n=c.querySelector('.js-product-sku,.js-store-prod-sku,.t-store__card__sku,[data-product-sku],[data-sku]');
    if(n){v=cleanSku(attr(n,['data-product-sku','data-sku','data-selfles-sku'])||txt(n));if(v&&!/^\d+$/.test(v)&&parseSku(v))return v;}
    v=cleanSku(attr(c,['data-selfles-sku','data-product-sku','data-sku']));if(v&&!/^\d+$/.test(v)&&parseSku(v))return v;
    ['data-product-gen-uid','data-product-uid','data-product-lid'].forEach(function(name){var id=c.getAttribute&&c.getAttribute(name);if(id)ids.push(id);});
    String(c.getAttribute&&c.getAttribute('data-product-part-uid')||'').split(',').forEach(function(id){if(id)ids.push(id.trim());});
    link=c.querySelector('a[href*="/tproduct/"],a[href*="/catalog/tproduct/"],a[href*="/product/"]');url=attr(c,['data-product-url'])||(link&&(link.getAttribute('href')||link.href))||'';m=String(url).match(/\/tproduct\/(\d+)-/);if(m)ids.push(m[1]);

  function rename(c){var p,title,label,orig;if(!c||c.classList.contains('js-product-relevant')||c.classList.contains('selfles-related-card'))return;if(closest(c,'.t-store__prod-popup,.t-store__product-popup,.t-store__product-snippet,.t-store__cart,.t706'))return;p=parseSku(skuFromCard(c));if(!p||!p.color||!LABEL[p.color])return;if(!(p.type==='pillowcase'||p.type==='duvet'||p.type==='sheet'))return;title=c.querySelector('.t-store__card__title,.js-product-name,.js-store-prod-name');if(!title)return;label=LABEL[p.color];orig=title.getAttribute('data-selfles-card-title-original')||title.getAttribute('data-selfles-title-raw')||txt(title);if(orig&&orig!==label)title.setAttribute('data-selfles-card-title-original',orig);if(txt(title)!==label)title.textContent=label;title.setAttribute('data-selfles-card-title-mode','color');c.setAttribute('data-selfles-card-title-mode','color');c.setAttribute('data-selfles-card-color',p.color);}

  function cards(t){return t?Array.prototype.slice.call(t.children).filter(function(n){return n.matches&&n.matches('.js-product.t-store__card,.t-store__card')&&!n.classList.contains('js-product-relevant');}):[];}

  function waitChange(r,g,t,before,done){var start=Date.now();(function check(){absorb(g,t);applyLabels(t);if(cards(t).length>before||!canMore(r)||Date.now()-start>2500){done();return;}setTimeout(check,100);})();}
  function setup(rec){var g,t,prev,next,state;if(!rec||TECH[rec.id]||!visible(rec)||rec.getAttribute('data-selfles-main-store-ready')==='1')return;g=grid(rec);t=track(g);if(!g||!t||!cards(t).length)return;rec.setAttribute('data-selfles-main-store-ready','1');rec.classList.add('selfles-main-store-ready');g.classList.add('selfles-main-store-viewport');t.classList.add('selfles-main-store-track');applyLabels(t);prev=arrow('prev');next=arrow('next');g.appendChild(prev);g.appendChild(next);state={index:0,loading:false,timer:null};
    function refresh(){var pv,cs,more,max,off;absorb(g,t);applyLabels(t);pv=perView();cs=cards(t);more=canMore(rec);max=Math.max(0,cs.length-pv);if(!cs.length)return;if(cs.length<=pv&&!more){state.index=0;t.style.setProperty('transform','translate3d(0,0,0)','important');t.style.setProperty('justify-content','center','important');prev.style.display='none';next.style.display='none';prev.disabled=true;next.disabled=true;next.classList.remove('is-loading');next.setAttribute('aria-busy','false');return;}t.style.removeProperty('justify-content');if(state.index>max)state.index=max;off=cs[state.index]?cs[state.index].offsetLeft-cs[0].offsetLeft:0;t.style.setProperty('transform','translate3d('+(-off)+'px,0,0)','important');prev.disabled=state.index<=0;next.classList.toggle('is-loading',!!state.loading);next.setAttribute('aria-busy',state.loading?'true':'false');next.disabled=!state.loading&&state.index>=max&&!more;prev.style.display='';next.style.display='';}
    function go(dir){var pv=perView(),cs=cards(t),max=Math.max(0,cs.length-pv),before,b;if(state.loading)return;if(dir>0&&state.index>=max&&canMore(rec)){b=lmBtn(rec);before=cs.length;state.loading=true;refresh();b.click();waitChange(rec,g,t,before,function(){state.loading=false;cs=cards(t);max=Math.max(0,cs.length-pv);state.index=Math.min(state.index+pv,max);refresh();});return;}state.index=dir>0?Math.min(state.index+pv,max):Math.max(state.index-pv,0);refresh();}
    prev.addEventListener('click',function(){go(-1);});next.addEventListener('click',function(){go(1);});window.addEventListener('resize',function(){clearTimeout(state.timer);state.timer=setTimeout(refresh,120);});rec._selflesMainStoreRefresh=refresh;refresh();setTimeout(refresh,400);setTimeout(refresh,1200);
  }
  function run(){if(!isMain())return;document.body.classList.add('selfles-main-catalog-rows-page');applyLabels();all('.t-rec').forEach(function(r){if(r.querySelector('.t-store,.js-store')&&r.querySelector('.js-store-grid-cont')){setup(r);if(typeof r._selflesMainStoreRefresh==='function')r._selflesMainStoreRefresh();}});}
