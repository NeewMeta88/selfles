<style>
  /* Контейнер тостов — ПРАВЫЙ ВЕРХ */
  #ucToast {
    position: fixed;
    top: 16px;                 /* ← если нужен правый НИЗ — смени на bottom:16px; и убери top */
    right: 16px;
    z-index: 2147483640 !important; /* выше любых Zero/Cart */
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;      /* клики только по самим карточкам */
  }

  /* Карточка тоста */
  .uc-toast {
    pointer-events: auto;
    min-width: 260px;
    max-width: min(92vw, 420px);
    background: #EE413C;          /* тёмный фон */
    color: #ffffff;
    border-radius: 20px;
    box-shadow: 0 14px 38px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.25);
    overflow: hidden;
    transform: translateY(-8px);
    opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
    will-change: transform, opacity;
    font: 400 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
  }

  /* Появление */
  .uc-toast.uc-toast--show {
    transform: translateY(0);
    opacity: 1;
  }

  /* Контент */
  .uc-toast__inner {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 12px 14px;
  }
  .uc-toast__icon {
    width: 20px; height: 20px; flex: 0 0 20px;
    margin-top: 2px;
  }
  .uc-toast__title {
    font-weight: 800; font-size: 14px; color: #fff; margin-bottom: 2px;
  }
  .uc-toast__text {
    color: #ffffff; font-size: 13px;
  }
  .uc-toast__close {
    border: 0; background: transparent; color: #fff; opacity: .6; cursor: pointer;
    font-size: 18px; line-height: 1; padding: 2px 4px; margin: -6px -6px 0 0;
  }
  .uc-toast__close:hover { opacity: 1 }

  /* Полоска прогресса (автозакрытие) */
  .uc-toast__bar {
    height: 3px; background: #EE413C; width: 100%;
    transform-origin: left center;
    transform: scaleX(1);
    transition: transform linear;
  }

  /* Уважение reduce-motion */
  @media (prefers-reduced-motion: reduce){
    .uc-toast, .uc-toast__bar { transition: none }
  }

  /* помести рядом с остальным CSS тоста */
  .uc-toast__link{
    color:#FFFFFF;
    text-decoration:underline;
    text-underline-offset:2px;
    font-weight:600;
    white-space:nowrap;
  }
  .uc-toast__link:focus,
  .uc-toast__link:hover{ opacity:.9 }

</style>
