<script>
(function () {
  var INIT_ATTR = 'data-selfles-product-variant-scroll-fix';
  var STORAGE_KEY = 'selflesProductVariantNavigation';
  var PRODUCT_ANCHOR = 'rec2310894021';

  if (document.documentElement.getAttribute(INIT_ATTR) === '1') return;
  document.documentElement.setAttribute(INIT_ATTR, '1');

  var COLOR_ORDER = ['pink', 'green', 'coffee', 'blue', 'cream', 'white'];
  var COLOR_BY_CODE = {P: 'pink', G: 'green', C: 'coffee', B: 'blue', S: 'cream', W: 'white'};

  function all(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  function closest(node, selector) {
    if (!node || !node.closest) return null;
    return node.closest(selector);
  }

  function norm(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/&nbsp;/g, ' ')
      .replace(/\u00a0/g, ' ')
      .replace(/["'«»]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function sizeKey(value) {
    return norm(value)
      .replace(/[×хx]/g, 'x')
      .replace(/\s+/g, '')
      .replace(/см/g, '')
      .replace(/,/g, '.');
  }

  function sizeOptionKey(type, value) {
    var raw = sizeKey(value);
    var labels;
    var key;

    if (!raw) return '';

    labels = type === 'duvet'
      ? {'150': '150 х 200', '180': '180 х 210', '200': '200 х 220', '220': '220 х 240'}
      : {'160': '160 х 200 х 30', '180': '180 х 200 х 30', 'EUR': '220 х 240 (без резинки)', 'KS': '240 х 260 (без резинки)'};

    if (labels[raw] || raw === '150' || raw === '180' || raw === '200' || raw === '220' || raw === '160' || raw === 'EUR' || raw === 'KS') {
      return raw;
    }

    for (key in labels) {
      if (sizeKey(labels[key]) === raw || sizeKey(key) === raw) return key;
    }

    return raw;
  }

  function colorKey(value) {
    var raw = norm(value).replace(/[^a-zа-я0-9]+/g, '');

    if (!raw) return '';
    if (raw === 'pink' || raw === 'rose' || raw === 'розовый' || raw === 'розовая' || raw === 'red' || raw === 'красный' || raw === 'красная') return 'pink';
    if (raw === 'green' || raw === 'зеленый' || raw === 'зеленая') return 'green';
    if (raw === 'coffee' || raw === 'coffe' || raw === 'brown' || raw === 'кофейный' || raw === 'кофейная' || raw === 'коричневый') return 'coffee';
    if (raw === 'blue' || raw === 'cyan' || raw === 'голубой' || raw === 'голубая' || raw === 'синий') return 'blue';
    if (raw === 'cream' || raw === 'ivory' || raw === 'milk' || raw === 'сливочный' || raw === 'молочный') return 'cream';
    if (raw === 'white' || raw === 'белый' || raw === 'белая') return 'white';

    return raw;
  }

  function isProductPage() {
    var path = location.pathname.replace(/\/+$/, '');
    return path.indexOf('/tproduct/') !== -1 ||
      path.indexOf('/catalog/tproduct/') !== -1 ||
      path.indexOf('/product/') !== -1;
  }

  function parseSku(value) {
    var sku = String(value || '').trim().toUpperCase();
    var match;

    match = sku.match(/^PP(150|180|220)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'duvet', size: match[1], color: COLOR_BY_CODE[match[2]]};

    match = sku.match(/^PP([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'duvet', size: '200', color: COLOR_BY_CODE[match[1]]};

    match = sku.match(/^P(160|180)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'sheet', size: match[1], color: COLOR_BY_CODE[match[2]]};

    match = sku.match(/^P(KS|EUR)([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'sheet', size: match[1], color: COLOR_BY_CODE[match[2]]};

    match = sku.match(/^N([PGCBSW])-?/);
    if (match) return {sku: sku, type: 'pillowcase', size: null, color: COLOR_BY_CODE[match[1]]};

    return null;
  }

  function normalizeUrl(value) {
    var url;

    if (!value) return '';

    try {
      url = new URL(value, location.href);
    } catch (e) {
      return '';
    }

    if (url.origin !== location.origin) return '';
    return url.pathname + url.search;
  }

  function withProductAnchor(value) {
    var url;

    try {
      url = new URL(value, location.href);
    } catch (e) {
      return value;
    }

    url.hash = PRODUCT_ANCHOR;
    return url.pathname + url.search + url.hash;
  }

  function quantityAvailable(value) {
    var num;
    var raw = String(value == null ? '' : value).trim();

    if (raw === '') return false;
    if (/^(notlimited|unlimited)$/i.test(raw)) return true;

    num = Number(raw.replace(',', '.'));
    return isFinite(num) && num > 0;
  }

  function parseVariantsHash(hash) {
    return String(hash || '')
      .split('|')
      .map(function (chunk) {
        var parts = chunk.split(':');
        var sku = parts.shift() || '';
        var quantity = parts.shift() || '';
        var price = parts.length > 1 ? parts.pop() : '';
        var url = parts.join(':');
        var parsed = parseSku(sku);

        if (!parsed) return null;

        parsed.url = url;
        parsed.quantity = quantity;
        parsed.price = price;
        parsed.available = quantityAvailable(quantity) && !!url;
        return parsed;
      })
      .filter(Boolean);
  }

  function getCurrentSku(optionsRoot) {
    var sku = optionsRoot && optionsRoot.getAttribute('data-selfles-sku');
    var skuNode;

    if (sku) return sku.trim().toUpperCase();

    skuNode = document.querySelector('.js-product-sku, .js-store-prod-sku, .t-store__prod-popup__sku, .t-store__prod__sku');
    return skuNode ? String(skuNode.textContent || '').trim().toUpperCase() : '';
  }

  function optionValue(option, kind) {
    if (!option) return '';
    if (kind === 'color') {
      return option.getAttribute('data-color') || option.getAttribute('aria-label') || option.getAttribute('title') || option.textContent || '';
    }

    return option.getAttribute('data-size') || option.getAttribute('aria-label') || option.getAttribute('title') || option.textContent || '';
  }

  function isSelected(option) {
    return !!option && (
      option.getAttribute('aria-selected') === 'true' ||
      option.classList.contains('is-active') ||
      option.classList.contains('active') ||
      option.classList.contains('selected')
    );
  }

  function findSelectedSize(optionsRoot, type, current) {
    var found = current && current.size || '';

    all('.selfles-product-options__size, .selfles-product-options__sizes button', optionsRoot).some(function (button) {
      if (!isSelected(button)) return false;
      found = sizeOptionKey(type, optionValue(button, 'size'));
      return !!found;
    });

    return found;
  }

  function findSelectedColor(optionsRoot, current) {
    var found = current && current.color || '';

    all('.selfles-product-options__color, .selfles-product-options__colors button, .swatch', optionsRoot).some(function (button) {
      if (!isSelected(button)) return false;
      found = colorKey(optionValue(button, 'color'));
      return !!found;
    });

    return found;
  }

  function findVariant(variants, type, size, color) {
    return variants.find(function (variant) {
      return variant.available &&
        variant.type === type &&
        String(variant.size || '') === String(size || '') &&
        variant.color === color;
    }) || null;
  }

  function firstAvailableVariantForSize(variants, type, size) {
    var target = null;

    COLOR_ORDER.some(function (color) {
      target = findVariant(variants, type, size, color);
      return !!target;
    });

    return target;
  }

  function getClickedOption(target) {
    var option = closest(target, [
      '.selfles-product-options__size',
      '.selfles-product-options__color',
      '.selfles-product-options__sizes button',
      '.selfles-product-options__colors button',
      '.selfles-product-options button'
    ].join(','));

    if (!option) return null;
    if (closest(option, '#rec2417486561')) return null;
    if (option.disabled) return null;
    if (option.getAttribute('aria-disabled') === 'true') return null;
    if (option.getAttribute('data-selfles-option-blocked') === '1') return null;
    if (option.getAttribute('data-unavailable') === 'true') return null;
    if (option.classList.contains('selfles-option-disabled') || option.classList.contains('is-disabled')) return null;

    return option;
  }

  function markVariantNavigation(targetUrl) {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({at: Date.now(), href: location.href, target: targetUrl}));
    } catch (e) {}

    document.documentElement.classList.add('selfles-variant-navigation-pending');
  }

  function readNavigationMark() {
    var raw;
    var parsed;

    try {
      raw = sessionStorage.getItem(STORAGE_KEY);
      parsed = raw ? JSON.parse(raw) : null;
    } catch (e) {
      parsed = null;
    }

    if (!parsed || !parsed.at) return null;
    if (Date.now() - Number(parsed.at) > 20000) return null;

    return parsed;
  }

  function clearNavigationMark() {
    try {
      sessionStorage.removeItem(STORAGE_KEY);
    } catch (e) {}

    document.documentElement.classList.remove('selfles-variant-navigation-pending');
  }

  function getProductRoot() {
    return document.getElementById(PRODUCT_ANCHOR) ||
      document.querySelector('.t-store__product-snippet') ||
      document.querySelector('.js-store-product.js-product') ||
      document.querySelector('.selfles-product-main-layout');
  }

  function scrollToProductTop() {
    var root;

    if (!isProductPage()) return;
    if (!readNavigationMark() && location.hash !== '#' + PRODUCT_ANCHOR) return;

    root = getProductRoot();

    try {
      window.scrollTo({top: 0, left: 0, behavior: 'auto'});
    } catch (e) {
      window.scrollTo(0, 0);
    }

    if (root && root.scrollIntoView) {
      try {
        root.scrollIntoView({block: 'start', inline: 'nearest', behavior: 'auto'});
      } catch (e) {
        root.scrollIntoView(true);
      }
    }
  }

  function scheduleProductScrollReset() {
    if (!isProductPage()) return;
    if (!readNavigationMark() && location.hash !== '#' + PRODUCT_ANCHOR) return;

    scrollToProductTop();
    [40, 120, 300, 700, 1300, 2200].forEach(function (delay) {
      setTimeout(scrollToProductTop, delay);
    });
    setTimeout(clearNavigationMark, 2600);
  }

  function handleVariantClick(event) {
    var option;
    var optionsRoot;
    var variants;
    var current;
    var type;
    var size;
    var color;
    var target;
    var targetUrl;

    if (!isProductPage()) return;
    if (!event || event.type !== 'click') return;

    option = getClickedOption(event.target);
    if (!option) return;

    optionsRoot = closest(option, '.selfles-product-options');
    if (!optionsRoot) return;

    variants = parseVariantsHash(optionsRoot.getAttribute('data-selfles-variants-hash'));
    current = parseSku(getCurrentSku(optionsRoot));
    type = current && current.type;

    if (!type || !variants.length) return;

    size = findSelectedSize(optionsRoot, type, current);
    color = findSelectedColor(optionsRoot, current);

    if (option.classList.contains('selfles-product-options__size') || closest(option, '.selfles-product-options__sizes')) {
      size = sizeOptionKey(type, optionValue(option, 'size'));
      target = findVariant(variants, type, size, color) || firstAvailableVariantForSize(variants, type, size);
    } else {
      color = colorKey(optionValue(option, 'color'));
      target = findVariant(variants, type, size, color);
    }

    if (!target || !target.url) return;

    targetUrl = withProductAnchor(target.url);
    if (normalizeUrl(targetUrl) === normalizeUrl(location.href)) {
      markVariantNavigation(targetUrl);
      scheduleProductScrollReset();
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    markVariantNavigation(targetUrl);
    location.assign(targetUrl);
  }

  try {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  } catch (e) {}

  document.addEventListener('click', handleVariantClick, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleProductScrollReset);
  } else {
    scheduleProductScrollReset();
  }

  window.addEventListener('load', scheduleProductScrollReset);
}());
</script>
